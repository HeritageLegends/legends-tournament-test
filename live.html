<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Legends Tournament — Live</title>
<style>
  :root {
    --green: #1e5b3a; --green-dark: #123c26; --gold: #c9a227;
    --bg: #f5f5f0; --card: #ffffff; --border: #d8d8d0;
    --text: #222; --muted: #777; --error: #b3261e; --ok: #1e5b3a;
    --win: #e6f4ea; --lose: #fdecea; --half: #f5f0e0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--green); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 1.2rem; }
  header .sub { font-size: 0.85rem; opacity: 0.85; }
  nav { display: flex; gap: 4px; padding: 0 20px; background: var(--green-dark); flex-wrap: wrap; }
  nav button { background: transparent; border: none; color: #fff; opacity: 0.75; padding: 12px 16px; cursor: pointer; font-size: 0.95rem; border-bottom: 3px solid transparent; }
  nav button.active { opacity: 1; border-bottom-color: var(--gold); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .card h2 { margin-top: 0; font-size: 1.05rem; color: var(--green-dark); }
  select, input[type=number] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  table.grid th, table.grid td { border: 1px solid var(--border); padding: 4px; text-align: center; }
  table.grid th { background: #f0f0ea; font-weight: 600; }
  table.grid td.rowlabel, table.grid th.rowlabel { text-align: left; padding: 6px 8px; white-space: nowrap; font-weight: 600; }
  table.grid .segdivider { border-left: 3px solid var(--green); }
  .status-line { font-size: 0.9rem; margin: 4px 0; }
  .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
  .status-badge.a { background: var(--win); color: var(--green-dark); }
  .status-badge.b { background: var(--lose); color: var(--error); }
  .status-badge.half { background: var(--half); color: #7a5b00; }
  .status-badge.pending { background: #eee; color: var(--muted); }
  .save-indicator { font-size: 0.85rem; margin-left: 12px; }
  .save-indicator.saving { color: var(--muted); }
  .save-indicator.saved { color: var(--ok); }
  .save-indicator.error { color: var(--error); }
  .hint { font-size: 0.8rem; color: var(--muted); }
  [hidden] { display: none !important; }
  button.primary { background: var(--green); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600; }
  button.secondary { background: #fff; color: var(--green); border: 1px solid var(--green); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .view-toggle-btn { background: #fff; border: 1.5px solid var(--border); color: var(--green-dark); padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .view-toggle-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .hbh-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .hbh-nav select { flex: 1; }
  .hbh-nav button { padding: 10px 16px; font-size: 1.1rem; line-height: 1; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; flex-shrink: 0; }
  .hbh-nav button:disabled { opacity: 0.35; }
  .hbh-heading { text-align: center; font-weight: 700; color: var(--green-dark); margin: 10px 0 6px; }
  .hbh-heading .seg { font-weight: 400; color: var(--muted); font-size: 0.85rem; display: block; margin-top: 2px; }
  .hbh-stroke-note { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .hbh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-left: 4px; }

  /* ---- Leaderboard (Scoreboard tab) — modeled on a printed match-play
     leaderboard: Points | pairing | Match | pairing | Points, winning side
     highlighted, with each match's segment statuses stacked in the middle
     column. ---- */
  .lbx-wrap { overflow-x: auto; }
  table.lbx-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  table.lbx-table th, table.lbx-table td { padding: 8px 10px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--border); }
  tr.lbx-head th { background: var(--green-dark); color: #fff; font-weight: 700; border-bottom: none; }
  tr.lbx-head th.lbx-pair-h { text-align: left; }
  td.lbx-pair-h, td.lbx-pair { text-align: left; }
  td.lbx-pts { font-weight: 700; font-size: 1rem; width: 60px; }
  .lbx-names { font-weight: 600; color: var(--green-dark); }
  .lbx-matchnum { font-size: 0.72rem; color: var(--muted); }
  .lbx-match { min-width: 200px; }
  .lbx-seg { font-size: 0.78rem; margin: 2px 0; text-align: left; }
  .lbx-seg-label { color: var(--muted); }
  .lbx-unset { text-align: center; color: var(--muted); font-style: italic; padding: 10px; }
  td.lbx-lead { background: #fbeceb; }
  td.lbx-final-lead { background: var(--error); color: #fff; }
  td.lbx-final-lead .lbx-names { color: #fff; }
  td.lbx-tied { background: #eee; }
  tr.lbx-total td { font-weight: 700; background: var(--green-dark); color: #fff; border-bottom: none; }
  tr.lbx-total td.lbx-pair-h { text-align: left; }

  /* ---- Tournament Total summary (no per-match rows — see dayTotals()) ---- */
  .lbx-total-summary { display: flex; flex-direction: column; gap: 6px; max-width: 480px; }
  .lbx-total-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-weight: 600; background: var(--card); }
  .lbx-total-row span:last-child { font-variant-numeric: tabular-nums; }
  .lbx-total-row.lbx-grand { background: var(--green-dark); color: #fff; font-size: 1.05rem; border-color: var(--green-dark); }

  /* ---- Match Scorecards: Progression (collapsed) ---- */
  .sc-collapsed-match { border-bottom: 1px solid var(--border); padding: 12px 0; }
  .sc-collapsed-match:last-child { border-bottom: none; }
  .match-title { font-weight: 600; color: var(--green-dark); margin-bottom: 4px; }
  .prog-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .prog-seg-label { width: 160px; flex-shrink: 0; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .prog-strip { display: flex; gap: 3px; overflow-x: auto; }
  .prog-chip { flex-shrink: 0; width: 40px; text-align: center; border-radius: 6px; padding: 3px 2px; font-size: 0.72rem; }
  .prog-chip.prog-a { background: var(--win); color: var(--green-dark); }
  .prog-chip.prog-b { background: var(--lose); color: var(--error); }
  .prog-chip.prog-half { background: var(--half); color: #7a5b00; }
  .prog-chip.prog-pending { background: #eee; color: var(--muted); }
  .prog-hole { font-size: 0.62rem; opacity: 0.7; }
  .prog-label { font-weight: 700; }

  /* ---- Match Scorecards: Full Scorecards (expanded) ---- */
  .scorecard-block { border-bottom: 2px solid var(--border); padding: 16px 0; }
  .scorecard-block:last-child { border-bottom: none; }

  /* ---- Live scorecard replica (below Enter Scores) ---- */
  .sc-teams-live { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  table.sc-table-live { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 0.8rem; }
  table.sc-table-live th, table.sc-table-live td { border: 1px solid var(--border); padding: 5px 2px; text-align: center; min-width: 24px; }
  table.sc-table-live th.sc-name, table.sc-table-live td.sc-name { text-align: left; padding: 5px 8px; white-space: nowrap; font-weight: 600; min-width: 120px; }
  table.sc-table-live tr.sc-meta td { font-weight: 600; background: #f0f0ea; }
  table.sc-table-live .sc-dots { color: var(--error); font-weight: 700; letter-spacing: 1px; margin-left: 2px; }
  table.sc-table-live .sc-tee { font-weight: 400; color: var(--muted); font-size: 0.85em; }
  table.sc-table-live tr.sc-wlt td { border-top: none; }
  table.sc-table-live tr.sc-wlt td.sc-name { font-style: italic; color: var(--muted); font-weight: 400; font-size: 0.85em; }
  table.sc-table-live .sc-na { background: #ececec; }
  table.sc-table-live .sc-start-hole { background: #fff176; }
  table.sc-table-live tr.sc-segrow th { background: #e4e4e4; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.02em; }
  table.sc-table-live .seg { border-left: 2px solid #333; }
  table.sc-table-live tr.sc-team-head td { background: var(--green-dark); color: #fff; font-weight: 700; }

  /* ---- Direct hole-winner entry (replaces old gross-score inputs) ---- */
  .wpick-block { padding: 14px 4px; border-bottom: 1px solid var(--border); }
  .wpick-block:last-child { border-bottom: none; }
  .wpick-sides { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .wpick-side { font-weight: 600; flex: 1; }
  .wpick-row { display: flex; gap: 8px; }
  .wpick-btn { flex: 1; padding: 14px 6px; font-size: 1rem; font-weight: 700; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; }
  .wpick-btn.active.wpick-a { background: var(--win); border-color: var(--green); color: var(--green-dark); }
  .wpick-btn.active.wpick-b { background: var(--lose); border-color: var(--error); color: var(--error); }
  .wpick-btn.active.wpick-half { background: var(--half); border-color: var(--gold); color: #7a5b00; }
  .fg-cycle-btn { width: 52px; height: 32px; font-weight: 700; font-size: 0.72rem; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .fg-cycle-btn.fg-win { background: var(--win); border-color: var(--green); color: var(--green-dark); }
  .fg-cycle-btn.fg-loss { background: var(--lose); border-color: var(--error); color: var(--error); }
  .fg-cycle-btn.fg-tie { background: var(--half); border-color: var(--gold); color: #7a5b00; }
  td.fg-na { background: #f5f5f0; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="tournamentTitle">Heritage Legends Tournament</h1>
    <div class="sub">Live Scoring &amp; Scoreboard</div>
  </div>
  <div class="sub" id="envBadge"></div>
</header>
<nav>
  <button class="tab-btn active" data-tab="scoring">Live Scoring</button>
  <button class="tab-btn" data-tab="scoreboard">Scoreboard</button>
</nav>

<main>

  <!-- LIVE SCORING -->
  <section id="tab-scoring" class="tab-panel">
    <div class="card">
      <h2>Enter Scores</h2>
      <div class="row">
        <select id="scDay"><option value="1">Day 1</option><option value="2">Day 2</option></select>
        <select id="scMatch"></select>
        <span id="saveIndicator" class="save-indicator"></span>
      </div>
      <div id="scStatusLines"></div>
      <div class="row" id="scViewToggle" style="margin-top:4px;"></div>
      <div id="scGridWrap"></div>
      <div class="row" style="margin-top:12px;">
        <button class="primary" onclick="saveCurrentMatch()">Save Now</button>
        <span class="hint">Scores also autosave a couple seconds after you stop typing.</span>
      </div>
    </div>

    <div class="card" id="scLiveCardWrap"></div>
  </section>

  <!-- SCOREBOARD -->
  <section id="tab-scoreboard" class="tab-panel" hidden>
    <div class="card">
      <div class="row" id="sbViewToggle">
        <button type="button" class="view-toggle-btn active" data-sbview="leaderboard" onclick="setSbView('leaderboard')">Leaderboard</button>
        <button type="button" class="view-toggle-btn" data-sbview="scorecards" onclick="setSbView('scorecards')">Match Scorecards</button>
      </div>
      <div class="row" style="justify-content:space-between;">
        <select id="sbDay"></select>
        <button class="secondary" onclick="loadScoreboard()">Update</button>
      </div>

      <div id="sbLeaderboard"></div>

      <div id="sbScorecards" hidden>
        <div class="row" id="sbScModeToggle">
          <button type="button" class="view-toggle-btn active" data-scmode="collapsed" onclick="setSbScMode('collapsed')">Progression</button>
          <button type="button" class="view-toggle-btn" data-scmode="expanded" onclick="setSbScMode('expanded')">Full Scorecards</button>
        </div>
        <div id="sbScorecardsBody"></div>
      </div>
    </div>
  </section>

</main>

<script>
// ====================== CONFIG ======================
const CONFIG = {
  test: { backendUrl: 'https://script.google.com/macros/s/AKfycbzw4xeOOwP09RCrILvt5P9iT9S8mpJXLzggO7NrzvEQy-bR-Qtn1-1tEfbEzeRTpQ/exec', key: '8O`I!r5]Hx26' },
  live: { backendUrl: 'https://script.google.com/macros/s/AKfycbxsxCCuBXz-mbDUlVlxL-_V4YtuWqlEl0Q3J4L_z4sN6aiYkB1PvZlHDNLOS4Lh8Wbb/exec', key: '&wW3d@j>3£56' },
};
const envParam = new URLSearchParams(location.search).get('env');
const ENV = (envParam === 'test' || envParam === 'live') ? envParam : (location.href.toLowerCase().includes('test') ? 'test' : 'live');
const CFG = CONFIG[ENV];
// Bumped by hand every time this file changes — see the matching constant in
// index.html and Code.gs.
const LIVE_VERSION = '2026-09-07c';
document.getElementById('envBadge').innerHTML = `${ENV.toUpperCase()}<div style="font-size:11px; opacity:0.75;" id="liveVersionBadge">Page: ${LIVE_VERSION} • Backend: …</div>`;
async function loadVersionBadge() {
  const el = document.getElementById('liveVersionBadge');
  try {
    const res = await apiGet('getVersion');
    el.textContent = `Page: ${LIVE_VERSION} • Backend: ${res.success ? res.data.version : 'unknown'}`;
  } catch (err) {
    el.textContent = `Page: ${LIVE_VERSION} • Backend: unreachable`;
  }
}

// ====================== API HELPERS ======================
async function apiGet(action, extra) {
  const params = new URLSearchParams(Object.assign({ action, key: CFG.key }, extra || {}));
  const res = await fetch(CFG.backendUrl + '?' + params.toString());
  return res.json();
}
async function apiPost(action, body) {
  const res = await fetch(CFG.backendUrl, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: CFG.key }, body || {})) });
  return res.json();
}

// ====================== TABS ======================
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('main > section').forEach((p) => (p.hidden = true));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).hidden = false;
    if (btn.dataset.tab === 'scoreboard') loadScoreboard();
  });
});

// ====================== SHARED STATE ======================
// holeHC: two parallel Stroke Index tables — `default` (every tee except Red)
// and `red` (Red tees only, which play to a different Stroke Index on this
// course). Each is {hole: strokeIndex}.
let settings = {}, roster = [], holeHC = { default: {}, red: {} };
let pairings = { 1: [], 2: [] };
let rosterByName = {}; // Name -> {HandicapIndex, Tee}

function indexRoster() {
  rosterByName = {};
  roster.forEach((p) => { if (p.Name) rosterByName[p.Name] = p; });
}

// Which Stroke Index table a player's tee should use — Red tees get their own
// table, everything else (Gold, White, Blue, blank, ...) shares the main one.
function strokeIndexForTee(tee, hole) {
  const isRed = (tee || '').trim().toLowerCase() === 'red';
  const table = isRed ? holeHC.red : holeHC.default;
  const row = table ? table[hole] : undefined;
  return row ? row.StrokeIndex : undefined;
}
// Par doesn't change by tee, so it only lives in the default table.
function parForHole(hole) {
  const row = holeHC.default ? holeHC.default[hole] : undefined;
  return row ? row.Par : '';
}
function playerTee(name) {
  const p = rosterByName[name];
  return p ? p.Tee : '';
}

// Course Handicap = Handicap Index x (Slope/113) + (Course Rating - Par),
// per this course's own rating/slope for each tee (Par 72 both tees):
//   Red:  Slope 111, Rating 64.1
//   Gold: Slope 120, Rating 67.1 (also used for any tee other than Red)
// This is what actually gets used for strokes everywhere — matches the same
// formula in index.html so Roster, print, and live scoring never disagree.
function courseHandicap(handicapIndex, tee) {
  const idx = parseFloat(handicapIndex);
  if (isNaN(idx)) return '';
  const isRed = (tee || '').trim().toLowerCase() === 'red';
  const ch = isRed ? (idx * 111 / 113 + (64.1 - 72)) : (idx * 120 / 113 + (67.1 - 72));
  return Math.round(ch);
}

// strokes a player receives on one hole, from their Course Handicap
function strokesOnHole(handicapIndex, strokeIndex) {
  const hc = parseFloat(handicapIndex);
  const si = parseInt(strokeIndex, 10);
  if (isNaN(hc) || isNaN(si) || hc <= 0) return 0;
  const rounded = Math.round(hc);
  const base = Math.floor(rounded / 18);
  const extra = (si <= (rounded % 18)) ? 1 : 0;
  return base + extra;
}
// Winner fields are stored directly as 'A' | 'B' | 'Half' | '' (not yet
// entered) — this normalizes that into a 'A'|'B'|'Half'|'pending' shape so
// every downstream tally/display helper (buildSegmentResult,
// wltResultCellsHtml, progressionStripHtml, …) has a single consistent
// vocabulary to work with, blank/undefined included.
function normalizeWinner(w) {
  return (w === 'A' || w === 'B' || w === 'Half') ? w : 'pending';
}
// A single stored Winner-type field ('A'|'B'|'Half'|'') viewed from one
// particular side's own perspective, as a self-explanatory word instead of
// a letter — 'Win' if this side won, 'Tie' if halved, 'Loss' if the other
// side won, blank if not entered yet.
function resultWordFor(value, perspective) {
  if (!value) return '';
  if (value === 'Half') return 'Tie';
  return value === perspective ? 'Win' : 'Loss';
}
// Cycles a full-grid cell from one side's own perspective: blank -> Win ->
// Tie -> Loss -> blank. Setting "Win" for one side is the exact same
// underlying value as "Loss" for the other side — they're just two mirrored
// views of one shared per-hole result — so ticking Win on one side's row
// automatically flips the other side's row to Loss, with nothing extra to
// keep in sync.
function nextResultValue(current, perspective) {
  const other = perspective === 'A' ? 'B' : 'A';
  const order = ['', perspective, 'Half', other];
  const idx = order.indexOf(current || '');
  return order[(idx + 1) % order.length];
}

async function loadShared() {
  const [sRes, rRes, hRes, hRedRes, p1Res, p2Res] = await Promise.all([
    apiGet('getSettings'), apiGet('getRoster'), apiGet('getHoleHandicaps'), apiGet('getHoleHandicapsRed'), apiGet('getPairings', { day: '1' }), apiGet('getPairings', { day: '2' }),
  ]);
  if (sRes.success) { settings = sRes.data; document.getElementById('tournamentTitle').textContent = settings.TournamentName || 'Heritage Legends Tournament'; }
  if (rRes.success) { roster = rRes.data; indexRoster(); }
  if (hRes.success) {
    holeHC.default = {};
    hRes.data.forEach((row) => { if (row.Hole) holeHC.default[row.Hole] = { StrokeIndex: row.StrokeIndex, Par: row.Par }; });
  }
  if (hRedRes.success) {
    holeHC.red = {};
    hRedRes.data.forEach((row) => { if (row.Hole) holeHC.red[row.Hole] = { StrokeIndex: row.StrokeIndex }; });
  }
  if (p1Res.success) pairings['1'] = p1Res.data;
  if (p2Res.success) pairings['2'] = p2Res.data;
}

function teamNames() {
  return { A: settings.TeamAName || 'Team A', B: settings.TeamBName || 'Team B' };
}
// Mirrors isDayLocked_ in Code.gs — the server enforces this on every save
// regardless, but checking it here too lets the UI show a clear "locked"
// message instead of scorekeepers hitting a failed-save error after typing.
function dayIsLocked(day) {
  const v = settings[day === '2' ? 'Day2Locked' : 'Day1Locked'];
  return v === true || v === 'TRUE' || v === 'true';
}
function matchLabel(day, row) {
  const has = row.TeamA_P1 || row.TeamA_P2 || row.TeamB_P1 || row.TeamB_P2;
  if (!has) return `Match ${row.MatchNum} (not set up yet)`;
  return `Match ${row.MatchNum}: ${row.TeamA_P1 || '?'} / ${row.TeamA_P2 || '?'}  vs  ${row.TeamB_P1 || '?'} / ${row.TeamB_P2 || '?'}`;
}
// Roster names are stored "Last, First" — the leaderboard shows just the last
// name (before the comma) to keep the table compact. Falls back to whatever
// was typed if there's no comma (e.g. a name entered as "First Last").
function lastName(name) {
  if (!name) return '?';
  const idx = name.indexOf(',');
  return idx === -1 ? name : name.slice(0, idx).trim();
}
function hasPlayersLb(row) {
  return !!(row.TeamA_P1 || row.TeamA_P2 || row.TeamB_P1 || row.TeamB_P2);
}
// Points are always in 0.5 steps — format drops a trailing ".0" but keeps ".5".
function formatPts(n) {
  return (Math.round(n * 2) / 2).toString();
}

// ====================== LIVE SCORING ======================
let currentHoles = []; // in-memory grid for the currently selected match
// Pending autosaves, keyed by "day_matchNum" — a separate timer per match
// rather than one shared timer, so editing a different match (or just
// switching which match you're viewing) never cancels or overwrites another
// match's still-pending save. Each entry captures the day/matchNum/holes it
// was scheduled for, so it always saves the right data to the right match
// even after you've navigated away — see scheduleAutosave/saveCurrentMatch.
let saveTimers = {};
let scViewMode = 'hbh'; // 'hbh' (one hole at a time) | 'grid' (full 18-hole scorecard)
let scHoleIndex = 0; // 0-based, 0..17 — which hole the hbh view is showing

// ---- per-match PIN gate ----
// A match's PIN (set by the admin in the Pairings table) is optional — blank
// means anyone with this link can still enter that match's scores, same as
// before this existed. When set, this device has to enter it once; it's then
// remembered here (localStorage) so the same phone doesn't have to re-enter
// it every time. This only gates the score-ENTRY UI — the Scoreboard tab is
// unaffected and stays open/read-only to everyone regardless.
function pinStorageKey(day, matchNum) { return `legends_pin_${ENV}_${day}_${matchNum}`; }
function getStoredPin(day, matchNum) {
  try { return localStorage.getItem(pinStorageKey(day, matchNum)); } catch (e) { return null; }
}
function storePin(day, matchNum, pin) {
  try { localStorage.setItem(pinStorageKey(day, matchNum), pin); } catch (e) {}
}
function matchIsUnlocked(day, matchNum, pairingRow) {
  // String(...) first: a PIN that's all digits (e.g. "0483") can come back from
  // the Sheet as an actual number rather than text, and a number has no
  // .trim() — this coercion keeps that from crashing the page either way.
  const requiredPin = String((pairingRow && pairingRow.PIN) || '').trim();
  if (!requiredPin) return true; // no PIN set for this match — open to anyone
  return getStoredPin(day, matchNum) === requiredPin;
}

document.getElementById('scDay').addEventListener('change', onScDayOrMatchChange);
document.getElementById('scMatch').addEventListener('change', onScMatchSelected);

function populateMatchDropdown() {
  const day = document.getElementById('scDay').value;
  const sel = document.getElementById('scMatch');
  sel.innerHTML = '';
  pairings[day].forEach((row) => {
    const opt = document.createElement('option');
    opt.value = row.MatchNum;
    opt.textContent = matchLabel(day, row);
    sel.appendChild(opt);
  });
}
function onScDayOrMatchChange() { populateMatchDropdown(); onScMatchSelected(); }
async function onScMatchSelected() {
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  scHoleIndex = 0;
  if (!matchNum) { currentHoles = []; renderScoringUI(day, matchNum); return; }
  const res = await apiGet('getScores', { day });
  const rows = res.success ? res.data.filter((r) => String(r.MatchNum) === String(matchNum)) : [];
  currentHoles = buildHoleGrid(day, matchNum, rows);
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  // Jump straight to the first hole that still needs a result, so a
  // scorekeeper picking up mid-round doesn't have to page through
  // already-entered holes. Search starts at this match's own Start Hole and
  // wraps around 1..18 — a shotgun match starting at, say, hole 13 lands on
  // hole 13 (not hole 1, which for that match hasn't been played yet and
  // never will read as "done"). Falls back to the start hole itself if
  // everything's blank or everything's already entered.
  const startNum = startHoleNumberOf(pairingRow && pairingRow.StartHole) || 1;
  const startIdx = startNum - 1;
  let firstBlankIdx = startIdx;
  for (let i = 0; i < 18; i++) {
    const idx = (startIdx + i) % 18;
    if (holeIsBlank(day, currentHoles[idx])) { firstBlankIdx = idx; break; }
  }
  scHoleIndex = firstBlankIdx;
  renderScoringUI(day, matchNum);
}

function holeIsBlank(day, holeRow) {
  if (day === '2') {
    return holeRow.Hole <= 9 ? !holeRow.BestBallWinner : !(holeRow.MP1Winner && holeRow.MP2Winner);
  }
  return !holeRow.Winner;
}

function buildHoleGrid(day, matchNum, existingRows) {
  const byHole = {};
  existingRows.forEach((r) => { byHole[r.Hole] = r; });
  const holes = [];
  for (let h = 1; h <= 18; h++) {
    const r = byHole[h] || {};
    if (day === '2') {
      holes.push({ Hole: h, BestBallWinner: r.BestBallWinner || '', MP1Winner: r.MP1Winner || '', MP2Winner: r.MP2Winner || '' });
    } else {
      holes.push({ Hole: h, Winner: r.Winner || '' });
    }
  }
  return holes;
}

// Top-level dispatcher: shows the view toggle (once a match is picked) and
// renders whichever of the two score-entry views is currently selected.
function renderScoringUI(day, matchNum) {
  const toggleEl = document.getElementById('scViewToggle');
  // The live scorecard replica is read-only, so it's shown regardless of
  // PIN-lock state — same policy as the Scoreboard tab.
  renderLiveScorecard(day, matchNum);
  if (!matchNum) {
    toggleEl.innerHTML = '';
    renderFullGrid(day, matchNum);
    return;
  }
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  if (!matchIsUnlocked(day, matchNum, pairingRow)) {
    toggleEl.innerHTML = '';
    renderPinLock(day, matchNum, pairingRow);
    return;
  }
  if (dayIsLocked(day)) {
    toggleEl.innerHTML = '';
    document.getElementById('scStatusLines').innerHTML = '';
    document.getElementById('scGridWrap').innerHTML = `
      <div class="card" style="margin:0; background:#fdecea; border-color:var(--error);">
        <p class="hint" style="margin-top:0; color:var(--error); font-weight:600;">Day ${escapeHtml(day)} results are locked by the admin — scores can no longer be changed. The scorecard below still reflects the final results.</p>
      </div>
    `;
    return;
  }
  toggleEl.innerHTML = `
    <button type="button" class="view-toggle-btn ${scViewMode === 'hbh' ? 'active' : ''}" onclick="setScView('hbh')">Enter Scores</button>
    <button type="button" class="view-toggle-btn ${scViewMode === 'grid' ? 'active' : ''}" onclick="setScView('grid')">Full Scorecard</button>
    ${pairingRow && pairingRow.PIN ? `<button type="button" class="secondary" style="margin-left:auto;" onclick="lockMatch('${day}', '${matchNum}')">Change PIN</button>` : ''}
  `;
  if (scViewMode === 'hbh') renderHoleByHole(day, matchNum);
  else renderFullGrid(day, matchNum);
}

// Clears this device's remembered PIN for this match and re-shows the lock
// screen — for handing the phone to a different foursome, or if the wrong
// code got saved. (If the admin changes a match's PIN, this device is
// automatically re-locked next time it's selected — no need for this.)
function lockMatch(day, matchNum) {
  try { localStorage.removeItem(pinStorageKey(day, matchNum)); } catch (e) {}
  renderScoringUI(day, matchNum);
}

// Shown instead of the scoring UI when this match has a PIN set and this
// device hasn't unlocked it yet.
function renderPinLock(day, matchNum, pairingRow) {
  document.getElementById('scStatusLines').innerHTML = '';
  const wrap = document.getElementById('scGridWrap');
  wrap.innerHTML = `
    <div class="card" style="margin:0; background:#fbf3e4; border-color:var(--gold);">
      <p class="hint" style="margin-top:0;">This match is protected — enter the PIN given to this foursome to enter scores. (The Scoreboard tab is still open to everyone.)</p>
      <div class="row">
        <input type="text" inputmode="numeric" id="matchPinInput" placeholder="PIN" maxlength="8" style="font-size:1.1rem; padding:10px 12px; width:120px;">
        <button type="button" class="primary" onclick="tryUnlockMatch('${day}', '${matchNum}')">Unlock</button>
      </div>
      <div id="pinError" class="hint" style="color:var(--error);"></div>
    </div>
  `;
  const input = document.getElementById('matchPinInput');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlockMatch(day, matchNum); });
  input.focus();
}
function tryUnlockMatch(day, matchNum) {
  const entered = document.getElementById('matchPinInput').value.trim();
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  const requiredPin = String((pairingRow && pairingRow.PIN) || '').trim();
  if (entered && entered === requiredPin) {
    storePin(day, matchNum, entered);
    renderScoringUI(day, matchNum);
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN — check with your foursome or the admin.';
  }
}
function setScView(mode) {
  scViewMode = mode;
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  renderScoringUI(day, matchNum);
}

// ---- direct hole-winner tap UI (replaces gross-score entry) ----
// The scorekeeper works out who actually won the hole (using the stroke
// hints below each side's name to judge net results fairly) and taps that
// side, or Tie — no gross strokes are typed in anywhere.
function lastNameOrUnassigned(name) { return name ? lastName(name) : '(unassigned)'; }
function playerStrokeNoteHtml(name, hole) {
  const p = rosterByName[name];
  if (!p) return '';
  const si = strokeIndexForTee(p.Tee, hole);
  const strokes = strokesOnHole(courseHandicap(p.HandicapIndex, p.Tee), si);
  if (strokes <= 0) return '';
  return `<div class="hbh-stroke-note">${escapeHtml(lastName(name))}: gets ${strokes} stroke${strokes > 1 ? 's' : ''}<span class="hbh-dot"></span></div>`;
}
function winnerButtonsHtml(field, val, aLabel, bLabel) {
  const btn = (v, label, cls) => `<button type="button" class="wpick-btn ${val === v ? 'active ' + cls : ''}" data-wfield="${field}" data-wval="${v}">${escapeHtml(label)}</button>`;
  return `<div class="wpick-row">${btn('A', aLabel, 'wpick-a')}${btn('Half', 'Tie', 'wpick-half')}${btn('B', bLabel, 'wpick-b')}</div>`;
}
// Team-vs-team pick (Day 1 both segments, Day 2 Best Ball) — shows every
// player on each side so their stroke hints are visible together.
function teamWinnerBlockHtml(field, holeRow, hole, aLabel, bLabel, aPlayers, bPlayers) {
  const val = holeRow[field] || '';
  const sideNote = (players) => (players || []).filter(Boolean).map((name) => playerStrokeNoteHtml(name, hole)).join('');
  return `<div class="wpick-block"><div class="wpick-sides"><div class="wpick-side">${escapeHtml(aLabel)}${sideNote(aPlayers)}</div><div class="wpick-side">${escapeHtml(bLabel)}${sideNote(bPlayers)}</div></div>${winnerButtonsHtml(field, val, aLabel, bLabel)}</div>`;
}
// Player-vs-player pick (Day 2 Individual Match Play, one block per MP slot).
function matchupWinnerBlockHtml(field, holeRow, hole, aName, bName) {
  const val = holeRow[field] || '';
  const aLabel = lastNameOrUnassigned(aName), bLabel = lastNameOrUnassigned(bName);
  return `<div class="wpick-block"><div class="wpick-sides"><div class="wpick-side">${escapeHtml(aLabel)}${playerStrokeNoteHtml(aName, hole)}</div><div class="wpick-side">${escapeHtml(bLabel)}${playerStrokeNoteHtml(bName, hole)}</div></div>${winnerButtonsHtml(field, val, aLabel, bLabel)}</div>`;
}

// One hole at a time — just this match's players/teams, big touch-friendly
// tap targets, no horizontal scrolling. Prev/Next (or the dropdown) move
// between holes; the status lines above update live the same as the full grid.
function renderHoleByHole(day, matchNum) {
  const wrap = document.getElementById('scGridWrap');
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  const names = teamNames();
  const h = scHoleIndex + 1; // 1-based hole number
  const holeRow = currentHoles[scHoleIndex];
  const segLabel = h <= 9
    ? (day === '2' ? 'Best Ball (front 9)' : "Captain's Choice (front 9)")
    : (day === '2' ? 'Individual Match Play (back 9)' : 'Modified Alternate Shot (back 9)');

  let blocksHtml;
  if (day === '2') {
    if (h <= 9) {
      blocksHtml = teamWinnerBlockHtml('BestBallWinner', holeRow, h, names.A, names.B, [pairingRow.TeamA_P1, pairingRow.TeamA_P2], [pairingRow.TeamB_P1, pairingRow.TeamB_P2]);
    } else {
      blocksHtml = matchupWinnerBlockHtml('MP1Winner', holeRow, h, pairingRow.MP1_TeamA, pairingRow.MP1_TeamB)
        + matchupWinnerBlockHtml('MP2Winner', holeRow, h, pairingRow.MP2_TeamA, pairingRow.MP2_TeamB);
    }
  } else {
    blocksHtml = teamWinnerBlockHtml('Winner', holeRow, h, names.A, names.B, [pairingRow.TeamA_P1, pairingRow.TeamA_P2], [pairingRow.TeamB_P1, pairingRow.TeamB_P2]);
  }

  const par = parForHole(h);
  wrap.innerHTML = `
    <div class="hbh-nav">
      <button type="button" onclick="stepHole(-1)">‹</button>
      <select id="hbhHoleSelect" onchange="jumpToHole(this.value)">
        ${Array.from({ length: 18 }, (_, i) => `<option value="${i}" ${i === scHoleIndex ? 'selected' : ''}>Hole ${i + 1}</option>`).join('')}
      </select>
      <button type="button" onclick="stepHole(1)">›</button>
    </div>
    <div class="hbh-heading">Hole ${h}${par ? ` <span style="font-weight:400;">(Par ${escapeHtml(String(par))})</span>` : ''}<span class="seg">${escapeHtml(segLabel)}</span></div>
    <div>${blocksHtml}</div>
    <p class="hint" style="margin-top:10px;">On a shotgun start, holes don't need to be entered in order — jump straight to whichever hole your group just finished. Prev/Next wraps from 18 back to 1 (and 1 back to 18) — watch the heading above, since the format changes at the turn.</p>
  `;

  wrap.querySelectorAll('.wpick-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const field = btn.dataset.wfield;
      const val = btn.dataset.wval;
      const current = currentHoles[scHoleIndex][field];
      // Tapping the already-selected choice clears it back to "not entered".
      currentHoles[scHoleIndex][field] = current === val ? '' : val;
      renderHoleByHole(day, matchNum);
      renderStatusLines(day, matchNum, pairingRow);
      scheduleAutosave(day, matchNum);
    });
  });

  renderStatusLines(day, matchNum, pairingRow);
}

// Wraps 18 -> 1 and 1 -> 18 rather than stopping at the ends — a shotgun
// group finishing on hole 18 naturally continues into hole 1 next, and the
// format flips there (front 9 <-> back 9), which the heading above already
// makes clear.
function stepHole(dir) {
  scHoleIndex = (scHoleIndex + dir + 18) % 18;
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  renderHoleByHole(day, matchNum);
}
function jumpToHole(idx) {
  scHoleIndex = parseInt(idx, 10) || 0;
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  renderHoleByHole(day, matchNum);
}

// The original full 18-hole-wide scorecard grid — kept as an alternate view
// (handy on a tablet, or to eyeball the whole round at once). Each side gets
// its own row (rather than one combined "A vs B" row) showing a
// self-explanatory Win/Tie/Loss word per hole instead of an A/B/T letter —
// tapping a cell cycles blank → this side's Win → Tie → Loss → blank, and
// since both rows are just two mirrored views of the same single stored
// result, marking one side's cell Win instantly shows Loss on the other
// side's row for that hole (and vice versa) — nothing extra to keep in sync.
function renderFullGrid(day, matchNum) {
  const wrap = document.getElementById('scGridWrap');
  if (!matchNum) { wrap.innerHTML = '<p class="hint">Set up this match\'s pairing first (Admin → Pairings) before entering scores.</p>'; document.getElementById('scStatusLines').innerHTML = ''; return; }
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  const names = teamNames();

  let headerCells = '<th class="rowlabel"></th>';
  for (let h = 1; h <= 18; h++) headerCells += `<th class="${h === 10 ? 'segdivider' : ''}">${h}</th>`;

  const fgResultClass = (word) => word === 'Win' ? 'fg-win' : word === 'Loss' ? 'fg-loss' : word === 'Tie' ? 'fg-tie' : '';
  const cycleCellHtml = (field, perspective, h, na) => {
    const segClass = h === 10 ? 'segdivider' : '';
    if (na) return `<td class="${segClass} fg-na"></td>`;
    const val = currentHoles[h - 1][field] || '';
    const word = resultWordFor(val, perspective) || '–';
    return `<td class="${segClass}"><button type="button" class="fg-cycle-btn ${fgResultClass(word)}" data-hole="${h}" data-field="${field}" data-perspective="${perspective}">${word}</button></td>`;
  };
  const rowHtml = (field, perspective, label, isNa) => {
    let cells = `<td class="rowlabel">${escapeHtml(label)}</td>`;
    for (let h = 1; h <= 18; h++) cells += cycleCellHtml(field, perspective, h, isNa ? isNa(h) : false);
    return `<tr>${cells}</tr>`;
  };

  let bodyRows = '';
  if (day === '2') {
    bodyRows = [
      rowHtml('BestBallWinner', 'A', names.A, (h) => h > 9),
      rowHtml('BestBallWinner', 'B', names.B, (h) => h > 9),
      rowHtml('MP1Winner', 'A', lastNameOrUnassigned(pairingRow.MP1_TeamA), (h) => h < 10),
      rowHtml('MP1Winner', 'B', lastNameOrUnassigned(pairingRow.MP1_TeamB), (h) => h < 10),
      rowHtml('MP2Winner', 'A', lastNameOrUnassigned(pairingRow.MP2_TeamA), (h) => h < 10),
      rowHtml('MP2Winner', 'B', lastNameOrUnassigned(pairingRow.MP2_TeamB), (h) => h < 10),
    ].join('');
  } else {
    bodyRows = rowHtml('Winner', 'A', names.A) + rowHtml('Winner', 'B', names.B);
  }

  wrap.innerHTML = `<div style="overflow-x:auto;"><table class="grid"><thead><tr>${headerCells}</tr></thead><tbody>${bodyRows}</tbody></table></div>
    <p class="hint" style="margin-top:8px;">Tap a cell to cycle: blank → Win → Tie → Loss → blank. Marking one side Win automatically marks the other side Loss for that hole, since it's the same result either way. Holes 1–9: ${day === '2' ? 'Best Ball' : "Captain's Choice"}. Holes 10–18: ${day === '2' ? 'Individual Match Play' : 'Modified Alternate Shot'}. Enter whichever holes your group has finished — order doesn't matter for a shotgun start.</p>`;

  wrap.querySelectorAll('.fg-cycle-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const h = parseInt(btn.dataset.hole, 10);
      const field = btn.dataset.field;
      const perspective = btn.dataset.perspective;
      currentHoles[h - 1][field] = nextResultValue(currentHoles[h - 1][field], perspective);
      renderFullGrid(day, matchNum);
      renderStatusLines(day, matchNum, pairingRow);
      scheduleAutosave(day, matchNum);
    });
  });

  renderStatusLines(day, matchNum, pairingRow);
}

function scheduleAutosave(day, matchNum) {
  setSaveIndicator('saving', 'Saving…');
  const key = day + '_' + matchNum;
  clearTimeout(saveTimers[key]);
  // Capture the array reference now, not just the day/matchNum. Further edits
  // to this same match before the timer fires keep mutating this same array
  // (so the save 1.5s from now still includes them) — but if you switch to a
  // different match, `currentHoles` gets reassigned to a new array for that
  // match, and this timer's captured reference is unaffected by that, so it
  // still saves this match's own data, not whatever's now on screen.
  const holesSnapshot = currentHoles;
  saveTimers[key] = setTimeout(() => {
    delete saveTimers[key];
    saveCurrentMatch(day, matchNum, holesSnapshot);
  }, 1500);
}
function setSaveIndicator(cls, text) {
  const el = document.getElementById('saveIndicator');
  el.className = 'save-indicator ' + cls;
  el.textContent = text;
}
// Called two ways: with no arguments, by the "Save Now" button — always means
// "save whatever match is on screen right now, using what's on screen right
// now". With explicit args, by a debounced autosave (see scheduleAutosave) —
// always saves the specific match/data it was scheduled for, regardless of
// what's currently selected, and only touches the visible Saving/Saved
// indicator if that same match still happens to be the one on screen.
async function saveCurrentMatch(day, matchNum, holes) {
  if (day === undefined) day = document.getElementById('scDay').value;
  if (matchNum === undefined) matchNum = document.getElementById('scMatch').value;
  if (holes === undefined) holes = currentHoles;
  if (!matchNum) return;
  const key = day + '_' + matchNum;
  clearTimeout(saveTimers[key]);
  delete saveTimers[key];
  const isCurrentlyViewed = () => String(document.getElementById('scDay').value) === String(day) && String(document.getElementById('scMatch').value) === String(matchNum);
  if (isCurrentlyViewed()) setSaveIndicator('saving', 'Saving…');
  try {
    const res = await apiPost('saveMatchScores', { day, matchNum, holes: JSON.stringify(holes) });
    if (isCurrentlyViewed()) setSaveIndicator(res.success ? 'saved' : 'error', res.success ? 'Saved ✓' : res.error);
  } catch (err) {
    if (isCurrentlyViewed()) setSaveIndicator('error', 'Network error');
  }
}

// live status line(s) shown above the grid as you type, computed entirely client-side
function renderStatusLines(day, matchNum, pairingRow) {
  const names = teamNames();
  const el = document.getElementById('scStatusLines');
  if (day === '2') {
    const bb = computeDay2BestBall(pairingRow, currentHoles);
    const mp1 = computeDay2MatchPlay(pairingRow, currentHoles, 1);
    const mp2 = computeDay2MatchPlay(pairingRow, currentHoles, 2);
    el.innerHTML = [
      statusLineHtml('Best Ball (front 9)', bb, names.A, names.B),
      statusLineHtml(`Match Play: ${pairingRow.MP1_TeamA || '?'} vs ${pairingRow.MP1_TeamB || '?'}`, mp1, pairingRow.MP1_TeamA, pairingRow.MP1_TeamB),
      statusLineHtml(`Match Play: ${pairingRow.MP2_TeamA || '?'} vs ${pairingRow.MP2_TeamB || '?'}`, mp2, pairingRow.MP2_TeamA, pairingRow.MP2_TeamB),
    ].join('');
  } else {
    const cc = computeDay1Segment(currentHoles, 1, 9);
    const asg = computeDay1Segment(currentHoles, 10, 18);
    el.innerHTML = [
      statusLineHtml("Captain's Choice (front 9)", cc, names.A, names.B),
      statusLineHtml('Modified Alternate Shot (back 9)', asg, names.A, names.B),
    ].join('');
  }
  renderLiveScorecard(day, matchNum);
}

function statusLineHtml(label, seg, aName, bName) {
  const cls = seg.leader === 'A' ? 'a' : seg.leader === 'B' ? 'b' : seg.leader === 'Half' ? 'half' : 'pending';
  return `<div class="status-line"><strong>${escapeHtml(label)}:</strong> <span class="status-badge ${cls}">${escapeHtml(seg.text)}</span></div>`;
}

// ---- segment computation (shared by scoring page + scoreboard) ----

// Day 1: the scorekeeper records who won each hole directly (row.Winner),
// one combined field applying across all 18 holes — which segment a hole
// belongs to (Captain's Choice front 9 vs Modified Alternate Shot back 9)
// is purely which 9-hole range is being tallied here.
function computeDay1Segment(holeRows, startHole, endHole) {
  let aWins = 0, bWins = 0, decided = 0;
  for (let h = startHole; h <= endHole; h++) {
    const w = (holeRows[h - 1] || {}).Winner;
    if (!w) continue;
    decided++;
    if (w === 'A') aWins++; else if (w === 'B') bWins++;
  }
  const total = endHole - startHole + 1;
  return buildSegmentResult(aWins - bWins, decided, total - decided, total);
}

function buildSegmentResult(up, decided, remaining, total) {
  if (remaining === 0) {
    if (up > 0) return { leader: 'A', final: true, points: { A: 1, B: 0 }, text: `Final — ${up} up` };
    if (up < 0) return { leader: 'B', final: true, points: { A: 0, B: 1 }, text: `Final — ${Math.abs(up)} up` };
    return { leader: 'Half', final: true, points: { A: 0.5, B: 0.5 }, text: 'Final — Halved' };
  }
  if (decided === 0) return { leader: 'pending', final: false, points: null, text: 'Not started' };
  if (up === 0) return { leader: 'pending', final: false, points: null, text: `All Square thru ${decided}` };
  const leader = up > 0 ? 'A' : 'B';
  const clinched = Math.abs(up) > remaining;
  return { leader, final: false, points: null, text: `${Math.abs(up)} up thru ${decided}${clinched ? ' (decided, holes still to enter)' : ''}` };
}

// Day 2 Best Ball: team-level result per hole, stored directly (row.BestBallWinner).
function computeDay2BestBall(pairingRow, holeRows) {
  let aWins = 0, bWins = 0, decided = 0;
  for (let h = 1; h <= 9; h++) {
    const w = (holeRows[h - 1] || {}).BestBallWinner;
    if (!w) continue;
    decided++;
    if (w === 'A') aWins++; else if (w === 'B') bWins++;
  }
  return buildSegmentResult(aWins - bWins, decided, 9 - decided, 9);
}

// Day 2 Individual Match Play: mpNum is 1 or 2 (row.MP1Winner / row.MP2Winner).
function computeDay2MatchPlay(pairingRow, holeRows, mpNum) {
  const field = 'MP' + mpNum + 'Winner';
  let aWins = 0, bWins = 0, decided = 0;
  for (let h = 10; h <= 18; h++) {
    const w = (holeRows[h - 1] || {})[field];
    if (!w) continue;
    decided++;
    if (w === 'A') aWins++; else if (w === 'B') bWins++;
  }
  return buildSegmentResult(aWins - bWins, decided, 9 - decided, 9);
}

function playerHandicap(name) {
  const p = rosterByName[name];
  return p ? courseHandicap(p.HandicapIndex, p.Tee) : '';
}
// Which individual Match Play slot (1 or 2) a player is in — Team A's is
// always fixed (P1→MP1, P2→MP2), but "swap opponents" in admin can move
// either Team B player into either slot, so look it up from the actual
// MP fields rather than assuming.
function mpNumForPlayer(pairingRow, name) {
  if (!name) return null;
  if (name === pairingRow.MP1_TeamA || name === pairingRow.MP1_TeamB) return 1;
  if (name === pairingRow.MP2_TeamA || name === pairingRow.MP2_TeamB) return 2;
  return null;
}

// ====================== LIVE SCORECARD REPLICA ======================
// A read-only, on-screen version of the printed scorecard (see index.html's
// scorecardCardHtml/scorecardCardHtmlDay1) for whichever match is currently
// selected in "Enter Scores" — but filled in with the actual scores on the
// grid instead of blank boxes, and with the W/L/T rows computed live from
// those scores instead of left blank for hand-writing. Shown below the entry
// UI regardless of PIN-lock state, same as the Scoreboard tab.

// Pulls the leading hole number out of a Start Hole value like "18a" or
// "18b" (or a plain "5") so that hole's column can be highlighted.
function startHoleNumberOf(startHole) {
  const m = String(startHole || '').match(/^\s*(\d{1,2})/);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return (n >= 1 && n <= 18) ? n : null;
}
function segmentHeaderRowHtml(frontLabel, backLabel) {
  return `<tr class="sc-segrow"><th class="sc-name"></th><th colspan="9">${escapeHtml(frontLabel)}</th><th colspan="9">${escapeHtml(backLabel)}</th></tr>`;
}
// Turns a normalized winner ('A' | 'B' | 'Half' | 'pending') into the
// W/L/T letter from one particular side's point of view.
function resultLetterFor(result, perspective) {
  if (result === 'pending' || !result) return '';
  if (result === 'Half') return 'T';
  return result === perspective ? 'W' : 'L';
}
// results: array of per-hole outcomes ('A'|'B'|'Half'|'pending') covering
// [activeStart, activeEnd] only (index 0 = activeStart). Holes outside that
// range are shaded, same convention as the printed scorecard's blank W/T
// boxes not applying to that row (e.g. a Match Play row on the front 9).
function wltResultCellsHtml(results, activeStart, activeEnd, startHoleNum, perspective) {
  let cells = '';
  for (let h = 1; h <= 18; h++) {
    const segClass = h === 10 ? 'seg' : '';
    const isActive = h >= activeStart && h <= activeEnd;
    const startClass = (isActive && h === startHoleNum) ? ' sc-start-hole' : '';
    const letter = isActive ? resultLetterFor(results[h - activeStart], perspective) : '';
    cells += `<td class="${segClass}${startClass}${isActive ? '' : ' sc-na'}">${letter}</td>`;
  }
  return cells;
}

// ---- per-hole result arrays, shared by the live scorecard, the Scoreboard's
// expanded scorecards, and its collapsed progression strips. pairingRow is
// kept in each signature for call-site compatibility even though the
// direct-entry model no longer needs it to compute a result. ----
function day1PerHoleResults(holeRows, startHole, endHole) {
  const results = [];
  for (let h = startHole; h <= endHole; h++) {
    results.push(normalizeWinner((holeRows[h - 1] || {}).Winner));
  }
  return results;
}
function day2BestBallPerHoleResults(pairingRow, holeRows) {
  const results = [];
  for (let h = 1; h <= 9; h++) {
    results.push(normalizeWinner((holeRows[h - 1] || {}).BestBallWinner));
  }
  return results;
}
function day2MatchPlayPerHoleResults(pairingRow, holeRows, mpNum) {
  const field = 'MP' + mpNum + 'Winner';
  const results = [];
  for (let h = 10; h <= 18; h++) {
    results.push(normalizeWinner((holeRows[h - 1] || {})[field]));
  }
  return results;
}

// Builds one scorecard's <table> + note — just the innards, no heading — so
// it can be reused both for the Live Scoring tab's single live scorecard and
// for the Scoreboard tab's "Full Scorecards" view (every match at once).
// Mirrors the printed card's layout (PAR / Gold Handicap / Red Handicap rows
// always shown, same as the sample) but filled in with the actual entered
// W/T results instead of left blank for hand-writing — no gross scores
// anywhere, since the app only ever records who won each hole.
function scorecardHtmlForMatch(day, pairingRow, holeRows) {
  const names = teamNames();
  const hasPar = Object.keys(holeHC.default || {}).some((h) => holeHC.default[h] && holeHC.default[h].Par !== '' && holeHC.default[h].Par != null);
  const startHoleNum = startHoleNumberOf(pairingRow.StartHole);
  const segAndStart = (h) => `${h === 10 ? 'seg ' : ''}${h === startHoleNum ? 'sc-start-hole' : ''}`.trim();
  const cellsFor = (fn) => { let s = ''; for (let h = 1; h <= 18; h++) s += fn(h); return s; };

  const holeHeaderCells = cellsFor((h) => `<th class="${segAndStart(h)}">${h}</th>`);
  const parCells = cellsFor((h) => `<td class="${segAndStart(h)}">${parForHole(h) || ''}</td>`);
  const hcpCells = cellsFor((h) => `<td class="${segAndStart(h)}">${holeHC.default[h] ? (holeHC.default[h].StrokeIndex || '') : ''}</td>`);
  const hcpRedCells = cellsFor((h) => `<td class="${segAndStart(h)}">${holeHC.red[h] ? (holeHC.red[h].StrokeIndex || '') : ''}</td>`);
  const hcpRowsHtml = `<tr class="sc-meta"><td class="sc-name">Gold Handicap</td>${hcpCells}</tr><tr class="sc-meta"><td class="sc-name">Red Handicap</td>${hcpRedCells}</tr>`;

  let headLabel, bodyHtml, noteHtml, rowHeadLabel;
  if (day === '2') {
    rowHeadLabel = 'Player / Team';
    const bbResults = day2BestBallPerHoleResults(pairingRow, holeRows);
    const resultsByMp = { 1: day2MatchPlayPerHoleResults(pairingRow, holeRows, 1), 2: day2MatchPlayPerHoleResults(pairingRow, holeRows, 2) };

    // A dot per hole where that player gets a handicap stroke (•• = two) —
    // same convention as the printed card's note — no gross value shown.
    const playerDotsRowHtml = (name) => {
      if (!name) return '';
      const tee = playerTee(name);
      const hc = playerHandicap(name);
      let strokesTotal = 0;
      const cells = cellsFor((h) => {
        const strokes = strokesOnHole(hc, strokeIndexForTee(tee, h));
        strokesTotal += strokes;
        const dots = strokes > 0 ? `<span class="sc-dots">${'&bull;'.repeat(strokes)}</span>` : '';
        return `<td class="${segAndStart(h)}">${dots}</td>`;
      });
      const strokesLabel = strokesTotal > 0 ? `${strokesTotal} stroke${strokesTotal === 1 ? '' : 's'}` : '';
      const parenBits = [tee, strokesLabel].filter(Boolean).join(', ');
      const teeHtml = parenBits ? ` <span class="sc-tee">(${escapeHtml(parenBits)})</span>` : '';
      return `<tr><td class="sc-name">${escapeHtml(name)}${teeHtml}</td>${cells}</tr>`;
    };

    // Each team's block: a team-name header, its two players' stroke-dot
    // rows, then its own three W/T rows (Best Ball, then one Match Play row
    // per player) — a team's Match Play row uses whichever MP number that
    // specific player is actually in, since "swap opponents" in admin can
    // put either player in MP1 or MP2.
    const teamBlockHtml = (teamName, p1, p2, perspective) => {
      const mp1 = mpNumForPlayer(pairingRow, p1) || 1;
      const mp2 = mpNumForPlayer(pairingRow, p2) || 2;
      const wltRows = [
        ['Best Ball', wltResultCellsHtml(bbResults, 1, 9, startHoleNum, perspective)],
        [`Match Play &mdash; ${escapeHtml(lastName(p1))}`, wltResultCellsHtml(resultsByMp[mp1], 10, 18, startHoleNum, perspective)],
        [`Match Play &mdash; ${escapeHtml(lastName(p2))}`, wltResultCellsHtml(resultsByMp[mp2], 10, 18, startHoleNum, perspective)],
      ].map(([label, cells]) => `<tr class="sc-wlt"><td class="sc-name">W/T &mdash; ${label}</td>${cells}</tr>`).join('');
      return `<tr class="sc-team-head"><td class="sc-name" colspan="19">${escapeHtml(teamName)}</td></tr>${playerDotsRowHtml(p1)}${playerDotsRowHtml(p2)}${wltRows}`;
    };
    const spacerRow = '<tr class="sc-spacer"><td colspan="19" style="border:none; padding:6px 0;"></td></tr>';
    bodyHtml = teamBlockHtml(names.A, pairingRow.TeamA_P1, pairingRow.TeamA_P2, 'A')
      + spacerRow
      + teamBlockHtml(names.B, pairingRow.TeamB_P1, pairingRow.TeamB_P2, 'B');

    headLabel = segmentHeaderRowHtml("Front 9: Best Ball", "Back 9: Individual Match Play");
    noteHtml = '&bull; marks a hole where that player gets a handicap stroke (&bull;&bull; = two strokes). Best Ball covers the front 9 only; each Match Play row covers the back 9 only (shaded cells don\'t apply to that row). W/T rows update live as results come in.';
  } else {
    rowHeadLabel = 'Team';
    const results = day1PerHoleResults(holeRows, 1, 18);
    const teams = [
      [names.A, pairingRow.TeamA_P1, pairingRow.TeamA_P2, 'A'],
      [names.B, pairingRow.TeamB_P1, pairingRow.TeamB_P2, 'B'],
    ];
    bodyHtml = teams.map(([teamName, p1, p2, perspective]) => {
      const playersHtml = (p1 || p2) ? ` <span class="sc-tee">(${escapeHtml([p1, p2].filter(Boolean).join(' / '))})</span>` : '';
      const wltCells = wltResultCellsHtml(results, 1, 18, startHoleNum, perspective);
      return `<tr class="sc-wlt"><td class="sc-name">${escapeHtml(teamName)}${playersHtml}</td>${wltCells}</tr>`;
    }).join('');
    headLabel = segmentHeaderRowHtml("Front 9: Captain's Choice", "Back 9: Modified Alternate Shot");
    noteHtml = 'One combined result per team per hole &mdash; no handicap strokes apply on Day 1. W/T updates live as results come in.';
  }

  return `
    <div style="overflow-x:auto;">
      <table class="sc-table-live">
        <thead>
          ${headLabel}
          <tr><th class="sc-name">${rowHeadLabel}</th>${holeHeaderCells}</tr>
        </thead>
        <tbody>
          ${hasPar ? `<tr class="sc-meta"><td class="sc-name">Par</td>${parCells}</tr>` : ''}
          ${hcpRowsHtml}
          ${bodyHtml}
        </tbody>
      </table>
    </div>
    <p class="hint" style="margin-top:8px;">${noteHtml}</p>
  `;
}

function renderLiveScorecard(day, matchNum) {
  const wrap = document.getElementById('scLiveCardWrap');
  if (!matchNum) { wrap.innerHTML = ''; return; }
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  if (!pairingRow || !(pairingRow.TeamA_P1 || pairingRow.TeamA_P2 || pairingRow.TeamB_P1 || pairingRow.TeamB_P2)) { wrap.innerHTML = ''; return; }
  const names = teamNames();
  wrap.innerHTML = `
    <h2 style="margin-top:0;">Match Scorecard</h2>
    <div class="sc-teams-live">${escapeHtml(names.A)} vs ${escapeHtml(names.B)} &middot; Start Hole: ${escapeHtml(pairingRow.StartHole || 'TBD')}</div>
    ${scorecardHtmlForMatch(day, pairingRow, currentHoles)}
  `;
}

// ====================== SCOREBOARD ======================
// Two top-level views ("Leaderboard" and "Match Scorecards"), each reading
// the same sbDay selector — but the day selector's own options differ
// (Leaderboard adds a "Tournament Total" choice that doesn't make sense for
// an 18-hole scorecard), so switching views also rebuilds that dropdown.
let sbView = 'leaderboard';
let sbScMode = 'collapsed';

document.getElementById('sbDay').addEventListener('change', loadScoreboard);

function setSbView(view) {
  sbView = view;
  document.querySelectorAll('#sbViewToggle .view-toggle-btn').forEach((b) => b.classList.toggle('active', b.dataset.sbview === view));
  document.getElementById('sbLeaderboard').hidden = view !== 'leaderboard';
  document.getElementById('sbScorecards').hidden = view !== 'scorecards';
  updateSbDayOptions();
  loadScoreboard();
}
function setSbScMode(mode) {
  sbScMode = mode;
  document.querySelectorAll('#sbScModeToggle .view-toggle-btn').forEach((b) => b.classList.toggle('active', b.dataset.scmode === mode));
  loadScoreboard();
}
function updateSbDayOptions() {
  const sel = document.getElementById('sbDay');
  const current = sel.value;
  const opts = sbView === 'leaderboard'
    ? [['1', 'Day 1'], ['2', 'Day 2'], ['total', 'Tournament Total']]
    : [['1', 'Day 1'], ['2', 'Day 2']];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  sel.value = opts.some(([v]) => v === current) ? current : '1';
}
updateSbDayOptions(); // populate the day dropdown up front, before any data loads

function loadScoreboard() {
  const day = document.getElementById('sbDay').value;
  if (sbView === 'scorecards') return loadScorecardsView(day);
  if (day === 'total') return loadTournamentTotal();
  return loadLeaderboardView(day);
}

// Last names of a two-player pairing, joined like the pairing columns
// elsewhere on the leaderboard (e.g. "Stewart + Davis").
function pairName(p1, p2) {
  return `${lastName(p1)} + ${lastName(p2)}`;
}
// Splices the leading side's name into a segment's status text, right before
// the margin — "Final — 2 up" becomes "Final — Stewart + Davis 2 up", "2 up
// thru 5" becomes "Rich 2 up thru 5". Halved/all-square/not-started have no
// one to name, so those pass through unchanged.
function segStatusTextWithName(seg, aName, bName) {
  if (seg.leader !== 'A' && seg.leader !== 'B') return seg.text;
  const leadName = seg.leader === 'A' ? aName : bName;
  return seg.text.replace(/(\d+ up)/, `${leadName} $1`);
}
// One compact badge per segment (e.g. "Captain's Choice: Final — Stewart +
// Davis 2 up"), reusing the same colored status-badge look as the Live
// Scoring status lines — stacked in the leaderboard row's middle "Match"
// column.
function lbxSegBadgeHtml(label, seg, aName, bName) {
  const cls = seg.leader === 'A' ? 'a' : seg.leader === 'B' ? 'b' : seg.leader === 'Half' ? 'half' : 'pending';
  const text = segStatusTextWithName(seg, aName, bName);
  return `<div class="lbx-seg"><span class="lbx-seg-label">${escapeHtml(label)}:</span> <span class="status-badge ${cls}">${escapeHtml(text)}</span></div>`;
}
// Per-match segment breakdown, shared by the per-day leaderboard and the
// Tournament Total's day-by-day totals — returns each segment's result plus
// that match's points, without touching the DOM. segNames pairs with segs/
// segLabels — the [A-side name, B-side name] to use when naming who's up.
function matchSegmentInfo(day, row, scoresByMatch) {
  const holeRows = buildHoleGrid(day, row.MatchNum, scoresByMatch[row.MatchNum] || []);
  let segs, segLabels, segNames;
  if (day === '2') {
    segs = [computeDay2BestBall(row, holeRows), computeDay2MatchPlay(row, holeRows, 1), computeDay2MatchPlay(row, holeRows, 2)];
    segLabels = ['Best Ball', `${lastName(row.MP1_TeamA)} vs ${lastName(row.MP1_TeamB)}`, `${lastName(row.MP2_TeamA)} vs ${lastName(row.MP2_TeamB)}`];
    segNames = [
      [pairName(row.TeamA_P1, row.TeamA_P2), pairName(row.TeamB_P1, row.TeamB_P2)],
      [lastName(row.MP1_TeamA), lastName(row.MP1_TeamB)],
      [lastName(row.MP2_TeamA), lastName(row.MP2_TeamB)],
    ];
  } else {
    segs = [computeDay1Segment(holeRows, 1, 9), computeDay1Segment(holeRows, 10, 18)];
    segLabels = ["Captain's Choice", 'Modified Alternate Shot'];
    const pairA = pairName(row.TeamA_P1, row.TeamA_P2), pairB = pairName(row.TeamB_P1, row.TeamB_P2);
    segNames = [[pairA, pairB], [pairA, pairB]];
  }
  let ptsA = 0, ptsB = 0;
  segs.forEach((s) => { if (s.final) { ptsA += s.points.A; ptsB += s.points.B; } });
  return { holeRows, segs, segLabels, segNames, ptsA, ptsB };
}

async function loadLeaderboardView(day) {
  const res = await apiGet('getScores', { day });
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });

  const names = teamNames();
  let totalA = 0, totalB = 0;
  const rowsHtml = (pairings[day] || []).map((row) => {
    if (!hasPlayersLb(row)) {
      return `<tr><td colspan="5" class="lbx-unset">Match ${escapeHtml(row.MatchNum)} — not set up yet</td></tr>`;
    }
    const { segs, segLabels, segNames, ptsA, ptsB } = matchSegmentInfo(day, row, scoresByMatch);
    totalA += ptsA; totalB += ptsB;
    // Solid highlight once every segment in the match is final (mirrors the
    // reference leaderboard's red "won" styling); a lighter tint just shows
    // who's currently ahead while the match is still in progress.
    const allFinal = segs.every((s) => s.final);
    const aAhead = ptsA > ptsB, bAhead = ptsB > ptsA;
    const leadClassA = aAhead ? (allFinal ? 'lbx-final-lead' : 'lbx-lead') : '';
    const leadClassB = bAhead ? (allFinal ? 'lbx-final-lead' : 'lbx-lead') : '';
    const tiedClass = (!aAhead && !bAhead && allFinal) ? 'lbx-tied' : '';
    const pairA = `${lastName(row.TeamA_P1)} + ${lastName(row.TeamA_P2)}`;
    const pairB = `${lastName(row.TeamB_P1)} + ${lastName(row.TeamB_P2)}`;
    const segBadges = segs.map((s, i) => lbxSegBadgeHtml(segLabels[i], s, segNames[i][0], segNames[i][1])).join('');
    return `<tr>
      <td class="lbx-pts ${leadClassA} ${tiedClass}">${formatPts(ptsA)}</td>
      <td class="lbx-pair ${leadClassA} ${tiedClass}"><div class="lbx-names">${escapeHtml(pairA)}</div><div class="lbx-matchnum">Match ${escapeHtml(row.MatchNum)}</div></td>
      <td class="lbx-match">${segBadges}</td>
      <td class="lbx-pair ${leadClassB} ${tiedClass}"><div class="lbx-names">${escapeHtml(pairB)}</div><div class="lbx-matchnum">Match ${escapeHtml(row.MatchNum)}</div></td>
      <td class="lbx-pts ${leadClassB} ${tiedClass}">${formatPts(ptsB)}</td>
    </tr>`;
  }).join('');

  document.getElementById('sbLeaderboard').innerHTML = `
    <div class="lbx-wrap">
      <table class="lbx-table">
        <thead>
          <tr class="lbx-head"><th>Points</th><th class="lbx-pair-h">${escapeHtml(names.A)}</th><th>Match</th><th class="lbx-pair-h">${escapeHtml(names.B)}</th><th>Points</th></tr>
        </thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="hint">No matches set up yet.</td></tr>`}</tbody>
        ${rowsHtml ? `<tfoot><tr class="lbx-total"><td>${formatPts(totalA)}</td><td class="lbx-pair-h">${escapeHtml(names.A)}</td><td>TOTAL</td><td class="lbx-pair-h">${escapeHtml(names.B)}</td><td>${formatPts(totalB)}</td></tr></tfoot>` : ''}
      </table>
    </div>
  `;
}

// Team totals only — Day 1 and Day 2 pairings are entered independently
// (Match 3 on Day 1 isn't guaranteed to be the same foursome as Match 3 on
// Day 2), so a combined per-match row isn't meaningful; this just adds up
// each team's points across both days.
function dayTotals(day, res) {
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });
  let totalA = 0, totalB = 0;
  (pairings[day] || []).filter(hasPlayersLb).forEach((row) => {
    const { ptsA, ptsB } = matchSegmentInfo(day, row, scoresByMatch);
    totalA += ptsA; totalB += ptsB;
  });
  return { A: totalA, B: totalB };
}

async function loadTournamentTotal() {
  const [res1, res2] = await Promise.all([apiGet('getScores', { day: '1' }), apiGet('getScores', { day: '2' })]);
  const t1 = dayTotals('1', res1), t2 = dayTotals('2', res2);
  const names = teamNames();
  const grandA = t1.A + t2.A, grandB = t1.B + t2.B;
  document.getElementById('sbLeaderboard').innerHTML = `
    <div class="lbx-total-summary">
      <div class="lbx-total-row"><span>Day 1</span><span>${formatPts(t1.A)} &ndash; ${formatPts(t1.B)}</span></div>
      <div class="lbx-total-row"><span>Day 2</span><span>${formatPts(t2.A)} &ndash; ${formatPts(t2.B)}</span></div>
      <div class="lbx-total-row lbx-grand"><span>${escapeHtml(names.A)} vs ${escapeHtml(names.B)} &mdash; Tournament Total</span><span>${formatPts(grandA)} &ndash; ${formatPts(grandB)}</span></div>
    </div>
  `;
}

// ---- Match Scorecards: "Progression" (collapsed) and "Full Scorecards" ----

// A per-hole strip showing the running match-play margin as holes come in —
// cumulative net of wins (+1 for A, -1 for B) over whatever's decided so far,
// left to right. A hole before anything's been decided yet shows as blank
// rather than "AS", so "not started" and "all square" don't look the same.
function progressionStripHtml(results, activeStart) {
  let cum = 0, anyDecided = false;
  let cells = '';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    if (r === 'A') { cum += 1; anyDecided = true; }
    else if (r === 'B') { cum -= 1; anyDecided = true; }
    else if (r === 'Half') { anyDecided = true; }
    const hole = activeStart + i;
    let label, cls;
    if (!anyDecided) { label = '&ndash;'; cls = 'pending'; }
    else if (cum === 0) { label = 'AS'; cls = 'half'; }
    else { label = `${Math.abs(cum)} up`; cls = cum > 0 ? 'a' : 'b'; }
    cells += `<div class="prog-chip prog-${cls}" title="Hole ${hole}"><div class="prog-hole">${hole}</div><div class="prog-label">${label}</div></div>`;
  }
  return cells;
}

function scorecardsCollapsedHtml(day, row, scoresByMatch) {
  const { holeRows } = matchSegmentInfo(day, row, scoresByMatch);
  const rowsDef = day === '2'
    ? [
        ['Best Ball (front 9)', day2BestBallPerHoleResults(row, holeRows), 1],
        [`Match Play: ${row.MP1_TeamA || '?'} vs ${row.MP1_TeamB || '?'}`, day2MatchPlayPerHoleResults(row, holeRows, 1), 10],
        [`Match Play: ${row.MP2_TeamA || '?'} vs ${row.MP2_TeamB || '?'}`, day2MatchPlayPerHoleResults(row, holeRows, 2), 10],
      ]
    : [
        ["Captain's Choice (front 9)", day1PerHoleResults(holeRows, 1, 9), 1],
        ['Modified Alt Shot (back 9)', day1PerHoleResults(holeRows, 10, 18), 10],
      ];
  const progRows = rowsDef.map(([label, results, start]) => `
    <div class="prog-row">
      <div class="prog-seg-label">${escapeHtml(label)}</div>
      <div class="prog-strip">${progressionStripHtml(results, start)}</div>
    </div>
  `).join('');
  return `<div class="sc-collapsed-match"><div class="match-title">${escapeHtml(matchLabel(day, row))}</div>${progRows}</div>`;
}

async function loadScorecardsView(day) {
  const res = await apiGet('getScores', { day });
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });

  const rows = pairings[day] || [];
  let html;
  if (!rows.length) {
    html = '<p class="hint">No matches set up yet.</p>';
  } else if (sbScMode === 'collapsed') {
    html = rows.map((row) => hasPlayersLb(row)
      ? scorecardsCollapsedHtml(day, row, scoresByMatch)
      : `<div class="sc-collapsed-match"><div class="lbx-unset">Match ${escapeHtml(row.MatchNum)} — not set up yet</div></div>`
    ).join('');
  } else {
    const names = teamNames();
    html = rows.map((row) => {
      if (!hasPlayersLb(row)) return `<div class="scorecard-block"><div class="lbx-unset">Match ${escapeHtml(row.MatchNum)} — not set up yet</div></div>`;
      const holeRows = buildHoleGrid(day, row.MatchNum, scoresByMatch[row.MatchNum] || []);
      return `<div class="scorecard-block">
        <h3 style="margin-bottom:2px;">${escapeHtml(matchLabel(day, row))}</h3>
        <div class="sc-teams-live">${escapeHtml(names.A)} vs ${escapeHtml(names.B)} &middot; Start Hole: ${escapeHtml(row.StartHole || 'TBD')}</div>
        ${scorecardHtmlForMatch(day, row, holeRows)}
      </div>`;
    }).join('');
  }
  document.getElementById('sbScorecardsBody').innerHTML = html;
}

// ====================== UTIL ======================
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

  await onScMatchSelected();
})();
