<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4332">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tee Sheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --fairway:#1B4332;
    --fairway-dark:#122E22;
    --ivory:#F6F1E4;
    --ivory-line:#E7DFC9;
    --brass:#B8863B;
    --brass-light:#D9B876;
    --ink:#26261F;
    --sage:#7C9A79;
    --rust:#A6432E;
    --paper-shadow: 0 1px 0 rgba(38,38,31,0.06);
  }
  *{box-sizing:border-box;}
  #tee-sheet-root{
    font-family:'Inter',sans-serif;
    background:var(--ivory);
    color:var(--ink);
    min-height:100%;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  .ts-warn-banner{
    background:#3a2a12; color:#F6E7C9; font-size:12.5px; text-align:center; padding:9px 14px; line-height:1.5;
  }
  .ts-warn-banner b{ color:#FFD98A; }
  .ts-test-banner{
    background:repeating-linear-gradient(135deg, #7A1F1F, #7A1F1F 10px, #5C1616 10px, #5C1616 20px);
    color:#FFE9E9; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-align:center;
    padding:9px 14px; line-height:1.5; text-transform:uppercase;
  }
  .ts-header{
    background:var(--fairway);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03) 0, transparent 45%);
    color:var(--ivory);
    padding:28px 24px 22px;
    position:relative;
    overflow:hidden;
  }
  .ts-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 14px, transparent 14px 28px);
    opacity:0.55;
  }
  .ts-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass-light); margin:6px 0 6px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .ts-admin-pill{
    font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:0; text-transform:none;
    background:rgba(255,255,255,0.12); color:var(--ivory); border:1px solid rgba(255,255,255,0.25);
    padding:2px 9px; border-radius:20px; cursor:pointer;
  }
  .ts-admin-pill.on{ background:var(--brass); border-color:var(--brass); color:var(--fairway-dark); font-weight:600; }
  .ts-title{
    font-family:'Fraunces',serif; font-weight:700; font-size:30px;
    margin:0; letter-spacing:-0.01em;
  }
  .ts-version{ font-size:11px; color:#9BB89A; margin:2px 0 0; font-family:'IBM Plex Mono',monospace; }
  .ts-sub{ font-size:13.5px; color:#CFE0CC; margin:6px 0 0; max-width:520px; line-height:1.5;}

  .ts-body{ max-width:760px; margin:0 auto; padding:0 20px 60px; }

  .ts-whoami{
    background:#fff; border:1px solid var(--ivory-line); border-radius:10px;
    margin-top:20px; padding:14px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 6px 20px rgba(27,67,50,0.08); flex-wrap:wrap;
  }
  .ts-whoami label{ font-size:12px; color:#6b6a5e; font-weight:500; }
  .ts-whoami select{
    font-family:'Inter',sans-serif; font-size:14px; padding:7px 10px; border-radius:7px;
    border:1px solid var(--ivory-line); background:var(--ivory); color:var(--ink); flex:1; min-width:160px;
  }
  .ts-manage-btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; color:var(--fairway);
    background:none; border:1px solid var(--ivory-line); padding:7px 12px; border-radius:7px; cursor:pointer;
  }
  .ts-manage-btn:hover{ background:var(--ivory); }
  .ts-pin-link{
    font-size:11.5px; color:#6b6a5e; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;
  }

  .ts-tabbar{
    display:flex; gap:10px; margin-top:20px; padding-bottom:4px;
  }
  .ts-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:'Inter',sans-serif; background:#fff; border:2px solid var(--ivory-line); border-radius:12px;
    cursor:pointer; padding:14px 8px; color:var(--fairway);
    box-shadow:0 2px 6px rgba(27,67,50,0.06); transition:all .15s ease;
  }
  .ts-tab-icon{ font-size:26px; line-height:1; }
  .ts-tab-label{ font-size:13px; font-weight:700; text-align:center; }
  .ts-tab.active{ background:var(--fairway); color:var(--ivory); border-color:var(--fairway); box-shadow:0 4px 14px rgba(27,67,50,0.22); }
  .ts-tab:hover{ border-color:var(--brass); }
  .ts-subtabbar{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .ts-subtab{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--fairway);
    background:#fff; border:1.5px solid var(--ivory-line); border-radius:16px; padding:6px 13px; cursor:pointer;
  }
  .ts-subtab.active{ background:var(--brass); color:var(--fairway-dark); border-color:var(--brass); }

  .ts-reminders{ margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .ts-reminder{
    display:flex; gap:10px; align-items:flex-start; background:#FBF0EA; border:1px solid #EBCFC1;
    border-left:3px solid var(--rust); border-radius:8px; padding:11px 13px; font-size:13.5px; line-height:1.45;
  }
  .ts-reminder b{ font-weight:600; }
  .ts-reminder .flag{ font-size:15px; line-height:1.2; }

  .ts-section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:30px 0 12px;
    display:flex; align-items:baseline; gap:8px;
  }
  .ts-section-title span{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8b8a7c; font-weight:400; }

  .ts-card{
    background:#fff; border:1px solid var(--ivory-line); border-radius:10px; margin-bottom:10px;
    box-shadow:var(--paper-shadow); overflow:hidden;
  }
  .ts-card-row{
    display:flex; align-items:center; gap:14px; padding:13px 15px; cursor:pointer;
  }
  .ts-card-row:hover{ background:#FBFAF5; }
  .ts-date-block{
    font-family:'IBM Plex Mono',monospace; text-align:center; width:52px; flex-shrink:0;
    border-right:1px dashed var(--ivory-line); padding-right:12px;
  }
  .ts-date-dow{ font-size:10.5px; letter-spacing:.08em; color:var(--sage); text-transform:uppercase; }
  .ts-date-num{ font-size:20px; font-weight:500; color:var(--ink); line-height:1.1; }
  .ts-date-mon{ font-size:10px; color:#8b8a7c; text-transform:uppercase; }

  .ts-card-mid{ flex:1; min-width:0; }
  .ts-card-mid-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ts-count{ font-size:14px; font-weight:600; }
  .ts-teetimes{
    font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--fairway); color:var(--ivory);
    padding:2px 7px; border-radius:20px;
  }
  .ts-teetimes.zero{ background:#e6e2d4; color:#8b8a7c; }
  .ts-duty{ font-size:12px; color:#6b6a5e; margin-top:3px; display:flex; align-items:center; gap:5px;}
  .ts-duty .golf-flag{ color:var(--brass); }
  .ts-duty-select{
    font-family:'Inter',sans-serif; font-size:12px; color:#6b6a5e; background:var(--ivory);
    border:1px solid var(--ivory-line); border-radius:6px; padding:2px 6px; max-width:120px;
  }
  .ts-duty-static{ font-weight:500; }
  .ts-duty-lock{
    font-size:10.5px; color:#a3a293; background:none; border:none; cursor:pointer; text-decoration:underline; padding:0;
  }
  .ts-duty-window{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:1px 6px; border-radius:5px;
  }
  .win-open{ background:#E4EFE1; color:#3E6B3A; }
  .win-soon{ background:#FBF0EA; color:var(--rust); }
  .win-later{ background:#F0EEE3; color:#8b8a7c; }

  .ts-toggle-wrap{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
  .ts-card.closed{ background:#FBF7F0; }
  .ts-closed-line{ display:flex; align-items:center; gap:8px; }
  .closed-flag{ font-size:15px; }
  .closed-text{ font-size:13.5px; font-weight:600; color:var(--rust); }
  .ts-closed-toggle-label{
    flex-shrink:0; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:#a3a293;
    padding:8px 12px; border:1.5px dashed #d8d4c4; border-radius:20px;
  }
  .ts-closure-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px dashed var(--ivory-line); font-size:13px;
  }
  .ts-closure-row:last-of-type{ border-bottom:none; }
  .ts-closure-date{ color:var(--ink); flex-shrink:0; }
  .ts-closure-status{ font-size:11.5px; color:#8b8a7c; flex:1; text-align:right; margin-right:6px; }
  .ts-closure-status.closed{ color:var(--rust); font-weight:600; }
  .ts-closure-row button{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:var(--fairway);
    background:#fff; border:1px solid var(--fairway); border-radius:14px; padding:3px 10px; cursor:pointer; flex-shrink:0;
  }
  .ts-signup-select{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:8px 10px;
    border-radius:20px; border:1.5px solid var(--fairway); background:#fff; color:var(--fairway); cursor:pointer;
    transition:all .12s ease;
  }
  .ts-signup-select.in{ background:var(--fairway); color:var(--ivory); }
  .ts-signup-select.standby{ background:var(--brass); border-color:var(--brass); color:var(--ivory); }
  .ts-standby-count{ color:var(--brass); font-weight:600; }
  .ts-chip-group-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--sage); margin:6px 0 4px;
  }
  .ts-chip-group-label:first-child{ margin-top:0; }
  .ts-chip-group-label.standby{ color:var(--brass); }
  .ts-teams-block{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--ivory-line); }
  .ts-team-row{ margin-bottom:8px; }
  .ts-team-num{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--fairway); margin-bottom:4px;
  }
  .ts-team-so{ color:#8b8a7c; font-size:10.5px; }
  .ts-score-table{ border-collapse:collapse; font-family:'IBM Plex Mono',monospace; }
  .ts-score-table th, .ts-score-table td{ text-align:center; padding:3px 2px; }
  .ts-score-table thead th{ font-size:10px; font-weight:600; color:#8b8a7c; }
  .ts-score-table thead tr:first-child th{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--fairway); padding-bottom:4px; }
  .ts-score-table td.ts-score-name, .ts-score-table th:first-child{ text-align:left; padding-right:10px; white-space:nowrap; font-family:'Inter',sans-serif; font-size:12.5px; }
  .ts-score-table th:nth-child(8), .ts-score-table td:nth-child(8),
  .ts-score-table th:nth-child(14), .ts-score-table td:nth-child(14){ border-left:2px solid var(--ivory-line); }
  .ts-score-input{
    width:30px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:center;
    padding:4px 2px; border-radius:5px; border:1px solid var(--ivory-line);
  }
  .ts-score-display{
    display:inline-block; width:30px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    text-align:center; padding:4px 2px; border-radius:5px; border:1px solid transparent; color:var(--ink);
  }
  .ts-score-input-lg{
    width:64px; font-size:22px; padding:10px 4px; border-radius:9px; border-width:1.5px;
    flex-shrink:0;
  }
  input.ts-score-input-lg.ts-score-stroke{ border-color:var(--brass); background:#FBF3E4; }
  .ts-score-step{
    width:38px; height:38px; flex-shrink:0; font-size:19px; line-height:1; font-weight:600;
    border-radius:9px; border:1px solid var(--ivory-line); background:#fff; color:var(--ink);
  }
  .ts-score-step:active{ background:var(--ivory-line); }
  .ts-score-table td.ts-score-stroke{ background:#FBF3E4; }
  .ts-score-table td.ts-score-stroke .ts-score-input{ border-color:var(--brass); }
  .ts-score-table td.ts-score-stroke .ts-score-display{ border-color:var(--brass); }
  .ts-lowball-row td{ font-weight:700; border-top:2px solid var(--ivory-line); padding-top:6px; color:var(--fairway); }
  .ts-lowball-row td.ts-score-name{ color:var(--ink); font-weight:600; }
  .ts-score-cell-wrap{ position:relative; display:inline-block; }
  .ts-stroke-dot{
    position:absolute; top:3px; right:4px; width:6px; height:6px; border-radius:50%;
    background:var(--brass); pointer-events:none;
  }
  .ts-stroke-dot-lg{ width:10px; height:10px; top:7px; right:9px; }
  /* Printable blank scorecards — one table per team, 18 holes straight across
     with a Front 9 / Back 9 divider, meant to be printed and taken to the
     course. Its own class (not .ts-score-table) since the column divider
     falls after hole 9 here instead of after every 6-hole series. */
  .ts-scorecard-table{ border-collapse:collapse; font-family:'IBM Plex Mono',monospace; width:100%; }
  .ts-scorecard-table th, .ts-scorecard-table td{ text-align:center; padding:5px 3px; border-bottom:1px solid var(--ivory-line); }
  .ts-scorecard-table thead th{ font-size:10px; font-weight:600; color:#8b8a7c; }
  .ts-scorecard-table thead tr:first-child th{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--fairway); padding-bottom:4px; }
  .ts-scorecard-table td.ts-score-name, .ts-scorecard-table th:first-child{ text-align:left; padding-right:10px; white-space:nowrap; font-family:'Inter',sans-serif; font-size:12.5px; }
  .ts-scorecard-table th:nth-child(11), .ts-scorecard-table td:nth-child(11){ border-left:2px solid var(--ivory-line); }
  .ts-scorecard-table td.ts-scorecard-blank{ min-width:22px; height:22px; }
  .ts-scorecard-table td.ts-score-stroke{ background:#FBF3E4; }
  .ts-scorecard-table tr.ts-par-row th{ color:var(--ink); font-weight:700; border-top:1px solid var(--ivory-line); }
  .ts-scorecard-table tr.ts-scorecard-hybrid-row td{ font-size:9.5px; color:#8b8a7c; font-style:italic; padding-top:0; border-bottom:1px dashed var(--ivory-line); }
  .ts-scorecard-table tr.ts-scorecard-hybrid-row td:first-child{ font-family:'Inter',sans-serif; }
  .ts-scorecard-print-wrap{ margin-top:20px; padding-top:14px; border-top:1px dashed var(--ivory-line); }
  .ts-scorecard-block{ margin-top:16px; }
  @media print{
    .ts-scorecard-block{ break-inside:avoid; }
  }
  /* A score still sitting at its silent par default (nobody has actually typed,
     stepped, or otherwise confirmed it yet) renders visibly different from a
     real entry, so it's obvious at a glance which holes still need a look. */
  .ts-score-input-default{ color:#a9a795; font-style:italic; border-style:dashed; }
  .ts-score-unsaved{ border-color:var(--rust) !important; background:#FBEAE6 !important; color:var(--rust) !important; font-style:normal !important; }
  .ts-unsaved-dot{
    position:absolute; top:3px; left:4px; width:6px; height:6px; border-radius:50%;
    background:var(--rust); pointer-events:none;
  }
  .ts-unsaved-retry{
    margin-top:4px; background:none; border:none; padding:0; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:700; color:var(--rust); text-decoration:underline;
  }
  .ts-accept-scores-btn{
    background:var(--fairway); color:var(--ivory); border:none; border-radius:9px;
    padding:11px 18px; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700;
    cursor:pointer; width:100%; max-width:360px;
  }
  .ts-accept-scores-btn:active{ background:var(--fairway-dark); }
  .ts-hh-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ts-hh-cell{ display:flex; flex-direction:column; align-items:center; gap:2px; width:38px; }
  .ts-hh-cell label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8b8a7c; }
  .ts-hh-cell input{
    width:34px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:center;
    padding:4px 2px; border-radius:5px; border:1px solid var(--ivory-line);
  }
  .ts-bet-row{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--ivory-line); font-size:12.5px; }
  .ts-bet-row:last-child{ border-bottom:none; }
  .ts-bet-row .ts-bet-label{ color:var(--ink); }
  .ts-bet-row .ts-bet-result{ font-family:'IBM Plex Mono',monospace; color:#6b6a5e; white-space:nowrap; }
  .ts-holes-group{ display:flex; gap:4px; }
  .ts-holes-pill{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8b8a7c; background:#fff;
    border:1px solid var(--ivory-line); border-radius:12px; padding:3px 8px; cursor:pointer;
  }
  .ts-holes-pill.active{ color:var(--brass); background:#FBF3E4; border-color:#EAD6A8; font-weight:600; }
  .ts-tee-select{
    font-family:'Inter',sans-serif; font-size:11px; color:#6b6a5e; background:#fff;
    border:1px solid var(--ivory-line); border-radius:12px; padding:3px 6px; margin-top:4px;
  }

  .ts-players{
    padding:0 15px 14px 81px; font-size:12.5px; color:#6b6a5e; line-height:1.6; display:none;
  }
  .ts-players.open{ display:block; }
  .ts-players .name-chip{
    display:inline-block; background:var(--ivory); border:1px solid var(--ivory-line); border-radius:20px;
    padding:2px 9px; margin:2px 4px 2px 0; font-size:12px;
  }
  .ts-players .name-chip.me{ border-color:var(--brass); background:#FBF3E4; font-weight:600; color:#7A5A20; }
  .ts-players .name-chip .holes-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--rust); margin-left:4px;
  }
  .ts-guest-badge{
    font-family:'Inter',sans-serif; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--brass); background:#FBF3E4; border-radius:6px; padding:1px 5px; margin-left:4px;
  }
  .ts-admin-toggle-label{
    display:flex; align-items:center; gap:4px; font-family:'Inter',sans-serif; font-size:12px; color:#6b6a5e; white-space:nowrap;
  }
  .name-chip .chip-remove{
    background:none; border:none; color:#a3a293; cursor:pointer; font-size:13px; padding:0 0 0 5px; line-height:1;
  }
  .name-chip .chip-remove:hover{ color:var(--rust); }
  .ts-admin-add{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ts-admin-add-select{
    font-family:'Inter',sans-serif; font-size:12px; color:var(--fairway); background:#EEF4EC;
    border:1px solid #CFE0CC; border-radius:16px; padding:4px 10px;
  }
  .ts-admin-add-guest-btn{
    font-family:'Inter',sans-serif; font-size:12px; color:var(--brass); background:#FBF3E4;
    border:1px solid #EAD6A8; border-radius:16px; padding:4px 10px; cursor:pointer;
  }
  .ts-empty{ font-style:italic; color:#a3a293; }

  .ts-booking-alert{
    display:flex; gap:9px; align-items:flex-start; background:#FBF0EA; border:1px solid #EBCFC1;
    border-left:3px solid var(--rust); border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.5;
    margin:2px 0 10px;
  }
  .ts-booking-alert b{ font-weight:600; }
  .ts-booking-alert .flag{ font-size:14px; line-height:1.3; }
  .ts-booking-alert.unassigned{ background:#F0EEE3; border-color:var(--ivory-line); border-left-color:#c9c6b4; color:#6b6a5e; }

  .ts-roster-panel{
    background:#fff; border:1px solid var(--ivory-line); border-radius:10px; padding:16px; margin-top:16px;
  }
  .ts-roster-panel h4{ font-family:'Fraunces',serif; font-size:15px; margin:0 0 10px; }
  .ts-roster-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .ts-roster-row input{
    flex:1; min-width:110px; font-family:'Inter'; font-size:13.5px; padding:7px 10px; border-radius:7px; border:1px solid var(--ivory-line);

<div id="tee-sheet-root">
  <div class="ts-loading" id="ts-loading">setting the tee sheet…</div>
</div>
<div id="ts-modal-root"></div>

<script>
(function(){
  const root = document.getElementById('tee-sheet-root');
  // Auto-detects which environment this is running as, based on the URL —
  // so the exact same file can be uploaded to both the test and live GitHub
  // repos, and each will safely connect to its own backend and data.
  // Defaults to TEST unless the URL clearly matches the live site, since
  // that's the safer default (e.g. when opened as a local file for testing).
  const IS_LIVE_ENV = window.location.pathname.includes('tee-sheet-live') || window.location.hostname.includes('tee-sheet-live');
  const IS_TEST_ENV = !IS_LIVE_ENV;

  const BACKEND_URL = IS_LIVE_ENV
    ? 'https://script.google.com/macros/s/AKfycbzkKxBkARjT_5rVtGrHo7SIlJnTaHJ09juHOTGkdhY44Pt2hMNdotuftauRgLMtbiNLiQ/exec'
    : 'https://script.google.com/macros/s/AKfycbw2DXbcsX-ORzaZlv0WM7GXFBNaWcu3tqM_VvCu0OyxbxL0rJyLeBNqeJe_1mjB56Tbfw/exec';
  const BACKEND_KEY = IS_LIVE_ENV ? 'YwlubntDPMdjkcMe' : 'qdQ5OcCYA5gT';
  const ME_KEY = IS_LIVE_ENV ? 'golf-league-me' : 'golf-league-me-TEST';
  const ADMIN_UNLOCK_KEY = IS_LIVE_ENV ? 'golf-league-admin-unlocked' : 'golf-league-admin-unlocked-TEST';
  const ADMIN_GATE_KEY = IS_LIVE_ENV ? 'golf-league-admin-gate-players' : 'golf-league-admin-gate-players-TEST';
  const VERIFIED_KEY = IS_LIVE_ENV ? 'golf-league-verified-players' : 'golf-league-verified-players-TEST';
  const GUEST_UNLOCK_KEY = IS_LIVE_ENV ? 'golf-league-guest-unlocked' : 'golf-league-guest-unlocked-TEST';
  const PLAYERS_PER_TEE_TIME = 4;
  // The club never gives us more than 3 tee times, so pre-confirmation
  // estimates should never assume a 4th one is possible.
  const MAX_TEE_TIMES = 3;
  const PRO_SHOP_EMAILS = ['rdelfs@theheritageclub.net', 'rsatterwhite@theheritageclub.net'];
  // Extra CC on just the "playing tomorrow" reminder (not the pro-shop duty one).
  const GOLF_TOMORROW_EXTRA_CC = ['stevekirchhoff52@gmail.com', 'rtleene@aol.com'];
  const BOOKING_WINDOW_DAYS = 14; // club allows booking 2 weeks ahead
  const WEEKS_AHEAD = 52;
  const VERSION_DATE = 'September 8, 2026'; // update this each time a change is promoted to live
  const PLAY_DOWS = [1,3,5]; // Mon, Wed, Fri
  const HOLES_CYCLE = ['18','F9','B9'];
  const HOLES_LABEL = { '18': '18 holes', 'F9': 'Front 9', 'B9': 'Back 9' };

  const HOLES_SHORT = { '18': '', 'F9': 'F9', 'B9': 'B9' };
  const HOLES_PILL_LABEL = { '18': '18', 'F9': 'Front 9', 'B9': 'Back 9' };

  // Scoring & betting: the round is split into 3 series of 6 holes each,
  // with a $ stake per series (both admin-configurable per date).
  const NUM_SERIES = 3;
  const HOLES_PER_SERIES = 6;

  // --- backend: a Google Apps Script Web App backed by a Google Sheet plays the
  // role Claude's window.storage used to play. Personal, per-device data (who you
  // are, whether you're unlocked as admin) lives in this browser's own localStorage
  // instead, since there's no need for that to be shared or synced.
  const storageAvailable = true; // this app always has somewhere to save, once deployed

  // A plain fetch() with no timeout can hang forever if the network stalls or the
  // backend (an Apps Script web app — sometimes slow to "wake up") never answers —
  // most noticeable as a Home Screen icon on iOS getting stuck on the loading
  // screen with no way out short of force-closing it. This aborts and lets the
  // caller fall back instead of waiting indefinitely.
  const FETCH_TIMEOUT_MS = 20000;
  async function fetchWithTimeout(url, options){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try{
      return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchSharedData(){
    const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}`;
    const res = await fetchWithTimeout(url);
    const text = await res.text();
    return JSON.parse(text);
  }

  async function saveSharedData(obj){
    const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}`;
    // Content-Type text/plain avoids a CORS preflight that Apps Script Web Apps
    // don't handle well — the server still parses the body as JSON regardless.
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(obj)
    });
    // The backend can deliberately refuse a save (e.g. its drastic-shrink safety
    // net) with an HTTP-200 { error } body rather than a network-level failure —
    // fetch() alone wouldn't notice that, so check explicitly and throw, which
    // routes it through saveData()'s existing retry/failure handling below.
    let parsed;
    try{ parsed = JSON.parse(await res.text()); }catch(e){ return; }
    if(parsed && parsed.error) throw new Error(parsed.error);
  }

  // Asks the Apps Script backend to email whoever just got promoted off
  // standby — the backend does the actual sending (client JS can't send mail
  // directly). Fails silently if the network hiccups; this is a nice-to-have
  // notification, not something that should block the signup change itself.
  async function notifyPromoted(dateKey, playerIds){
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=notify_promotion`;
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, playerIds })
      });
    }catch(e){ /* best-effort */ }
  }

  // Fires once, right when a confirmed-tee-times count is entered/changed and it
  // turns out to be short of what's needed — this is the "we got fewer tee times
  // than we need" moment. The app doesn't decide who drops out; it just alerts
  // the admin so the group can work it out. standbyIds is who the app's own
  // signup-order placeholder currently has sitting out, for context only.
  async function notifyShortfall(dateKey, signedUpCount, confirmedTeeTimes, capacity, standbyIds){
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=notify_shortfall`;
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, signedUpCount, confirmedTeeTimes, capacity, standbyIds })
      });
    }catch(e){ /* best-effort */ }
  }

  // Fires when someone confirmed to play drops out on the actual day of play
  // (tee times are already booked by then, so this is the "a foursome just
  // lost a player, someone needs to know right now" case) — distinct from an
  // ordinary advance drop-out, which just quietly opens the spot to standby
  // and shows up in tomorrow's admin-only activity digest, not an
  // immediate group-wide email.
  async function notifyDayOfDropout(dateKey, playerName){
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=notify_dayof_dropout`;
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, playerName })
      });
    }catch(e){ /* best-effort */ }
  }

  // Records a player-driven change (signup, drop-out, duty swap) into
  // data.activityLog, so the nightly digest (sendDailyActivityDigest in the
  // backend) can email the admin a list of what happened the day before. Just
  // mutates local data — rides along with whatever saveData() call the caller
  // already makes right after, no extra network round trip of its own.
  function logActivity(type, extra){
    if(!data.activityLog) data.activityLog = [];
    const me = meId ? data.roster.find(p => p.id === meId) : null;
    data.activityLog.push(Object.assign({
      ts: Date.now(),
      type,
      playerId: meId,
      playerName: me ? me.name : 'Unknown'
    }, extra || {}));
  }

  // Score entry and round setup go through their own narrow backend actions
  // (instead of the whole-blob saveData()) because during a round several
  // scorekeepers may be saving around the same time — the backend
  // lock-serializes these and merges just the one hole/setting, so one
  // group's entry can't silently clobber another's the way a full-blob
  // overwrite could. The server's returned round object is authoritative.
  // opts.silent marks this as the automatic par pre-fill (not something a person
  // actually typed, stepped, or cleared) — everything else counts as a real,
  // confirmed entry, including an intentional clear. A silent call is a no-op if
  // there's already any score on file (real, or a prior default — including one
  // saved before "confirmed" tracking existed) or if this hole's been touched in
  // any way before, so it never clobbers a genuine entry or fights back against
  // someone who deliberately blanked a score out.
  async function saveScore(dateKey, playerId, holeNum, strokes, opts){
    opts = opts || {};
    const round = ensureRoundDefaults(dateKey);
    const holeKey = String(holeNum);
    if(opts.silent){
      const existing = (round.scores[playerId] || {})[holeKey];
      const already = round.confirmed[playerId] && (holeKey in round.confirmed[playerId]);
      if(typeof existing === 'number' || already) return;
    }
    if(typeof strokes === 'number' && strokes > 0){
      if(!round.scores[playerId]) round.scores[playerId] = {};
      round.scores[playerId][holeKey] = strokes;
    } else if(round.scores[playerId]){
      delete round.scores[playerId][holeKey];
    }
    if(!round.confirmed[playerId]) round.confirmed[playerId] = {};
    round.confirmed[playerId][holeKey] = !opts.silent;
    const errKey = scoreErrKey(dateKey, playerId, holeKey);
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=save_score`;
      const res = await fetchWithTimeout(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, playerId, holeNum: holeKey, strokes, confirmed: !opts.silent })
      });
      const parsed = JSON.parse(await res.text());
      if(parsed && parsed.error) throw new Error(parsed.error);
      if(parsed && parsed.round){
        data.rounds[dateKey] = parsed.round;
        if(typeof parsed.lastModified === 'number'){ data._lastModified = parsed.lastModified; lastKnownModified = parsed.lastModified; }
      }
      unsavedScoreKeys.delete(errKey);
    }catch(e){
      // Optimistic local edit stands, but — unlike a silent par default, which just
      // quietly gets another chance next time this hole is viewed — a real entry
      // that didn't make it to the backend is flagged so the scorer can see it and
      // it gets retried instead of just being lost if the tab closes.
      if(!opts.silent) unsavedScoreKeys.add(errKey);
    }
  }

  // Re-attempts every score save that previously failed, using whatever's currently
  // in local state as the value to send (typically unchanged since the failure,
  // unless someone's since corrected it, which is fine — that's the value that
  // should win). Doesn't render itself — callers decide when that's safe (a manual
  // tap re-renders right away; the background heartbeat below only does so when
  // nobody's mid-edit).
  async function retryUnsavedScores(){
    if(!unsavedScoreKeys.size) return;
    const keys = Array.from(unsavedScoreKeys);
    for(const key of keys){
      const [dateKey, playerId, holeKey] = key.split('::');
      const round = data.rounds[dateKey];
      if(!round){ unsavedScoreKeys.delete(key); continue; }
      const val = (round.scores[playerId] || {})[holeKey];
      await saveScore(dateKey, playerId, holeKey, typeof val === 'number' ? val : null);
    }
  }

  // Runs every ~25s: retries any failed score saves, and — only while Live scoring
  // is actually the thing on screen — pulls a fresh copy of rounds/teams so two
  // scorers on different phones see each other's entries without either of them
  // reloading. Skips the whole tick (not just the pull) if anything in the app has
  // focus, so a background heartbeat can never interrupt someone mid-keystroke,
  // on this tab or any other.
  async function scoringHeartbeat(){
    const active = document.activeElement;
    const editing = active && root.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');
    if(editing) return;
    let changed = false;
    if(unsavedScoreKeys.size){ await retryUnsavedScores(); changed = true; }
    const viewingLive = isAdmin && activeSection === 'scoring';
    if(viewingLive){
      try{
        const fetched = await fetchSharedData();
        if(fetched && typeof fetched === 'object' && !fetched.error){
          if(fetched.rounds){ data.rounds = fetched.rounds; changed = true; }
          if(fetched.teams){ data.teams = fetched.teams; changed = true; }
          if(typeof fetched._lastModified === 'number'){ data._lastModified = fetched._lastModified; lastKnownModified = fetched._lastModified; }
        }
      }catch(e){ /* best-effort — try again next tick */ }
    }
    if(changed) render();
  }

  async function saveRoundSettings(dateKey, patch){
    ensureRoundDefaults(dateKey);
    Object.assign(data.rounds[dateKey], patch);
    try{
      const url = `${BACKEND_URL}?key=${encodeURIComponent(BACKEND_KEY)}&action=save_round_settings`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dateKey, patch })
      });
      const parsed = JSON.parse(await res.text());
      if(parsed && parsed.round){
        data.rounds[dateKey] = parsed.round;
        if(typeof parsed.lastModified === 'number'){ data._lastModified = parsed.lastModified; lastKnownModified = parsed.lastModified; }
      }
    }catch(e){ /* best-effort */ }
  }

  let data = { roster: [], signups: {}, duty: {}, closures: {}, swapRequests: {}, confirmedTeeTimes: {}, teeTimeSchedule: {}, teeRatings: {}, teeOptions: [], teams: {}, rounds: {}, holeHandicaps: {}, holeHandicapsRed: {"1":7,"2":17,"3":13,"4":3,"5":9,"6":1,"7":5,"8":15,"9":11,"10":8,"11":10,"12":16,"13":2,"14":4,"15":6,"16":14,"17":18,"18":12}, holePars: {}, adminPin: null, guestPin: '3672', playerPins: {}, activityLog: [] };
  // Set when the very first load couldn't reach the backend at all (network hiccup,
  // or the fetch timing out per FETCH_TIMEOUT_MS above) — distinct from a
  // successful load that happens to find an empty roster, so init() can show a
  // "couldn't connect" screen instead of the misleading "Set up your roster" one.
  let bootError = false;
  let meId = null;
  let lastKnownModified = 0;
  let isAdmin = false;
  // Super-admin: unlocked only via the single shared master PIN (data.adminPin). Regular
  // admin access (isAdmin) can also come from a roster-flagged admin entering their own
  // PIN, but only a super-admin can grant or revoke another player's Admin flag.
  let isSuperAdmin = false;
  // Per-device list of flagged-admin player ids who've already unlocked the admin portion
  // with their own PIN on this device — mirrors verifiedPlayers, but for a separate gate.
  let adminGatePlayers = [];
  let verifiedPlayers = [];
  // Whether this device has already entered the shared guest PIN — separate from any
  // roster identity. Only matters for someone who never picks a name (a true visitor);
  // a recognized player or an admin never needs it.
  let isGuestVerified = false;
  let expanded = {};
  let expandCollapseState = null; // 'expand' | 'collapse' | null — just for the subtle indicator
  let activeSection = 'schedule'; // 'schedule' | 'duty' | 'handicaps' | 'scoring' | 'admin'
  let adminSubTab = 'roster'; // 'roster' | 'closures' | 'data' | 'reminders' | 'handicaps'
  let scoringSelectedDate = null; // dateKey currently shown on the Scoring & Bets tab
  let scoringViewMode = 'setup'; // 'setup' | 'live' | 'season' — which part of Scoring & Bets is showing
  let scoringHoleIndex = 0; // position within flatHoles for the hole-by-hole view
  // Real (non-silent) score saves that failed to reach the backend — a course's spotty
  // signal is exactly when this matters most, so instead of the old silent swallow,
  // these get a visible "not saved" marker and get retried automatically (on
  // reconnect, on the periodic Live scoring poll, or by tapping the marker) rather
  // than quietly staying lost if the tab closes before the network comes back.
  let unsavedScoreKeys = new Set();
  function scoreErrKey(dateKey, playerId, holeNum){ return `${dateKey}::${playerId}::${String(holeNum)}`; }
  let dutySort = 'date'; // 'date' | 'person'
  let dutyFilterId = ''; // '' = everyone, '__me__' = current identity, or a player id
  let scheduleFilterId = ''; // same idea, for the Upcoming Dates list
  let scheduleSort = 'date'; // 'date' | 'person'
  let lastSchedule = [];

  const DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MON_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmtDateKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function daysBetween(a,b){
    const MS = 24*60*60*1000;
    const da = new Date(a.getFullYear(),a.getMonth(),a.getDate());
    const db = new Date(b.getFullYear(),b.getMonth(),b.getDate());
    return Math.round((db-da)/MS);
  }

  function buildSchedule(){
    const dates = [];
    const start = new Date();
    start.setHours(0,0,0,0);
    let cursor = new Date(start);
    while(dates.length < WEEKS_AHEAD*PLAY_DOWS.length){
      if(PLAY_DOWS.includes(cursor.getDay())){
        dates.push(new Date(cursor));
      }
      cursor.setDate(cursor.getDate()+1);
    }
    return dates;
  }

  // The date "Generate teams now" (and the Teams/Swap section on the public
  // Handicaps page) act on — the soonest upcoming play date that isn't closed.
  // Shared so both always agree on which date is "next."
  function nextPlayDateKey(){
    const nextDate = buildSchedule().find(d => !data.closures[fmtDateKey(d)]);
    return nextDate ? fmtDateKey(nextDate) : null;
  }

  // Signups are stored as { dateKey: [{id, holes}, ...] }. Older data (or a stray
  // manual edit) might have plain id strings instead of objects — normalize on load.
  // Also drops any entry whose id no longer matches a roster player — these are
  // "ghost" signups (e.g. left behind by a roster edit that didn't go through the
  // normal remove-player flow) that inflate the signed-up count and the tee-time
  // estimate while staying invisible everywhere names are actually listed, since
  // chipsFor() silently skips an entry it can't resolve to a player. Returns how
  // many ghost entries were removed, so callers can surface or act on that.
  function normalizeSignups(){
    let removedGhosts = 0;
    Object.keys(data.signups).forEach(k => {
      data.signups[k] = (data.signups[k] || []).map(entry => {
        if(typeof entry === 'string') return { id: entry, holes: '18' };
        if(entry && entry.id) return { id: entry.id, holes: HOLES_CYCLE.includes(entry.holes) ? entry.holes : '18' };
        return null;
      }).filter(Boolean).filter(entry => {
        const ok = data.roster.some(r => r.id === entry.id);
        if(!ok) removedGhosts++;
        return ok;
      });
    });
    return removedGhosts;
  }

  // Self-heal: any already-saved team member OR "Not in the bet" entry whose
  // courseHandicap/strokesOff were never computed at all — e.g. an old bench entry
  // from before those fields were tracked there, whether it later got swapped onto
  // a team or is still sitting out — gets them recomputed here, the same way a
  // fresh team generation would. Only touches entries missing the fields outright
  // (an explicit null, once already computed, is left alone — that means "known to
  // have no handicap," not "never checked"), so this doesn't keep re-triggering a
  // save for players who genuinely don't have one on file. Returns how many
  // players were healed, so callers can surface or act on that.
  function normalizeTeams(){
    let healed = 0;
    Object.keys(data.teams).forEach(dateKey => {
      const info = data.teams[dateKey];
      if(!info) return;
      if(Array.isArray(info.teams)){
        info.teams.forEach(team => {
          team.forEach((p, idx) => {
            if(!p || ('courseHandicap' in p && 'strokesOff' in p)) return;
            team[idx] = recomputedForTeamSlot(dateKey, p);
            healed++;
          });
        });
      }
      if(Array.isArray(info.notInBet)){
        info.notInBet.forEach((p, idx) => {
          if(!p || ('courseHandicap' in p && 'strokesOff' in p)) return;
          info.notInBet[idx] = Object.assign(recomputedForTeamSlot(dateKey, p), { reason: p.reason });
          healed++;
        });
      }
    });
    return healed;
  }

  async function loadData(){
    try{
      const fetched = await fetchSharedData();
      if(fetched && typeof fetched === 'object' && !fetched.error){ data = fetched; bootError = false; }
    }catch(e){
      // No data yet, or a network hiccup / timeout — fall back to defaults. If this
      // is the very first load, init() checks bootError so it can show a "couldn't
      // connect" screen instead of quietly rendering an empty roster.
      bootError = true;
    }
    if(!data.roster) data.roster = [];
    if(!data.signups) data.signups = {};
    if(!data.duty) data.duty = {};
    if(!data.closures) data.closures = {};
    if(!data.swapRequests) data.swapRequests = {};
    if(!data.confirmedTeeTimes) data.confirmedTeeTimes = {};
    if(!data.teeTimeSchedule) data.teeTimeSchedule = {};
    if(!data.teeRatings) data.teeRatings = {};
    if(!data.teeOptions) data.teeOptions = [];
    if(!data.teams) data.teams = {};
    if(!data.rounds) data.rounds = {};
    if(!data.holeHandicaps) data.holeHandicaps = {};
    // Seeded once, the first time this field ever loads, with Heritage's actual
    // Red-tee stroke index (from the club's scorecard) — from then on this is
    // just a normal saved value, edited the same as the standard table.
    if(!data.holeHandicapsRed) data.holeHandicapsRed = {"1":7,"2":17,"3":13,"4":3,"5":9,"6":1,"7":5,"8":15,"9":11,"10":8,"11":10,"12":16,"13":2,"14":4,"15":6,"16":14,"17":18,"18":12};
    if(!data.holePars) data.holePars = {};
    if(!data.playerPins) data.playerPins = {};
    if(typeof data.adminPin === 'undefined') data.adminPin = null;
    if(!data.guestPin) data.guestPin = '3672';
    if(!data.activityLog) data.activityLog = [];
    if(typeof data._lastModified !== 'number') data._lastModified = 0;
    lastKnownModified = data._lastModified;
    const removedGhosts = normalizeSignups();
    const healedTeams = normalizeTeams();
    try{ meId = localStorage.getItem(ME_KEY) || null; }catch(e){ meId = null; }
    try{ isGuestVerified = localStorage.getItem(GUEST_UNLOCK_KEY) === 'true'; }catch(e){ isGuestVerified = false; }
    try{ isSuperAdmin = localStorage.getItem(ADMIN_UNLOCK_KEY) === 'true'; }catch(e){ isSuperAdmin = false; }
    isAdmin = isSuperAdmin;
    try{
      const gate = localStorage.getItem(ADMIN_GATE_KEY);
      adminGatePlayers = gate ? JSON.parse(gate) : [];
    }catch(e){ adminGatePlayers = []; }
    // A player granted admin privilege on their roster record still has to unlock the
    // admin portion with their own PIN on each device (see requireAdmin()) — being
    // flagged Admin no longer grants silent access. This just restores that unlock if
    // it already happened on this device, and drops it if their Admin flag was revoked
    // since — so re-granting the flag later correctly asks for the PIN again.
    if(meId){
      const me = data.roster.find(p => p.id === meId);
      if(me && me.isAdmin && adminGatePlayers.includes(meId)){
        isAdmin = true;
      }else if(adminGatePlayers.includes(meId) && (!me || !me.isAdmin)){
        adminGatePlayers = adminGatePlayers.filter(id => id !== meId);
        try{ localStorage.setItem(ADMIN_GATE_KEY, JSON.stringify(adminGatePlayers)); }catch(e){}
      }
    }
    try{
      const ver = localStorage.getItem(VERIFIED_KEY);
      verifiedPlayers = ver ? JSON.parse(ver) : [];
    }catch(e){ verifiedPlayers = []; }
    // Self-heal: if this load turned up ghost signups or teams missing computed
    // handicap fields, persist the cleanup in the background so the fix sticks for
    // everyone, not just this client's view. Fire-and-forget — never block the
    // first paint on this.
    if(removedGhosts > 0 || healedTeams > 0){ saveData().catch(()=>{}); }
  }

  // Before writing, check whether the server's data has changed since we last
  // loaded or saved it — e.g. from the nightly automation, or someone else's
  // edit. If so, warn instead of silently overwriting their change. Returns
  // true if the save should proceed, false if the caller should abort.
  async function checkNotStale(){
    try{
      const fresh = await fetchSharedData();
      const freshModified = (fresh && typeof fresh._lastModified === 'number') ? fresh._lastModified : 0;
      if(freshModified !== lastKnownModified){
        const proceed = await askConfirm(
          'This has changed elsewhere',
          "The data has been updated since you loaded this page — possibly by the automated team emails, or someone else. Reloading first is strongly recommended so you don't overwrite their change. Reload now, or continue anyway at your own risk?",
          'Continue anyway (risky)',
          'Reload now'
        );
        if(!proceed){
          window.location.reload();
          return false;
        }
      }
    }catch(e){ /* if the check itself fails, don't block saving over a network hiccup */ }
    return true;
  }

  async function saveData(){
    const ok = await checkNotStale();
    if(!ok) return;
    data._lastModified = Date.now();
    const maxAttempts = 3;
    let lastError = null;
    for(let attempt = 1; attempt <= maxAttempts; attempt++){
      try{
        await saveSharedData(data);
        lastKnownModified = data._lastModified;
        return;
      }catch(e){
        lastError = e;
        // A deliberate refusal (like the backend's drastic-shrink safety net) will
        // fail the exact same way every time — retrying just delays telling the
        // admin about it, so stop immediately instead of burning all 3 attempts.
        const deliberate = e && typeof e.message === 'string' && e.message.indexOf('Refused:') === 0;
        if(deliberate) break;
        if(attempt < maxAttempts) await new Promise(r => setTimeout(r, 400 * attempt));
      }
    }
    // Previously this just logged to the console and moved on, so a refused or
    // repeatedly-failed save could leave the admin thinking it went through when
    // it never reached the server at all. Surface it instead.
    console.error('Could not save', lastError);
    await showMessage(
      "Save didn't go through",
      (lastError && lastError.message) || "Something went wrong saving — what you see here may not have reached the server. Try again in a moment."
    );
  }
  async function persistMe(id){
    meId = id;
    try{ localStorage.setItem(ME_KEY, id || ''); }catch(e){}
  }
  async function persistSuperAdmin(flag){

    if(flag) isAdmin = true;
    try{ localStorage.setItem(ADMIN_UNLOCK_KEY, flag ? 'true' : 'false'); }catch(e){}
  }
  async function persistAdminGate(id){
    isAdmin = true;
    if(!adminGatePlayers.includes(id)) adminGatePlayers.push(id);
    try{ localStorage.setItem(ADMIN_GATE_KEY, JSON.stringify(adminGatePlayers)); }catch(e){}
  }
  async function persistVerified(){
    try{ localStorage.setItem(VERIFIED_KEY, JSON.stringify(verifiedPlayers)); }catch(e){}
  }

  function dutyForKey(key){
    const id = data.duty[key];
    if(!id) return null;
    return data.roster.find(p => p.id === id) || null;
  }

  function lastNameOf(name){
    const parts = name.trim().split(/\s+/);
    return parts[parts.length - 1];
  }

  function sortedRoster(){
    return [...data.roster].sort((a,b) => {
      const cmp = lastNameOf(a.name).localeCompare(lastNameOf(b.name));
      return cmp !== 0 ? cmp : a.name.localeCompare(b.name);
    });
  }

  // Once tee times are confirmed for a date, that locks in a hard capacity (4 players
  // per tee time). Anyone signed up beyond that, by signup order, is on standby — and
  // since it's purely positional, someone dropping out automatically bumps the next
  // standby player into a confirmed spot on the next render. No manual promotion needed.
  function capacityFor(key){
    const n = data.confirmedTeeTimes[key];
    if(typeof n === 'number' && n > 0) return n * PLAYERS_PER_TEE_TIME;
    // Nobody logged a confirmed count — once the booking day itself has come
    // and gone, assume the duty person got what was needed rather than
    // treating the date as still unresolved (in practice tee times always
    // come through; what's usually missing is just remembering to log it in
    // the app). Before the booking day arrives, capacity genuinely isn't
    // decided yet, so this still returns null then.
    const playDate = new Date(key + 'T00:00:00');
    const bookDate = new Date(playDate); bookDate.setDate(bookDate.getDate() - BOOKING_WINDOW_DAYS);
    const bookingDayArrived = daysBetween(new Date(), bookDate) <= 0;
    if(!bookingDayArrived) return null;
    const signedUpCount = (data.signups[key] || []).length;
    if(signedUpCount === 0) return null;
    return Math.min(MAX_TEE_TIMES, Math.ceil(signedUpCount / PLAYERS_PER_TEE_TIME)) * PLAYERS_PER_TEE_TIME;
  }
  function splitConfirmedStandby(entries, capacity){
    if(capacity == null) return { confirmed: entries, standby: [] };
    return { confirmed: entries.slice(0, capacity), standby: entries.slice(capacity) };
  }

  // First tee times change a few times a year and then hold steady — admin enters each
  // change as "effective from this date," and this looks up whichever change most
  // recently took effect on or before the given date, and holds it there indefinitely.
  function firstTeeTimeFor(dateKey){
    const keys = Object.keys(data.teeTimeSchedule).filter(k => k <= dateKey).sort();
    if(keys.length === 0) return null;
    return data.teeTimeSchedule[keys[keys.length-1]];
  }
  function parseTimeString(s){
    const m = String(s).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
    if(!m) return null;
    let hours = parseInt(m[1],10);
    const minutes = parseInt(m[2],10);
    const ampm = m[3].toUpperCase();
    if(ampm === 'PM' && hours !== 12) hours += 12;
    if(ampm === 'AM' && hours === 12) hours = 0;
    return hours*60 + minutes;
  }
  function formatMinutesAsTime(total){
    total = ((total % 1440) + 1440) % 1440;
    const hours = Math.floor(total/60);
    const minutes = total % 60;
    const ampm = hours >= 12 ? 'PM' : 'AM';
    let h12 = hours % 12; if(h12 === 0) h12 = 12;
    return `${h12}:${String(minutes).padStart(2,'0')} ${ampm}`;
  }
  function arrivalTimeFor(dateKey){
    const first = firstTeeTimeFor(dateKey);
    if(!first) return null;
    const mins = parseTimeString(first);
    if(mins === null) return null;
    return formatMinutesAsTime(mins - 120);
  }

  function findSignup(key, id){
    return (data.signups[key] || []).find(e => e.id === id) || null;
  }

  function esc(s){
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  // In-page dialog replacing window.prompt/alert. Browser popups like prompt() can be
  // silently blocked inside a sandboxed preview frame (a click does nothing, no error) —
  // this renders a normal on-screen box instead, so it works wherever the app is viewed.
  function askText(title, message){
    return new Promise(resolve => {
      const modalRoot = document.getElementById('ts-modal-root');
      modalRoot.innerHTML = `
        <div class="ts-modal-overlay" id="ts-modal-overlay">
          <div class="ts-modal-box">
            <h4>${esc(title)}</h4>
            <p>${esc(message)}</p>
            <input type="text" id="ts-modal-input" autofocus>
            <div class="ts-modal-actions">
              <button class="ts-modal-cancel" id="ts-modal-cancel">Cancel</button>
              <button class="ts-modal-ok" id="ts-modal-ok">OK</button>
            </div>
          </div>
        </div>`;
      const input = document.getElementById('ts-modal-input');
      input.focus();
      const cleanup = (val) => { modalRoot.innerHTML = ''; resolve(val); };
      document.getElementById('ts-modal-ok').onclick = () => cleanup(input.value);
      document.getElementById('ts-modal-cancel').onclick = () => cleanup(null);
      document.getElementById('ts-modal-overlay').addEventListener('click', (e) => {
        if(e.target.id === 'ts-modal-overlay') cleanup(null);
      });
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') cleanup(input.value);
        if(e.key === 'Escape') cleanup(null);
      });
    });
  }

  function showMessage(title, message){
    return new Promise(resolve => {
      const modalRoot = document.getElementById('ts-modal-root');
      modalRoot.innerHTML = `
        <div class="ts-modal-overlay" id="ts-modal-overlay">
          <div class="ts-modal-box">
            <h4>${esc(title)}</h4>
            <p>${esc(message)}</p>
            <div class="ts-modal-actions">
              <button class="ts-modal-ok" id="ts-modal-ok">OK</button>
            </div>
          </div>
        </div>`;
      const cleanup = () => { modalRoot.innerHTML = ''; resolve(); };
      document.getElementById('ts-modal-ok').onclick = cleanup;
      document.getElementById('ts-modal-overlay').addEventListener('click', (e) => {
        if(e.target.id === 'ts-modal-overlay') cleanup();
      });
    });
  }

  // --- admin gate: roster management, duty assignment, and importing are locked behind
  // admin access. A player flagged Admin on their roster record unlocks it with their
  // own PIN — the same one they sign in with — one device at a time, just like any
  // other player's PIN. Everyone else (including the league admin's own identity, which
  // isn't itself flagged) unlocks with the single shared master PIN — which is also the
  // ONLY way to become a super-admin, the one privilege needed to grant or revoke other
  // players' Admin flag in League Roster.
  async function requireAdmin(){
    if(isAdmin) return true;
    const me = meId ? data.roster.find(p => p.id === meId) : null;
    if(me && me.isAdmin){
      if(!data.playerPins[meId]){
        const ok = await forceSetPin(meId);
        if(!ok) return false;
      }
      const entered = await askText('Enter your PIN', 'Enter your PIN to access the admin portion of the app.');
      if(entered === null) return false;
      if(entered.trim() === data.playerPins[meId]){
        await persistAdminGate(meId);
        return true;
      }
      await showMessage('Incorrect PIN', 'That PIN doesn\'t match. Try again.');
      return false;
    }
    if(!data.adminPin){
      const setPin = await askText('Set an admin PIN', "You'll use this to edit the roster, booking duty, and imports from any device.");
      if(setPin === null) return false;
      const trimmed = setPin.trim();
      if(!trimmed){ await showMessage('PIN cannot be empty', 'Please enter at least one character.'); return false; }
      data.adminPin = trimmed;
      await saveData();
      await persistSuperAdmin(true);
      return true;
    }
    const entered = await askText('Admin PIN', 'Enter the admin PIN to edit this.');
    if(entered === null) return false;
    if(entered.trim() === data.adminPin){
      await persistSuperAdmin(true);
      return true;
    }
    await showMessage('Incorrect PIN', 'That PIN doesn\'t match. Try again.');
    return false;
  }

  // --- per-player gate: if a player has set a PIN, selecting their name requires it
  // (once per device). Setting a PIN is optional and left to each player.
  async function verifyPlayerSelection(id){
    if(!id) return true;
    if(isAdmin) return true;
    if(verifiedPlayers.includes(id)) return true;
    const pin = data.playerPins[id];
    if(!pin) return await forceSetPin(id);
    const entered = await askText('Enter your PIN', 'Enter your PIN to sign in as this player.');
    if(entered === null) return false;
    if(entered.trim() === pin){
      verifiedPlayers.push(id);
      await persistVerified();
      return true;
    }
    await showMessage('Incorrect PIN', 'That PIN doesn\'t match. Try again.');
    return false;
  }

  // First time anyone signs in as a given player, they must set a 4-digit PIN before
  // proceeding — this protects their signups from anyone else picking their name.
  // Also reused by reverifyIfNeeded() when an admin has reset a player's PIN, or the
  // backend one went missing some other way — promptText lets that case explain why.
  async function forceSetPin(id, promptText){
    while(true){
      const entered = await askText('Set a 4-digit PIN', promptText || "This is your first time signing in as this player. Choose a 4-digit PIN — you'll need it again on other devices.");
      if(entered === null) return false; // they backed out; stays unidentified, can retry anytime
      const trimmed = entered.trim();
      if(!/^\d{4}$/.test(trimmed)){
        await showMessage('Needs to be 4 digits', 'Enter exactly 4 numbers, like 1234.');
        continue;
      }
      data.playerPins[id] = trimmed;
      verifiedPlayers.push(id);
      await persistVerified();
      await saveData();
      return true;
    }
  }

  // Runs once on load, for whoever this device already remembers as meId: a device
  // that verified someone once stays trusted locally (verifiedPlayers) forever, even
  // if their PIN later goes missing from the backend — whether an admin explicitly
  // reset it (see the "Reset verification" button in League Roster) or a whole-data
  // save happened to revert it. Re-checking here, every load, means League Roster's
  // "PIN set" status and what a device actually requires can never drift apart again.
  async function reverifyIfNeeded(){
    if(!meId || isAdmin) return;
    const me = data.roster.find(p => p.id === meId);
    if(!me) return;
    if(data.playerPins[meId]) return; // backend has a real PIN on file — already in sync
    verifiedPlayers = verifiedPlayers.filter(vid => vid !== meId);
    await persistVerified();
    await forceSetPin(meId, "Your PIN needs to be set again — either it was reset, or this device's saved sign-in didn't match what's on file. Choose a new 4-digit PIN.");
  }

  // --- guest gate: anyone who isn't picking their own name off the roster has to enter
  // the shared guest PIN (set in League Roster) before they can browse — once per device,
  // same idea as verifiedPlayers/adminGatePlayers. Meant for guests Tom brings along, not
  // strangers who happen across the link.
  async function requireGuestPin(){
    if(isGuestVerified) return true;
    const entered = await askText('Guest PIN', "Enter the guest PIN to continue — ask an admin if you don't have it.");
    if(entered === null) return false;
    if(entered.trim() === (data.guestPin || '')){
      isGuestVerified = true;
      try{ localStorage.setItem(GUEST_UNLOCK_KEY, 'true'); }catch(e){}
      return true;
    }
    await showMessage('Incorrect PIN', 'That PIN doesn\'t match. Try again.');
    return false;
  }

  // Runs once on load (and whenever no one's identified yet): proactively asks who's
  // using the app, instead of waiting for someone to notice the "I'm —" dropdown. Keeps
  // re-asking until someone either signs in as a roster player, enters the guest PIN, or
  // enters the admin PIN — dismissing the prompt doesn't quietly let anyone browse.
  async function autoIdentifyIfNeeded(){
    if(meId || isAdmin || isGuestVerified || data.roster.length === 0) return;
    while(true){
      const options = sortedRoster().map(p => ({ value: p.id, label: p.name }));
      const chosenId = await askChoice('Who are you?', 'Select your name to sign up for dates and see your booking duty — or continue if you\'re a guest.', options, 'Continue', "I'm a guest");
      if(chosenId){
        const ok = await verifyPlayerSelection(chosenId);
        if(ok){ await persistMe(chosenId); return; }
        continue;
      }
      const isGuest = await askConfirm("Not on the roster?", "Enter the guest PIN to continue as a visitor — or, if you're the league admin, enter the admin PIN instead.", 'Guest PIN', 'Admin PIN');
      if(isGuest){
        if(await requireGuestPin()) return;
      } else {
        if(await requireAdmin()) return;
      }
    }
  }
