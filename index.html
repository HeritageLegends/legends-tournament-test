              ${data.teeOptions.map(tee => `<option value="${esc(tee)}">${esc(tee)}</option>`).join('')}
            </select>
            <span style="font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;">Course handicap: <span id="ts-hcp-calc-result-pub">—</span></span>
          </div>
        </div>
        <div class="ts-import-row">
          <span class="ts-import-row-label">Player handicaps</span>
          <p style="margin:0 0 4px;">Handicaps effective as of ${esc(effectiveDateLabel)}.</p>
          <p style="margin:0 0 10px;">You can update your default tee in the dropdown at the top of this page under your name.</p>
          <div style="overflow-x:auto;">
            ${tableHeaderHtml}
            ${playerRows || '<p class="ts-empty">No players yet.</p>'}
          </div>
        </div>
        <div class="ts-import-row">
          <span class="ts-import-row-label">Teams${nextDateLabel ? ` — ${esc(nextDateLabel)}` : ''}</span>
          ${nextKey ? `
            <p style="margin:0 0 10px;">Click here to generate suggested teams, or click on the table below (Swap players) to create your own teams.</p>
            <div style="margin-bottom:${teamsSwapHtml ? '14px' : '0'};">
              <button type="button" class="ts-accept-scores-btn" id="ts-generate-teams-btn">Generate teams now</button>
            </div>
            ${teamsSwapHtml}
          ` : `<p class="ts-empty">No upcoming play date yet.</p>`}
        </div>
        ${scorecardsBlockHtml}
      </div>`;
  }

  // Scoring & Bets: hole-by-hole score entry for a date's generated teams,
  // and the resulting series-by-series bet standings. Its own top-level tab
  // (not tucked under Admin) so anyone can check in on the match, but
  // entering or changing anything here still needs the admin PIN — any
  // admin, including the scorekeeper for a given group once they're set up
  // as an admin on the roster, can enter scores for any team.
  function renderScoringPanel(el){
    if(!isAdmin){
      el.innerHTML = `
        <div class="ts-roster-panel">
          <div class="ts-locked-panel">
            Entering scores needs the admin PIN.
            <br><button id="ts-unlock-scoring">Enter admin PIN</button>
          </div>
        </div>`;
      return;
    }

    const teamDates = Object.keys(data.teams).sort();
    if(teamDates.length === 0){
      el.innerHTML = `
        <div class="ts-roster-panel">
          <p class="ts-empty">No teams have been generated for any date yet — generate teams on the Handicaps tab first, then come back here to score that round.</p>
        </div>`;
      return;
    }
    if(!scoringSelectedDate || !teamDates.includes(scoringSelectedDate)){
      scoringSelectedDate = teamDates[teamDates.length - 1];
    }
    const dateKey = scoringSelectedDate;
    const teamsInfo = data.teams[dateKey];
    const d = new Date(dateKey + 'T00:00:00');
    const dateLabel = `${DOW_NAMES[d.getDay()]}, ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;

    const round = ensureRoundDefaults(dateKey);
    const groups = seriesHoleGroups(round.startHole);
    const flatHoles = groups.flat();
    const standings = computeSeriesStandings(dateKey);
    const lowBallProgress = computeLowBallProgress(dateKey);
    const lowBallHoleRunning = computeLowBallHoleRunning(dateKey);
    const gameLabel = round.game === '1ball' ? '1-ball' : '2-ball';
    const exact = holeHandicapsCompleteForTeams(teamsInfo);
    const seasonStandings = computeSeasonStandings();

    const dateOptionsHtml = teamDates.slice().reverse().map(k => {
      const kd = new Date(k + 'T00:00:00');
      return `<option value="${k}" ${k===dateKey?'selected':''}>${DOW_NAMES[kd.getDay()]}, ${MON_NAMES[kd.getMonth()]} ${kd.getDate()}</option>`;
    }).join('');

    // Teams list, right under Round setup — every generated team's players plus
    // anyone not playing, with handicap/strokes-off/tee for reference. The tee
    // dropdown is the one still-live control here; team membership itself only
    // changes in "Swap players between teams" below.
    const teamRosterRowHtml = (p, isNotPlaying) => {
      const hcNote = typeof p.courseHandicap === 'number' ? `HC ${p.courseHandicap}` : 'HC —';
      const soNote = typeof p.strokesOff === 'number' ? `, S.O. ${p.strokesOff}` : '';
      const reasonNote = isNotPlaying && p.reason ? ` <span class="ts-team-so">(${esc(p.reason)})</span>` : '';
      return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--ivory-line);">
          <div style="font-size:13px;"><b>${esc(p.name)}</b> <span class="ts-team-so">${hcNote}${soNote}</span>${reasonNote}</div>
          ${data.teeOptions.length ? `<select data-team-tee-player="${p.id}" data-team-tee-date="${dateKey}" title="Switch ${p.name.split(' ')[0]}'s tee for today only" style="font-family:'Inter'; font-size:12px; padding:3px 6px; border-radius:5px; border:1px solid var(--ivory-line); color:#6b6a5e;">
            ${data.teeOptions.map(tee => `<option value="${esc(tee)}" ${p.tee===tee?'selected':''}>${esc(tee)}</option>`).join('')}
          </select>` : ''}
        </div>`;
    };
    const teamsDisplayHtml = `
      <div class="ts-import-row">
        <span class="ts-import-row-label">Teams — ${esc(dateLabel)}</span>
        ${teamsInfo.teams.map((team, ti) => `
          <div class="ts-teams-block" style="margin-top:10px;">
            <div class="ts-team-num">Team ${ti+1}</div>
            ${team.length ? team.map(p => teamRosterRowHtml(p, false)).join('') : '<p class="ts-empty">No players.</p>'}
          </div>`).join('')}
        ${teamsInfo.notInBet.length ? `
          <div class="ts-teams-block" style="margin-top:10px;">
            <div class="ts-team-num" style="color:var(--rust);">Not playing</div>
            ${teamsInfo.notInBet.map(p => teamRosterRowHtml(p, true)).join('')}
          </div>` : ''}
      </div>`;

    // Swap players between teams — see swapPlayersTableHtml for what this does
    // and how it's wired; shared with the public Handicaps page.
    const swapRowHtml = swapPlayersTableHtml(dateKey, teamsInfo);

    // Printable scorecards — see scorecardsHtml; same one shared with the
    // public Handicaps page's Teams section.
    const scorecardsBlockHtml = scorecardsHtml(dateKey);

    const acceptTeamsHtml = `
      <div class="ts-accept-teams-wrap" style="padding:14px 0 4px; text-align:center;">
        <button type="button" class="ts-accept-scores-btn" id="ts-accept-teams-btn">Accept teams</button>
        <p style="margin:8px 0 0; font-size:12px; color:#6b6a5e;">${round.teamsAccepted
          ? '✓ Accepted — these are the names showing in Live Scoring.'
          : 'Not yet accepted — Live Scoring won’t show any names until this is clicked.'}</p>
      </div>`;

    // Match scoreboard is read-only — a summary to glance at, not where scores get
    // entered (that's Live scoring only, one hole at a time, so there's exactly one
    // place to type a number and no risk of two views fighting over the same cell).
    const teamCardsHtml = teamsInfo.teams.map((team, ti) => {
      const rowsHtml = team.map(p => {
        const playerScores = round.scores[p.id] || {};
        const playerConfirmed = (round.confirmed || {})[p.id] || {};
        const cellsHtml = flatHoles.map(h => {
          const v = playerScores[String(h)];
          const isDefault = typeof v === 'number' && !playerConfirmed[String(h)];
          const isUnsaved = unsavedScoreKeys.has(scoreErrKey(dateKey, p.id, h));
          const strokesHere = exact ? strokesReceivedOnHole(p.strokesOff, h, p.tee) : 0;
          const strokeTitle = strokesHere > 0 ? ` title="${p.name.split(' ')[0]} gets ${strokesHere} stroke${strokesHere===1?'':'s'} here"` : '';
          const cellTitle = isUnsaved ? ' title="Not saved yet — will retry automatically"' : (isDefault ? ' title="Showing par — not yet entered during the round"' : '');
          return `<td class="${strokesHere > 0 ? 'ts-score-stroke' : ''}"${strokeTitle}${cellTitle}><span class="ts-score-cell-wrap"><span class="ts-score-display${isDefault ? ' ts-score-input-default' : ''}${isUnsaved ? ' ts-score-unsaved' : ''}">${typeof v === 'number' ? v : '–'}</span>${strokesHere > 0 ? '<span class="ts-stroke-dot"></span>' : ''}${isUnsaved ? '<span class="ts-unsaved-dot" title="Not saved yet"></span>' : ''}</span></td>`;
        }).join('');
        // Just a label here, not a control — switching tees happens in Live scoring,
        // so there's one place to change it, same as scores.
        const teeLabelHtml = p.tee ? `<br><span class="ts-team-so">${esc(p.tee)}</span>` : '';
        return `<tr><td class="ts-score-name">${esc(p.name)}${p.strokesOff ? ` <span class="ts-team-so">(S.O. ${p.strokesOff})</span>` : ''}${teeLabelHtml}</td>${cellsHtml}</tr>`;
      }).join('');

      const runningForTeam = lowBallHoleRunning ? lowBallHoleRunning[ti] : null;
      const runningRowHtml = runningForTeam ? `
        <tr class="ts-lowball-row">
          <td class="ts-score-name">${gameLabel} vs par</td>
          ${flatHoles.map(h => `<td>${typeof runningForTeam[h] === 'number' ? fmtRelToPar(runningForTeam[h]) : ''}</td>`).join('')}
        </tr>` : '';

      return `
        <div class="ts-teams-block" style="margin-top:16px;">
          <div class="ts-team-num">Team ${ti+1}</div>
          <div style="overflow-x:auto;">
            <table class="ts-score-table">
              <thead>
                <tr><th></th><th colspan="${HOLES_PER_SERIES}">Series 1</th><th colspan="${HOLES_PER_SERIES}">Series 2</th><th colspan="${HOLES_PER_SERIES}">Series 3</th></tr>
                <tr><th>Hole number</th>${flatHoles.map(h => `<th>${h}</th>`).join('')}</tr>
                ${Object.keys(data.holePars).length ? `<tr class="ts-par-row"><th>Par</th>${flatHoles.map(h => `<th>${typeof data.holePars[String(h)] === 'number' ? data.holePars[String(h)] : ''}</th>`).join('')}</tr>` : ''}
              </thead>
              <tbody>${rowsHtml}${runningRowHtml}</tbody>
            </table>
          </div>
        </div>`;
    }).join('');

    // Hole-by-hole view: every player on a team for this date, one hole at a
    // time. Same data-score-* attributes as the scorecard grid, so scores
    // entered here save through the exact same saveScore() wiring — just a
    // different layout over the same data. The bet's live status further down
    // still reflects every team's scores as they come in.
    if(scoringHoleIndex >= flatHoles.length) scoringHoleIndex = flatHoles.length - 1;
    if(scoringHoleIndex < 0) scoringHoleIndex = 0;
    const hbhHole = flatHoles[scoringHoleIndex];
    const hbhSeriesIndex = groups.findIndex(g => g.includes(hbhHole));
    const hbhPar = typeof data.holePars[String(hbhHole)] === 'number' ? data.holePars[String(hbhHole)] : null;

    // Every player on a team for this date — there's no way to know scores for
    // anyone not on a team, so that's the only group Live Scoring ever shows.
    const allRoundPlayers = teamsInfo.teams.flat();

    // Default an unset score to par for this hole, so a group that made par can
    // just confirm and move on instead of typing every number — toggle it up or
    // down with the +/- buttons, or leave it alone to accept par. Never fires when
    // a score is already on file — real or a prior silent default — so it can't
    // clobber a genuine entry (including scores saved before "confirmed" tracking
    // existed at all). It also never re-fires once a hole has been touched in any
    // way (gated on round.confirmed), so deliberately clearing a score back out —
    // to test with, or because it was a mis-entry — doesn't get silently refilled
    // with par on the very next render. Only runs once teams are accepted — no
    // point silently writing par defaults for a lineup that isn't showing yet.
    if(hbhPar !== null && round.teamsAccepted){
      allRoundPlayers.forEach(p => {
        const existing = (round.scores[p.id] || {})[String(hbhHole)];
        const touched = round.confirmed[p.id] && (String(hbhHole) in round.confirmed[p.id]);
        if(typeof existing !== 'number' && !touched) saveScore(dateKey, p.id, hbhHole, hbhPar, {silent: true}).catch(()=>{});
      });
    }

    const hbhRowHtml = (p) => {
      const playerScores = round.scores[p.id] || {};
      const v = playerScores[String(hbhHole)];
      const isDefault = typeof v === 'number' && !((round.confirmed[p.id] || {})[String(hbhHole)]);
      const isUnsaved = unsavedScoreKeys.has(scoreErrKey(dateKey, p.id, hbhHole));
      // No par fallback here anymore — the silent auto-fill above already writes a
      // real (if unconfirmed) par value into round.scores for any hole that's never
      // been touched, so v is only ever missing when someone deliberately cleared
      // it. Showing it truly blank in that case (instead of quietly redrawing par)
      // is the whole point — an empty box means empty, not "still deciding."
      const displayVal = typeof v === 'number' ? v : '';
      const strokesHere = exact ? strokesReceivedOnHole(p.strokesOff, hbhHole, p.tee) : 0;
      const inputId = `ts-hbh-score-${p.id}`;
      // Hybrid tees (Red/Gold, Gold/White, White/Blue, Blue/Black) play a
      // different single tee hole by hole — informational only, so the
      // scorer knows which tee box to actually hit from on this hole.
      const hybridTeeHere = hybridTeeForHole(p.tee, hbhHole);
      const hybridNote = hybridTeeHere ? ` <span class="ts-team-so">[${esc(p.tee)}] ${esc(hybridTeeHere)} tees</span>` : '';
      return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--ivory-line);">
          <div>
            <div style="font-weight:600; font-size:15px;">${esc(p.name)}</div>
            <div style="font-size:11.5px; color:#8b8a7c; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span>${p.strokesOff ? `S.O. ${p.strokesOff}` : ''}${strokesHere > 0 ? ' · gets a stroke here' : ''}${isDefault ? ' · showing par, not yet entered' : ''}</span>${hybridNote}
              ${data.teeOptions.length ? `<select data-team-tee-player="${p.id}" data-team-tee-date="${dateKey}" title="Switch ${p.name.split(' ')[0]}'s tee for today only" style="font-family:'Inter',sans-serif; font-size:10.5px; padding:1px 3px; border-radius:4px; border:1px solid var(--ivory-line); color:#6b6a5e;">
                ${data.teeOptions.map(tee => `<option value="${esc(tee)}" ${p.tee===tee?'selected':''}>${esc(tee)}</option>`).join('')}
              </select>` : ''}
            </div>
            ${isUnsaved ? `<button type="button" class="ts-unsaved-retry" data-retry-unsaved="1" title="Tap to retry now">⚠ Not saved — tap to retry</button>` : ''}
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button type="button" class="ts-score-step" data-step-for="${inputId}" data-step-dir="-1" data-score-date="${dateKey}" data-score-player="${p.id}" data-score-hole="${hbhHole}">−</button>
            <span class="ts-score-cell-wrap">
              <input type="number" inputmode="numeric" min="1" max="15" step="1" id="${inputId}" class="ts-score-input ts-score-input-lg${strokesHere > 0 ? ' ts-score-stroke' : ''}${isDefault ? ' ts-score-input-default' : ''}${isUnsaved ? ' ts-score-unsaved' : ''}"
                data-score-date="${dateKey}" data-score-player="${p.id}" data-score-hole="${hbhHole}"
                value="${displayVal}" title="${isUnsaved ? 'Not saved yet — will retry automatically' : (isDefault ? 'Showing par — tap to enter the real score' : '')}">
              ${strokesHere > 0 ? '<span class="ts-stroke-dot ts-stroke-dot-lg"></span>' : ''}
            </span>
            <button type="button" class="ts-score-step" data-step-for="${inputId}" data-step-dir="1" data-score-date="${dateKey}" data-score-player="${p.id}" data-score-hole="${hbhHole}">+</button>
          </div>
        </div>`;
    };

    // Typing over the par default is one way to confirm a score, but a group that
    // actually made par never touches that field, so it'd sit there looking
    // "unconfirmed" forever. This button marks whatever's currently showing —
    // touched or still at par — as the real, confirmed score, without changing any
    // numbers, for everyone on a team this hole.
    const acceptScoresHtml = allRoundPlayers.length ? `
      <div style="padding:10px 0 4px; text-align:center;">
        <button type="button" class="ts-accept-scores-btn" data-accept-date="${dateKey}" data-accept-hole="${hbhHole}" data-accept-ids="${allRoundPlayers.map(p => p.id).join(',')}">Accept everyone's scores for hole ${hbhHole}</button>
      </div>` : '';

    const hbhRowsHtml = allRoundPlayers.map(hbhRowHtml).join('') + acceptScoresHtml;

    const holeJumpOptionsHtml = flatHoles.map((h, idx) => {
      const p = typeof data.holePars[String(h)] === 'number' ? data.holePars[String(h)] : null;
      return `<option value="${idx}" ${idx===scoringHoleIndex?'selected':''}>Hole ${h}${p !== null ? ` (par ${p})` : ''}</option>`;
    }).join('');

    // Nothing shows here until the admin has clicked Accept Teams on Set up &
    // Bets — see round.teamsAccepted — so Live Scoring never displays a lineup
    // that hasn't actually been reviewed yet.
    const holeByHoleHtml = !round.teamsAccepted ? `
      <div class="ts-teams-block" style="margin-top:16px;">
        <p class="ts-empty">Teams haven't been accepted for this round yet — go to Set up &amp; Bets, review the teams, and click Accept Teams.</p>
      </div>` : `
      <div class="ts-teams-block" style="margin-top:16px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="ts-hbh-prev-hole" ${scoringHoleIndex===0?'disabled':''} style="padding:8px 12px; flex-shrink:0;">‹</button>
          <select id="ts-hbh-hole-select" style="flex:1; font-family:'Inter'; font-size:13px; padding:8px 10px; border-radius:7px; border:1px solid var(--ivory-line);">
            ${holeJumpOptionsHtml}
          </select>
          <button id="ts-hbh-next-hole" ${scoringHoleIndex===flatHoles.length-1?'disabled':''} style="padding:8px 12px; flex-shrink:0;">›</button>
        </div>
        <div class="ts-team-num" style="margin-top:8px;">Hole ${hbhHole}${hbhPar !== null ? ` <span class="ts-team-so">(par ${hbhPar})</span>` : ''} <span class="ts-team-so">— Series ${hbhSeriesIndex+1}, ${scoringHoleIndex+1} of ${flatHoles.length}</span></div>
        ${hbhRowsHtml || '<p class="ts-empty">No players on a team for this date.</p>'}
      </div>`;

    const lowBallProgressHtml = lowBallProgress ? `
      <div class="ts-import-row">
        <span class="ts-import-row-label">Live vs. par (low ball)</span>
        <div class="ts-teams-block">
          ${teamsInfo.teams.map((team, ti) => `
            <div class="ts-team-row">
              <div class="ts-team-num">Team ${ti+1}</div>
              ${groups.map((holes, si) => {
                const prog = lowBallProgress[ti][si];
                const label = prog.holesCounted === 0
                  ? '<span class="ts-empty">not started</span>'
                  : `${fmtRelToPar(prog.relToPar)} <span class="ts-team-so">thru ${prog.holesCounted} of ${prog.holesInSeries}</span>`;
                return `<div class="ts-bet-row"><span class="ts-bet-label">Series ${si+1}</span><span class="ts-bet-result">${label}</span></div>`;
              }).join('')}
            </div>`).join('')}
        </div>
      </div>` : '';

    const standingsHtml = standings ? `
      <div class="ts-import-row">
        <span class="ts-import-row-label">Series results (${standings.game === '1ball' ? '1-ball' : '2-ball'})</span>
        ${groups.map((holes, si) => {
          const rowsHtml = standings.matchups.filter(m => m.seriesIndex === si).map(m => {
            let resultText;
            if(!m.result) resultText = `<span class="ts-empty">in progress</span>`;
            else if(m.result === 'push') resultText = `Push (${m.aNet}–${m.bNet})`;
            else if(m.result === 'A') resultText = `Team ${m.teamA+1} wins ${fmtMoney(standings.stake)} (${m.aNet}–${m.bNet})`;
            else resultText = `Team ${m.teamB+1} wins ${fmtMoney(standings.stake)} (${m.bNet}–${m.aNet})`;
            return `<div class="ts-bet-row"><span class="ts-bet-label">Team ${m.teamA+1} vs Team ${m.teamB+1}</span><span class="ts-bet-result">${resultText}</span></div>`;
          }).join('');
          return `<div style="margin-top:10px;"><b style="font-size:12.5px;">Series ${si+1}</b> <span class="ts-team-so">(holes ${holes.join(', ')})</span>${rowsHtml}</div>`;
        }).join('')}
        <div class="ts-teams-block">
          <div class="ts-team-num">Running total</div>
          ${standings.teamTotals.map((t, i) => `<div class="ts-bet-row"><span class="ts-bet-label">Team ${i+1}</span><span class="ts-bet-result" style="color:${t>0?'var(--fairway)':t<0?'var(--rust)':'inherit'};">${fmtMoney(t)}</span></div>`).join('')}
        </div>
      </div>` : '';

    // Season-wide rollup — not tied to the date picker above at all, since it's
    // every dated round added together. Still updates live off rounds in
    // progress, same as the per-date series results do.
    const seasonStandingsHtml = seasonStandings.length ? `
      <div class="ts-import-row" style="margin-top:0; padding-top:0; border-top:none;">
        <span class="ts-import-row-label">Season standings</span>
        <p style="margin:6px 0 10px;">Every dated round's $ results, added up per player — teams are redrawn each round, so this tracks people rather than teams. Rounds still in progress count too, using whatever's been decided so far.</p>
        <div class="ts-teams-block">
          ${seasonStandings.map(p => `<div class="ts-bet-row"><span class="ts-bet-label">${esc(p.name)} <span class="ts-team-so">(${p.roundsPlayed} round${p.roundsPlayed===1?'':'s'})</span></span><span class="ts-bet-result" style="color:${p.total>0?'var(--fairway)':p.total<0?'var(--rust)':'inherit'};">${fmtMoney(p.total)}</span></div>`).join('')}
        </div>
      </div>` : '<p class="ts-empty">No rounds with teams and a $ result yet.</p>';

    el.innerHTML = `
      <div class="ts-roster-panel">
        <h4 style="margin:0 0 4px;">Set up</h4>
        <div class="ts-import-row" style="margin-top:0; padding-top:0; border-top:none;">
          <span class="ts-import-row-label">Round</span>
          <div style="margin-top:6px;">
            <select id="ts-scoring-date-select" style="font-family:'Inter'; font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--ivory-line);">
              ${dateOptionsHtml}
            </select>
          </div>
        </div>

        <div class="ts-subtabbar" style="margin-top:22px; padding-top:22px; border-top:2px solid var(--ivory-line);">
          <button class="ts-subtab ${scoringViewMode==='setup'?'active':''}" data-scoring-view="setup">Set up &amp; Bets</button>
          <button class="ts-subtab ${scoringViewMode==='live'?'active':''}" data-scoring-view="live">Live Scoring</button>
          <button class="ts-subtab ${scoringViewMode==='season'?'active':''}" data-scoring-view="season">Season standings</button>
        </div>

        ${scoringViewMode === 'setup' ? `
          <h4 style="margin:16px 0 4px;">Set up &amp; Bets</h4>
          <div class="ts-import-row" style="margin-top:0; padding-top:0; border-top:none;">
            <span class="ts-import-row-label">Round setup — ${esc(dateLabel)}</span>
            <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-top:6px;">
              <label style="font-size:12px; color:#6b6a5e; font-weight:500;">Starting hole
                <select id="ts-round-start-hole" style="margin-left:6px; font-family:'Inter'; font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--ivory-line);">
                  <option value="1" ${round.startHole===1?'selected':''}>1 (front)</option>
                  <option value="10" ${round.startHole===10?'selected':''}>10 (back)</option>
                </select>
              </label>
              <label style="font-size:12px; color:#6b6a5e; font-weight:500;">Stake per series

  // Booking Duty panel: one row per Mon/Wed/Fri date, letting the admin pick who's
  // heading to the club THAT day to request tee times for the round two weeks later.
  // --- Duty swaps: a lightweight request-and-agree flow. One player proposes trading
  // their booking-duty date for someone else's; nothing changes until that other player
  // accepts. Either side can back out first (cancel or decline).
  function myPendingOutgoing(){
    return Object.values(data.swapRequests).find(s => s.status === 'pending' && s.requesterId === meId);
  }
  function pendingIncomingFor(personId){
    return Object.values(data.swapRequests).filter(s => s.status === 'pending' && s.targetId === personId);
  }
  function pendingOutgoingFrom(key){
    return Object.values(data.swapRequests).find(s => s.status === 'pending' && s.fromKey === key);
  }

  async function requestSwap(fromKey, schedule){
    if(!meId) return;
    if(data.closures[fromKey]){
      await showMessage("This date is closed", "The course is closed for this date, so there's no need to request tee times — nothing to swap.");
      return;
    }
    if(myPendingOutgoing()){
      await showMessage("You've already got a request out", 'Cancel your pending swap request before starting a new one.');
      return;
    }
    const options = [];
    schedule.forEach(d => {
      const target = new Date(d); target.setDate(target.getDate() + BOOKING_WINDOW_DAYS);
      const targetKey = fmtDateKey(target);
      if(targetKey === fromKey) return;
      if(data.closures[targetKey]) return;
      const assigned = dutyForKey(targetKey);
      if(!assigned || assigned.id === meId) return;
      const label = `${DOW_NAMES[target.getDay()]}, ${MON_NAMES[target.getMonth()]} ${target.getDate()} — ${assigned.name}`;
      options.push({ value: targetKey, label });
    });
    if(options.length === 0){
      await showMessage('No dates to swap with', "There's no one else with an upcoming booking-duty date right now.");
      return;
    }
    const toKey = await askChoice('Request a duty swap', 'Trade your date for whose?', options, 'Send request');
    if(!toKey) return;
    const targetPerson = dutyForKey(toKey);
    if(!targetPerson) return;
    const id = 'swap_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    data.swapRequests[id] = { id, fromKey, toKey, requesterId: meId, targetId: targetPerson.id, status: 'pending' };
    logActivity('swap_requested', { fromKey, toKey, otherName: targetPerson.name });
    await saveData();
    await showMessage('Request sent', `Asked ${targetPerson.name} to swap. You'll see it here once they respond.`);
  }

  async function cancelSwap(id){
    delete data.swapRequests[id];
    await saveData();
  }

  async function respondToSwap(id, accept){
    const req = data.swapRequests[id];
    if(!req) return;
    const stillValid = data.duty[req.fromKey] === req.requesterId && data.duty[req.toKey] === req.targetId;
    if(!stillValid){
      delete data.swapRequests[id];
      await saveData();
      await showMessage('No longer valid', "One of these dates has changed since the request was made, so this swap can't go through.");
      return;
    }
    if(accept){
      data.duty[req.fromKey] = req.targetId;
      data.duty[req.toKey] = req.requesterId;
    }
    const requester = data.roster.find(p => p.id === req.requesterId);
    logActivity(accept ? 'swap_accepted' : 'swap_declined', { fromKey: req.fromKey, toKey: req.toKey, otherName: requester ? requester.name : 'someone' });
    delete data.swapRequests[id];
    await saveData();
    await showMessage(accept ? 'Swap complete' : 'Declined', accept ? 'The two dates have been swapped.' : "You've declined the swap.");
  }

  function renderDutyPanel(el, schedule){
    const today = new Date(); today.setHours(0,0,0,0);
    let rows = schedule.map(d => {
      const target = new Date(d); target.setDate(target.getDate() + BOOKING_WINDOW_DAYS);
      const targetKey = fmtDateKey(target);
      const assigned = dutyForKey(targetKey);
      const targetCount = (data.signups[targetKey] || []).length;
      const targetTT = targetCount > 0 ? Math.min(MAX_TEE_TIMES, Math.ceil(targetCount/PLAYERS_PER_TEE_TIME)) : 0;
      const closed = !!data.closures[targetKey];
      return { bookDate: d, bookKey: fmtDateKey(d), playDate: target, playKey: targetKey, assigned, tt: targetTT, closed };
    });

    const effectiveFilterId = dutyFilterId === '__me__' ? meId : dutyFilterId;
    if(dutySort !== 'calendar'){
      if(dutyFilterId === '__unassigned__'){
        rows = rows.filter(r => !r.assigned);
      } else if(effectiveFilterId){
        rows = rows.filter(r => r.assigned && r.assigned.id === effectiveFilterId);
      }
    }

    if(dutySort === 'person'){
      rows = [...rows].sort((a,b) => {
        const na = a.assigned ? lastNameOf(a.assigned.name) : 'zzzzzz';
        const nb = b.assigned ? lastNameOf(b.assigned.name) : 'zzzzzz';
        const cmp = na.localeCompare(nb);
        return cmp !== 0 ? cmp : a.bookDate - b.bookDate;
      });
    }

    const rowsHtml = dutySort === 'calendar' ? '' : (rows.length ? rows.map(r => {
      const playLabel = `${DOW_NAMES[r.playDate.getDay()]}, ${MON_NAMES[r.playDate.getMonth()]} ${r.playDate.getDate()}`;
      const assignedControl = isAdmin
        ? `<select data-panel-duty-key="${r.playKey}">
             <option value="">Unassigned</option>
             ${sortedRoster().map(p => `<option value="${p.id}" ${r.assigned && r.assigned.id===p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
           </select>`
        : `<span class="ts-duty-static">${r.assigned ? esc(r.assigned.name) : 'Unassigned'}</span>`;

      let swapControl = '';
      if(!r.closed && meId && r.assigned && r.assigned.id === meId){
        const outgoing = pendingOutgoingFrom(r.playKey);
        swapControl = outgoing
          ? `<span class="ts-swap-pending">Swap requested <button data-cancel-swap="${outgoing.id}">Cancel</button></span>`
          : `<button class="ts-swap-btn" data-request-swap="${r.playKey}">🔁 Request swap</button>`;
      }

      const todayKey = fmtDateKey(new Date());
      const dayRef = r.bookKey === todayKey
        ? 'today'
        : `on ${DOW_NAMES[r.bookDate.getDay()]}, ${MON_NAMES[r.bookDate.getMonth()]} ${r.bookDate.getDate()}`;
      const arrival = arrivalTimeFor(r.bookKey);
      const arrivalPhrase = arrival ? `at ${arrival}` : '(time varies by season)';

      const subText = r.closed
        ? `<span style="color:var(--rust); font-weight:600;">🚫 Course closed two weeks from today — no need to get tee times</span>`
        : `Head to the pro shop ${dayRef} ${arrivalPhrase} and request ${r.tt} tee time${r.tt===1?'':'s'} for ${playLabel}.`;

      // Same rule as the date card: can't confirm real tee times before the actual
      // booking day (r.bookDate) has arrived — you can only go to the pro shop in
      // the present, not the future. Admins can still fix/clear a value any time.
      const bookingDayArrived = daysBetween(today, r.bookDate) <= 0;
      const canConfirm = !r.closed && (isAdmin || (meId && bookingDayArrived && r.assigned && r.assigned.id === meId));
      const confirmed = data.confirmedTeeTimes[r.playKey];
      let confirmControl = '';
      if(canConfirm){
        confirmControl = `<div class="ts-duty-row-sub ts-confirm-row">
            <label>To be confirmed on ${MON_NAMES[r.bookDate.getMonth()]} ${r.bookDate.getDate()}:</label>
            <select data-confirm-key="${r.playKey}" style="width:52px; font-family:'Inter'; font-size:13px; padding:5px 4px; border-radius:6px; border:1px solid var(--ivory-line);">
              <option value="" ${!confirmed?'selected':''}>–</option>
              ${[1,2,3].map(n => `<option value="${n}" ${confirmed===n?'selected':''}>${n}</option>`).join('')}
            </select>
            <span>tee time${confirmed===1?'':'s'} booked for ${playLabel}</span>
          </div>`;
      } else if(typeof confirmed === 'number' && confirmed > 0){
        confirmControl = `<div class="ts-duty-row-sub">✅ ${confirmed} tee time${confirmed===1?'':'s'} booked ${dayRef} for ${playLabel}</div>`;
      }

      return `
        <div class="ts-duty-row">
          <div class="ts-date-block">
            <div class="ts-date-dow">${DOW_NAMES[r.bookDate.getDay()]}</div>
            <div class="ts-date-num">${r.bookDate.getDate()}</div>
            <div class="ts-date-mon">${MON_NAMES[r.bookDate.getMonth()]}</div>
          </div>
          <div class="ts-duty-row-mid">
            ${assignedControl}
            <div class="ts-duty-row-sub">${subText}</div>
            ${confirmControl}
            ${swapControl ? `<div class="ts-duty-row-sub">${swapControl}</div>` : ''}
          </div>
        </div>`;
    }).join('') : `<p class="ts-empty">No dates match this filter.</p>`);

    let calendarHtml = '';
    if(dutySort === 'calendar'){
      const headerHtml = `
        <div class="ts-cal-header">Monday</div>
        <div class="ts-cal-header">Wednesday</div>
        <div class="ts-cal-header">Friday</div>`;
      const firstDow = rows.length ? rows[0].bookDate.getDay() : 1;
      const padCount = firstDow === 3 ? 1 : firstDow === 5 ? 2 : 0;
      const padHtml = `<div class="ts-cal-cell ts-cal-blank"></div>`.repeat(padCount);
      const cellsHtml = rows.map(r => {
        const dateLabel = `${String(r.bookDate.getMonth()+1).padStart(2,'0')}/${String(r.bookDate.getDate()).padStart(2,'0')}/${String(r.bookDate.getFullYear()).slice(2)}`;
        const nameText = r.assigned ? esc(r.assigned.name) : (r.closed ? '' : 'Unassigned');
        return `<div class="ts-cal-cell"><div class="ts-duty-cal-entry ${r.closed?'closed':''}"><span class="ts-duty-cal-date">${dateLabel}</span> <span class="ts-duty-cal-name">${nameText}</span></div></div>`;
      }).join('');
      calendarHtml = `<div class="ts-cal-grid">${headerHtml}${padHtml}${cellsHtml}</div>
        <p class="ts-note" style="border-top:none; padding-top:0;">Strikethrough = course closed that round; no tee times required.</p>`;
    }

    const incoming = meId ? pendingIncomingFor(meId) : [];
    const incomingHtml = incoming.map(req => {
      const requester = data.roster.find(p => p.id === req.requesterId);
      const fromDate = new Date(req.fromKey + 'T00:00:00');
      const toDate = new Date(req.toKey + 'T00:00:00');
      const fromLabel = `${MON_NAMES[fromDate.getMonth()]} ${fromDate.getDate()}`;
      const toLabel = `${MON_NAMES[toDate.getMonth()]} ${toDate.getDate()}`;
      return `<div class="ts-booking-alert"><span class="flag">🔁</span><div>
                <b>${esc(requester ? requester.name : 'Someone')}</b> wants to trade their <b>${fromLabel}</b> duty for your <b>${toLabel}</b> duty.
                <div style="margin-top:6px;">
                  <button class="ts-modal-ok" style="padding:5px 12px; font-size:12px;" data-accept-swap="${req.id}">Accept</button>
                  <button class="ts-modal-cancel" style="padding:5px 12px; font-size:12px;" data-decline-swap="${req.id}">Decline</button>
                </div>
              </div></div>`;
    }).join('');

    el.innerHTML = `
      <div class="ts-roster-panel">
        <div class="ts-section-title-row" style="margin:0 0 8px;">
          <h4 style="margin:0;">Booking duty — who's heading to the club</h4>
          <button class="ts-print-btn" id="ts-print-duty">🖨️ Print</button>
        </div>
        <p class="ts-note" style="border-top:none; padding-top:0; margin-top:0;">
          ${isAdmin ? 'Pick who\'s going to the pro shop on each date below.' : 'Who\'s going to the pro shop on each date, and how many tee times to request.'}
          They'll be requesting tee times for the round two weeks after that date.
        </p>
        ${incomingHtml}
        <div class="ts-duty-controls">
          <div class="ts-duty-sort">
            <button class="ts-duty-sort-btn ${dutySort==='date'?'active':''}" data-duty-sort="date">List by date</button>
            <button class="ts-duty-sort-btn ${dutySort==='person'?'active':''}" data-duty-sort="person">List by person</button>
            <button class="ts-duty-sort-btn ${dutySort==='calendar'?'active':''}" data-duty-sort="calendar">Calendar view</button>
          </div>
        </div>
        ${dutySort === 'calendar' ? '' : `
        <div class="ts-duty-controls" style="margin-top:8px;">
          <select id="ts-duty-filter">
            <option value="">All players</option>
            ${meId ? `<option value="__me__" ${dutyFilterId==='__me__'?'selected':''}>Just my dates</option>` : ''}
            <option value="__unassigned__" ${dutyFilterId==='__unassigned__'?'selected':''}>Unassigned</option>
            ${sortedRoster().map(p => `<option value="${p.id}" ${dutyFilterId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>`}
        <div class="ts-duty-panel">
          ${dutySort === 'calendar' ? calendarHtml : rowsHtml}
        </div>
      </div>`;
  }

  function wireRosterPanel(){
    const unlockBtn = document.getElementById('ts-unlock-roster');
    if(unlockBtn){
      unlockBtn.onclick = async () => {
        const ok = await requireAdmin();
        if(ok){ render(); }
      };
    }

    // Finds where a player currently sits — on one of today's teams, or on the
    // "Not in the bet" bench — so the reassignment handler below can move them
    // out of wherever they currently are.
    function findTeamsInfoSlot(teamsInfo, id){
      for(let ti = 0; ti < teamsInfo.teams.length; ti++){
        const idx = teamsInfo.teams[ti].findIndex(p => p.id === id);
        if(idx !== -1) return { list: teamsInfo.teams[ti], index: idx, kind: 'team', teamIndex: ti };
      }
      const ni = teamsInfo.notInBet.findIndex(p => p.id === id);
      if(ni !== -1) return { list: teamsInfo.notInBet, index: ni, kind: 'notInBet' };
      return null;
    }

    // Swap players between teams — each row's checkboxes (Team 1, Team 2, Not in
    // bet) are mutually exclusive by construction (a fresh render only ever
    // checks the one box matching a player's current spot), so a "checked" event
    // always means "move this player here" — target -1 means Not in bet, target
    // 0+ means that team index. An "unchecked" event means their only checked
    // box was just unchecked (there's nowhere else it could have come from);
    // treated the same as checking Not in bet, so the player always lands
    // somewhere rather than in limbo. Recomputes handicap/strokes fresh for
    // whichever side of the move is a team, same as the old two-player swap did.
    // This table can render on the admin Scoring & Bets tab or the public
    // Handicaps page (see swapPlayersTableHtml) — data-assign-date says which
    // date's teams a given checkbox belongs to either way, and a non-admin
    // clicking one from the public page is asked for the admin PIN first.
    document.querySelectorAll('[data-assign-player]').forEach(cb => {
      cb.addEventListener('change', async () => {
        // Same pattern as the other admin actions reachable from a public page
        // (see e.g. the Add player / Export buttons above): authenticate and
        // re-render, but don't also apply the check on this same pass — the box
        // just goes back to its actual state, and checking it again (now
        // unlocked) is what applies the move.
        if(!isAdmin){ const ok = await requireAdmin(); if(ok) render(); return; }
        const dateKeyAttr = cb.getAttribute('data-assign-date');
        const pid = cb.getAttribute('data-assign-player');
        const targetTeam = parseInt(cb.getAttribute('data-assign-team'), 10);
        const teamsInfo = data.teams[dateKeyAttr];
        if(!teamsInfo){ render(); return; }
        const slot = findTeamsInfoSlot(teamsInfo, pid);
        if(!slot){ render(); return; }
        const player = slot.list[slot.index];
        slot.list.splice(slot.index, 1);
        if(cb.checked && targetTeam >= 0){
          teamsInfo.teams[targetTeam].push(recomputedForTeamSlot(dateKeyAttr, player));
        } else {
          teamsInfo.notInBet.push(Object.assign({}, player, { reason: player.reason || 'Not selected for a team' }));
        }
        // Any reassignment un-confirms previously accepted teams — Live Scoring
        // needs a fresh Accept Teams before it'll show the new lineup.
        ensureRoundDefaults(dateKeyAttr).teamsAccepted = false;
        await saveData();
        render();
      });
    });

        if(isAdmin){
          // Locking really locks: drop super-admin if that's how this device got in, and
          // drop this identity's admin-portion gate too, so it's asked for again next time.
          if(isSuperAdmin) await persistSuperAdmin(false);
          isAdmin = false;
          if(meId && adminGatePlayers.includes(meId)){
            adminGatePlayers = adminGatePlayers.filter(id => id !== meId);
            try{ localStorage.setItem(ADMIN_GATE_KEY, JSON.stringify(adminGatePlayers)); }catch(e){}
          }
          render();
          return;
        }
        const ok = await requireAdmin();
        render();
      };
    }

    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        activeSection = tab;
        render();
      });
    });

    document.querySelectorAll('[data-subtab]').forEach(btn => {
      btn.addEventListener('click', () => {
        adminSubTab = btn.getAttribute('data-subtab');
        render();
      });
    });

    document.querySelectorAll('[data-scoring-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        scoringViewMode = btn.getAttribute('data-scoring-view');
        render();
      });
    });

    document.querySelectorAll('[data-duty-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        dutySort = btn.getAttribute('data-duty-sort');
        render();
      });
    });

    document.querySelectorAll('[data-schedule-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        scheduleSort = btn.getAttribute('data-schedule-sort');
        render();
      });
    });

    const hbhPrevBtn = document.getElementById('ts-hbh-prev-hole');
    if(hbhPrevBtn){
      hbhPrevBtn.addEventListener('click', () => {
        scoringHoleIndex = Math.max(0, scoringHoleIndex - 1);
        render();
      });
    }
    const hbhNextBtn = document.getElementById('ts-hbh-next-hole');
    if(hbhNextBtn){
      hbhNextBtn.addEventListener('click', () => {
        scoringHoleIndex = scoringHoleIndex + 1;
        render();
      });
    }
    const hbhHoleSelect = document.getElementById('ts-hbh-hole-select');
    if(hbhHoleSelect){
      hbhHoleSelect.addEventListener('change', () => {
        scoringHoleIndex = parseInt(hbhHoleSelect.value, 10) || 0;
        render();
      });
    }
    document.querySelectorAll('.ts-score-step').forEach(btn => {
      btn.addEventListener('click', async () => {
        const input = document.getElementById(btn.getAttribute('data-step-for'));
        if(!input) return;
        const dir = parseInt(btn.getAttribute('data-step-dir'), 10) || 0;
        const current = parseInt(input.value, 10);
        let next = (isNaN(current) ? 0 : current) + dir;
        if(next < 1) next = 1;
        if(next > 15) next = 15;
        const dateKeyAttr = btn.getAttribute('data-score-date');
        const playerId = btn.getAttribute('data-score-player');
        const holeNum = btn.getAttribute('data-score-hole');
        await saveScore(dateKeyAttr, playerId, holeNum, next);
        render();
      });
    });

    document.querySelectorAll('.ts-accept-scores-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const dateKeyAttr = btn.getAttribute('data-accept-date');
        const holeNum = btn.getAttribute('data-accept-hole');
        const ids = btn.getAttribute('data-accept-ids').split(',').filter(Boolean);
        const holeKey = String(holeNum);
        const roundForAccept = ensureRoundDefaults(dateKeyAttr);
        // Re-save each player's current value as a confirmed entry — this never
        // changes what's on screen, it just stops treating it as a still-pending
        // par default. Anyone with no score at all for this hole is skipped; there's
        // nothing to confirm.
        for(const id of ids){
          const val = (roundForAccept.scores[id] || {})[holeKey];
          if(typeof val === 'number') await saveScore(dateKeyAttr, id, holeNum, val);
        }
        render();
      });
    });

    document.querySelectorAll('[data-retry-unsaved]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await retryUnsavedScores();
        render();
      });
    });

    const dutyFilterSel = document.getElementById('ts-duty-filter');
    if(dutyFilterSel){
      dutyFilterSel.onchange = () => { dutyFilterId = dutyFilterSel.value; render(); };
    }

    const scheduleFilterSel = document.getElementById('ts-schedule-filter');
    if(scheduleFilterSel){
      scheduleFilterSel.onchange = () => { scheduleFilterId = scheduleFilterSel.value; render(); };
    }

    const expandAllBtn = document.getElementById('ts-expand-all');
    if(expandAllBtn){
      expandAllBtn.onclick = () => {
        const effectiveFilterId = (scheduleSort === 'calendar') ? null : (scheduleFilterId === '__me__' ? meId : scheduleFilterId);
        const visible = effectiveFilterId
          ? buildSchedule().filter(d => (data.signups[fmtDateKey(d)] || []).some(e => e.id === effectiveFilterId))
          : buildSchedule();
        visible.forEach(d => { expanded[fmtDateKey(d)] = true; });
        expandCollapseState = 'expand';
        render();
      };
    }

    const collapseAllBtn = document.getElementById('ts-collapse-all');
    if(collapseAllBtn){
      collapseAllBtn.onclick = () => {
        expanded = {};
        expandCollapseState = 'collapse';
        render();
      };
    }

    document.querySelectorAll('[data-panel-duty-key]').forEach(sel => {
      sel.addEventListener('change', async (e) => {
        if(!isAdmin) return;
        const key = sel.getAttribute('data-panel-duty-key');
        const val = sel.value;
        if(val){ data.duty[key] = val; } else { delete data.duty[key]; }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-confirm-key]').forEach(inp => {
      inp.addEventListener('change', async () => {
        const key = inp.getAttribute('data-confirm-key');
        const assigned = dutyForKey(key);
        const allowed = isAdmin || (meId && assigned && assigned.id === meId);
        if(!allowed) return;
        const n = parseInt(inp.value, 10);
        const signedUpEntries = data.signups[key] || [];
        const beforeConfirmedIds = splitConfirmedStandby(signedUpEntries, capacityFor(key)).confirmed.map(x => x.id);
        if(n > 0){ data.confirmedTeeTimes[key] = n; } else { delete data.confirmedTeeTimes[key]; }
        const newCapacity = capacityFor(key);
        const { confirmed: afterConfirmed, standby: afterStandby } = splitConfirmedStandby(signedUpEntries, newCapacity);
        const newlyPromoted = afterConfirmed.map(x => x.id).filter(id => !beforeConfirmedIds.includes(id));
        if(newlyPromoted.length) notifyPromoted(key, newlyPromoted);
        // Fewer tee times came back than are needed for everyone signed up — alert
        // the admin so the group can decide who sits out; the app isn't deciding.
        if(newCapacity != null && afterStandby.length > 0){
          notifyShortfall(key, signedUpEntries.length, n, newCapacity, afterStandby.map(x => x.id));
        }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-request-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const key = btn.getAttribute('data-request-swap');
        await requestSwap(key, lastSchedule);
        render();
      });
    });

    document.querySelectorAll('[data-cancel-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await cancelSwap(btn.getAttribute('data-cancel-swap'));
        render();
      });
    });

    document.querySelectorAll('[data-accept-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await respondToSwap(btn.getAttribute('data-accept-swap'), true);
        render();
      });
    });

    document.querySelectorAll('[data-decline-swap]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await respondToSwap(btn.getAttribute('data-decline-swap'), false);
        render();
      });
    });

    document.querySelectorAll('[data-expand]').forEach(row => {
      row.addEventListener('click', (e) => {
        if(e.target.closest('[data-signup-select]') || e.target.closest('[data-holes-set]') || e.target.closest('[data-tee-set]') || e.target.closest('[data-admin-remove]') || e.target.closest('[data-admin-add-key]') || e.target.closest('[data-admin-add-guest-key]') || e.target.closest('[data-confirm-key]')) return;
        const key = row.getAttribute('data-expand');
        expanded[key] = !expanded[key];
        render();
      });
    });

    document.querySelectorAll('[data-signup-select]').forEach(sel => {
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        e.stopPropagation();
        if(!meId) return;
        const key = sel.getAttribute('data-signup-select');
        if(data.closures[key]) return;
        const list = data.signups[key] || (data.signups[key] = []);
        const idx = list.findIndex(x => x.id === meId);
        const capacity = capacityFor(key);
        const wantIn = sel.value === 'in';
        if(wantIn && idx === -1){
          const me = data.roster.find(p => p.id === meId);
          const entry = { id: meId, holes: '18' };
          if(me && me.defaultTee) entry.tee = me.defaultTee;
          list.push(entry);
          logActivity('signup', { dateKey: key });
        } else if(!wantIn && idx !== -1){
          const beforeConfirmedIds = splitConfirmedStandby(list, capacity).confirmed.map(x => x.id);
          const droppedPlayer = data.roster.find(p => p.id === meId);
          const wasConfirmed = beforeConfirmedIds.includes(meId);
          list.splice(idx,1);
          logActivity('dropout', { dateKey: key });
          const afterConfirmedIds = splitConfirmedStandby(list, capacity).confirmed.map(x => x.id);
          const newlyPromoted = afterConfirmedIds.filter(id => !beforeConfirmedIds.includes(id));
          if(newlyPromoted.length) notifyPromoted(key, newlyPromoted);
          // A drop-out on the day of play itself is the one that actually
          // strands a foursome — tee times are already booked, so unlike an
          // advance drop-out (which just quietly opens the spot to standby),
          // this goes out to the whole group right away instead of waiting
          // for tomorrow's admin-only activity digest.
          if(wasConfirmed && key === fmtDateKey(new Date()) && droppedPlayer) notifyDayOfDropout(key, droppedPlayer.name);
        } else {
          return;
        }
        // Render immediately so the change is visible right away, instead of waiting
        // on the full save round-trip (a staleness check plus the write, with retries)
        // before the UI updates — that wait was what made "I'm in" feel slow.
        render();
        await saveData();
      });
    });

    document.querySelectorAll('[data-holes-set]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!meId) return;
        const [key, holes] = btn.getAttribute('data-holes-set').split('|');
        const entry = findSignup(key, meId);
        if(!entry) return;
        entry.holes = holes;
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-tee-set]').forEach(sel => {
      sel.addEventListener('click', e => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        e.stopPropagation();
        if(!meId) return;
        const key = sel.getAttribute('data-tee-set');
        const entry = findSignup(key, meId);
        if(!entry) return;
        entry.tee = sel.value;
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-remove]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const [key, pid] = btn.getAttribute('data-admin-remove').split('|');
        const capacity = capacityFor(key);
        const beforeConfirmedIds = splitConfirmedStandby(data.signups[key] || [], capacity).confirmed.map(x => x.id);
        const removedPlayer = data.roster.find(p => p.id === pid);
        const wasConfirmed = beforeConfirmedIds.includes(pid);
        data.signups[key] = (data.signups[key] || []).filter(x => x.id !== pid);
        const afterConfirmedIds = splitConfirmedStandby(data.signups[key], capacity).confirmed.map(x => x.id);
        const newlyPromoted = afterConfirmedIds.filter(id => !beforeConfirmedIds.includes(id));
        if(newlyPromoted.length) notifyPromoted(key, newlyPromoted);
        // Same day-of-play group alert as the self-service drop-out above —
        // this admin-driven removal is the same "someone's out and the group
        // needs to know now" situation (e.g. a player calls in to the admin
        // instead of using the site themselves).
        if(wasConfirmed && key === fmtDateKey(new Date()) && removedPlayer) notifyDayOfDropout(key, removedPlayer.name);
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-add-key]').forEach(sel => {
      sel.addEventListener('click', (e) => e.stopPropagation());
      sel.addEventListener('change', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = sel.getAttribute('data-admin-add-key');
        if(data.closures[key]) return;
        const pid = sel.value;
        if(!pid) return;
        const list = data.signups[key] || (data.signups[key] = []);
        if(!list.some(x => x.id === pid)){
          list.push({ id: pid, holes: '18' });
        }
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-admin-add-guest-key]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = btn.getAttribute('data-admin-add-guest-key');
        if(data.closures[key]) return;
        const name = await askText('Add a guest', "Enter the guest's name, or leave it blank to fill in later. They'll be added to this date only — not to your permanent roster.");
        if(name === null) return;
        const trimmed = name.trim();
        const finalName = trimmed || (() => {
          const existingGuestCount = data.roster.filter(p => p.isGuest && /^Guest( \d+)?$/.test(p.name)).length;
          return existingGuestCount === 0 ? 'Guest' : `Guest ${existingGuestCount + 1}`;
        })();
        const id = 'guest_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        data.roster.push({ id, name: finalName, isGuest: true });
        const list = data.signups[key] || (data.signups[key] = []);
        list.push({ id, holes: '18' });
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-close-key]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = btn.getAttribute('data-close-key');
        const reason = await askText('Mark course closed', "What's the event or reason? (optional — leave blank if you just want to mark it closed)");
        if(reason === null) return;
        data.closures[key] = reason.trim();
        await saveData();
        render();
      });
    });

    document.querySelectorAll('[data-reopen-key]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!isAdmin) return;
        const key = btn.getAttribute('data-reopen-key');
        delete data.closures[key];
        await saveData();
        render();
      });
    });
  }

  (async function init(){
    await loadData();
    if(bootError){
      // Couldn't reach the backend at all on this, the very first load — show a
      // clear retry screen instead of either hanging on "setting the tee sheet…"
      // forever, or (worse) silently rendering the empty-roster "Set up your
      // roster" screen, which would look like the whole roster had vanished.
      root.innerHTML = `
        ${testBannerHtml()}
        <div class="ts-loading">
          Couldn't load the tee sheet — check your connection.
          <br><button id="ts-retry-load" style="margin-top:14px; font-family:'Inter'; font-size:13.5px; padding:8px 16px; border-radius:7px; border:1px solid var(--ivory-line); background:#fff; color:var(--rust); cursor:pointer;">Try again</button>
        </div>`;
      const retryBtn = document.getElementById('ts-retry-load');
      if(retryBtn) retryBtn.onclick = () => window.location.reload();
      return;
    }
    render();
    await reverifyIfNeeded();
    await autoIdentifyIfNeeded();
    render();

    // Retry failed score saves as soon as the device thinks it's back online,
    // rather than waiting for the next heartbeat tick.
    window.addEventListener('online', () => { scoringHeartbeat(); });
    setInterval(scoringHeartbeat, 25000);
  })();
})();
</script>
