  // Builds ready-to-send reminder emails (as CSV rows) for anyone playing tomorrow, or on
  // pro-shop duty today. This doesn't send anything — it's meant to be exported and fed to
  // a separate scheduled script (e.g. via Windows Task Scheduler) that actually sends mail.
  function buildEmailReminders(){
    const schedule = buildSchedule();
    const today = new Date(); today.setHours(0,0,0,0);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const tomorrowKey = fmtDateKey(tomorrow);
    const rows = [];

    // Playing tomorrow — one email, everyone playing CC'd together
    const tmrDate = schedule.find(d => fmtDateKey(d) === tomorrowKey);
    if(tmrDate && !data.closures[tomorrowKey]){
      const capacity = capacityFor(tomorrowKey);
      const entries = data.signups[tomorrowKey] || [];
      const { confirmed } = splitConfirmedStandby(entries, capacity);
      const playingList = capacity != null ? confirmed : entries;
      const withEmail = playingList
        .map(entry => ({ entry, p: data.roster.find(r => r.id === entry.id) }))
        .filter(x => x.p && x.p.email);
      if(withEmail.length){
        const dateLabel = `${DOW_NAMES[tmrDate.getDay()]} ${MON_NAMES[tmrDate.getMonth()]} ${tmrDate.getDate()}`;
        const nameLines = withEmail.map(({entry, p}) => {
          const holesNote = entry.holes !== '18' ? ` (${HOLES_LABEL[entry.holes]})` : '';
          // Same tee/course-handicap resolution and display convention used
          // everywhere else in the app (entry's own tee for this date,
          // falling back to the player's default; "<Tee> tee, HC <n>").
          const tee = entry.tee || p.defaultTee || null;
          const ch = computedCourseHandicap(p.handicapIndex, tee);
          const teeHcNote = tee ? ` — ${tee} tee${typeof ch === 'number' ? `, HC ${ch}` : ''}` : (typeof ch === 'number' ? ` — HC ${ch}` : '');
          return `- ${p.name}${teeHcNote}${holesNote}`;
        }).join('\n');
        rows.push({
          cc: withEmail.map(x => x.p.email).concat(PRO_SHOP_EMAILS).concat(GOLF_TOMORROW_EXTRA_CC).join(','),
          subject: `Reminder: golf tomorrow, ${dateLabel}`,
          body: `Hi. This message is being sent to you via the Gibson Group's Scheduling app to remind you that the following are signed up to play tomorrow, ${dateLabel}. Hit 'em straight!\n\n${nameLines}`
        });
      }
    }

    // Pro-shop duty tomorrow — one email, everyone with a duty date tomorrow CC'd together
    const dutyReminders = [];
    schedule.forEach(d => {
      const key = fmtDateKey(d);
      const duty = dutyForKey(key);
      if(!duty || !duty.email || data.closures[key]) return;
      const bookOpenDate = new Date(d); bookOpenDate.setDate(bookOpenDate.getDate() - BOOKING_WINDOW_DAYS);
      if(daysBetween(today, bookOpenDate) !== 1) return;
      const count = (data.signups[key] || []).length;
      const tt = count > 0 ? Math.min(MAX_TEE_TIMES, Math.ceil(count/PLAYERS_PER_TEE_TIME)) : 0;
      const arrival = arrivalTimeFor(fmtDateKey(bookOpenDate));
      dutyReminders.push({ duty, d, tt, arrival });
    });
    if(dutyReminders.length){
      const nameLines = dutyReminders.map(({duty, d, tt, arrival}) => {
        const dateLabel = `${DOW_NAMES[d.getDay()]} ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;
        const arrivalNote = arrival ? ` (arrive at ${arrival})` : '';
        return `- ${duty.name}: request ${tt || '?'} tee time${tt===1?'':'s'} for ${dateLabel}${arrivalNote}`;
      }).join('\n');
      rows.push({
        cc: dutyReminders.map(x => x.duty.email).join(','),
        subject: `Reminder: pro shop visit tomorrow`,
        body: `Reminder — you have pro-shop duty tomorrow:\n\n${nameLines}`
      });
    }

    return rows;
  }

  function firstNameOf(name){
    return name.trim().split(/\s+/)[0];
  }

  // Snake-draft team balancing for the next play day. Uses each player's tee for
  // THAT round (their signup's own tee choice if set, else their profile default),
  // and whoever has the lowest course handicap among just the people playing that
  // day (not the whole roster) is who plays to scratch — matching real handicap play.
  function courseHandicapFor(player, tee){
    if(!player || !tee) return null;
    return computedCourseHandicap(player.handicapIndex, tee);    
  }

  // Standard USGA Course Handicap formula: Index × (Slope ÷ 113) + (Rating − Par),
  // rounded to the nearest whole stroke. Par is a fixed 72 for every tee (confirmed
  // against the club's own per-hole par card — front 36 + back 36). Used only when
  // an admin hand-edits a Handicap Index in Player Handicaps — a fresh Import data
  // snapshot still writes each tee's Course Handicap straight from the imported
  // table, since that's presumed authoritative over anything computed here.
  const COURSE_PAR = 72;
  function computedCourseHandicap(indexVal, tee){
    if(typeof indexVal !== 'number') return null;
    const r = data.teeRatings[tee];
    if(!r || typeof r.rating !== 'number' || typeof r.slope !== 'number') return null;
    return Math.round(indexVal * (r.slope / 113) + (r.rating - COURSE_PAR));
  }
  function recomputeCourseHandicapsForPlayer(player){
    if(!player || typeof player.handicapIndex !== 'number') return;
    if(!player.courseHandicaps) player.courseHandicaps = {};
    data.teeOptions.forEach(tee => {
      const ch = computedCourseHandicap(player.handicapIndex, tee);
      if(ch !== null) player.courseHandicaps[tee] = ch;
    });
  }

  function computeTeamsForDate(dateKey){
    const entries = data.signups[dateKey] || [];
    const capacity = capacityFor(dateKey);
    const { confirmed } = splitConfirmedStandby(entries, capacity);
    const playing = confirmed.length ? confirmed : entries; // fall back to everyone signed up if no cap set yet

    // Only full 18-hole rounds count toward the team bet.
    const eighteenHoleEntries = playing.filter(e => e.holes === '18');
    // Nine-hole players don't play in today's bet, but the "Not in the bet" list
    // doubles as a bench an admin can manually swap someone in from (see the Swap
    // control in Scoring & Bets) — so their handicap info is computed here too,
    // ready the moment they're pulled onto a team.
    const nineHoleOut = playing.filter(e => e.holes !== '18').map(entry => {
      const p = data.roster.find(r => r.id === entry.id);
      if(!p) return null;
      const tee = entry.tee || p.defaultTee || null;
      const ch = courseHandicapFor(p, tee);
      return { id: p.id, name: p.name, tee, courseHandicap: ch, reason: `Playing ${HOLES_LABEL[entry.holes] || 'nine'}` };
    }).filter(Boolean);

    let players = eighteenHoleEntries.map(entry => {
      const p = data.roster.find(r => r.id === entry.id);
      if(!p) return null;
      const tee = entry.tee || p.defaultTee || null;
      const ch = courseHandicapFor(p, tee);
      return { id: p.id, name: p.name, tee, courseHandicap: ch };
    }).filter(Boolean);

    if(players.length === 0 && nineHoleOut.length === 0) return null;

    // lowestCH stays based on just the 18-hole field, same as before — nine-hole
    // players' strokesOff below is measured against that same baseline, but they
    // don't get a vote in setting it.
    const withCH = players.filter(x => x.courseHandicap !== null);
    const lowestCH = withCH.length ? Math.min(...withCH.map(x => x.courseHandicap)) : 0;
    players.forEach(p => {
      p.strokesOff = (p.courseHandicap !== null) ? (p.courseHandicap - lowestCH) : null;
    });
    nineHoleOut.forEach(p => {
      p.strokesOff = (p.courseHandicap !== null) ? (p.courseHandicap - lowestCH) : null;
    });

    const numTeams = confirmedTeeTimesCountFor(dateKey) || Math.min(MAX_TEE_TIMES, Math.max(1, Math.ceil(players.length / PLAYERS_PER_TEE_TIME)));

    // Sort by strokes off descending (highest handicap first); anyone with no known
    // handicap goes last, in signup order among themselves.
    const sorted = [...players].sort((a, b) => {
      if(a.strokesOff === null && b.strokesOff === null) return 0;
      if(a.strokesOff === null) return 1;
      if(b.strokesOff === null) return -1;
      return b.strokesOff - a.strokesOff;
    });

    // Teams have to come out equal size — if the numbers don't divide evenly, whoever
    // signed up last (among the 18-hole players) sits out of the bet that day, same as
    // anyone playing nine holes. They can still play, just not part of the competition.
    const teamSize = Math.floor(sorted.length / numTeams);
    const usable = teamSize * numTeams;
    const oddOneOut = [];
    let eligible = sorted;
    if(usable < sorted.length){
      // Figure out who signed up last, among just the eligible 18-hole players.
      const signupOrder = eighteenHoleEntries.map(e => e.id);
      const bySignupOrder = [...sorted].sort((a, b) => signupOrder.indexOf(a.id) - signupOrder.indexOf(b.id));
      const cutCount = sorted.length - usable;
      const cut = bySignupOrder.slice(-cutCount);
      const cutIds = new Set(cut.map(p => p.id));
      cut.forEach(p => oddOneOut.push(Object.assign({}, p, { reason: 'Odd numbers — sitting out of the bet today' })));
      eligible = sorted.filter(p => !cutIds.has(p.id));
    }

    const teams = Array.from({ length: numTeams }, () => []);
    let teamIdx = 0, direction = 1;
    eligible.forEach(p => {
      teams[teamIdx].push(p);
      teamIdx += direction;
      if(teamIdx === numTeams){ teamIdx = numTeams - 1; direction = -1; }
      else if(teamIdx === -1){ teamIdx = 0; direction = 1; }
    });

    return { teams, notInBet: [...nineHoleOut, ...oddOneOut], generatedAt: new Date().toISOString() };
  }

  // The same lowest-course-handicap baseline computeTeamsForDate would use for
  // this date, re-derived from that day's actual 18-hole signups rather than
  // whoever happens to be on a team right now — so a player swapped onto a team
  // gets a strokesOff that matches what a fresh generation would've given them,
  // whether or not their "Not in the bet" entry already had one computed (older
  // entries, from before that was tracked, didn't). Also used by normalizeTeams()
  // above to self-heal any already-saved team missing these fields.
  function lowestCourseHandicapForDate(dateKey){
    const entries = data.signups[dateKey] || [];
    const capacity = capacityFor(dateKey);
    const { confirmed } = splitConfirmedStandby(entries, capacity);
    const playing = confirmed.length ? confirmed : entries;
    const chs = playing.filter(e => e.holes === '18').map(entry => {
      const p = data.roster.find(r => r.id === entry.id);
      if(!p) return null;
      const tee = entry.tee || p.defaultTee || null;
      return courseHandicapFor(p, tee);
    }).filter(v => typeof v === 'number');
    return chs.length ? Math.min(...chs) : 0;
  }

  // Recomputes tee/courseHandicap/strokesOff fresh for a player about to land on
  // a team — heals a swap-in (or an already-saved team, via normalizeTeams() above)
  // from an older "Not in the bet" entry that predates those fields being tracked
  // there (shows up as undefined HC/S.O. otherwise).
  function recomputedForTeamSlot(dateKey, playerLite){
    const rosterPlayer = data.roster.find(r => r.id === playerLite.id);
    const tee = playerLite.tee || (rosterPlayer && rosterPlayer.defaultTee) || null;
    const ch = rosterPlayer ? courseHandicapFor(rosterPlayer, tee) : (typeof playerLite.courseHandicap === 'number' ? playerLite.courseHandicap : null);
    const lowestCH = lowestCourseHandicapForDate(dateKey);
    return {
      id: playerLite.id,
      name: playerLite.name,
      tee,
      courseHandicap: typeof ch === 'number' ? ch : null,
      strokesOff: typeof ch === 'number' ? (ch - lowestCH) : null
    };
  }

  // Shared "Swap players between teams" grid — renders on the admin Scoring &
  // Bets tab (Set up & Bets) and on the public Handicaps page's Teams section,
  // so anyone can build a date's teams by hand; the [data-assign-player] change
  // handler is what actually gates changes behind the admin PIN when it's
  // someone not already unlocked. Every player falls into exactly one of Team
  // 1 / Team 2 / Not in bet, checkbox-wise — see that handler for how a check
  // or uncheck resolves to a move. Ranked low to high by course handicap (the
  // better golfer first), not alphabetically; anyone with no known course
  // handicap sorts to the bottom, alphabetically among themselves. `label`
  // lets a call site customize the intro line; returns '' when there's
  // nothing to show (no teams generated for this date yet).
  function swapPlayersTableHtml(dateKey, teamsInfo, label){
    const assignAllPlayers = [
      ...teamsInfo.teams.flatMap((team, ti) => team.map(p => ({ p, teamIndex: ti }))),
      ...teamsInfo.notInBet.map(p => ({ p, teamIndex: -1 })),
    ].sort((a, b) => {
      const ah = typeof a.p.courseHandicap === 'number' ? a.p.courseHandicap : Infinity;
      const bh = typeof b.p.courseHandicap === 'number' ? b.p.courseHandicap : Infinity;
      if(ah !== bh) return ah - bh;
      return a.p.name.localeCompare(b.p.name);
    });
    const numTeams = teamsInfo.teams.length;
    if(!(numTeams > 0 && assignAllPlayers.length > 0)) return '';
    return `
      <div class="ts-import-row">
        <span class="ts-import-row-label">Swap players between teams</span>
        <p style="margin:6px 0 8px;">${label || 'Check where each player belongs — Team 1, Team 2, or Not in bet. Regenerating teams for this date will undo any changes made here.'}</p>
        <div>
          ${assignAllPlayers.map(({ p, teamIndex }) => `
            <div style="display:flex; align-items:center; gap:16px; padding:6px 0; border-bottom:1px solid var(--ivory-line); flex-wrap:wrap;">
              <span style="flex:1; min-width:120px; font-size:13px; font-weight:600;">${esc(p.name)}</span>
              ${Array.from({ length: numTeams }, (_, ti) => `
                <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:#6b6a5e; font-weight:500;">
                  <input type="checkbox" data-assign-date="${dateKey}" data-assign-player="${p.id}" data-assign-team="${ti}" ${teamIndex===ti?'checked':''}>
                  Team ${ti+1}
                </label>`).join('')}
              <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:#6b6a5e; font-weight:500;">
                <input type="checkbox" data-assign-date="${dateKey}" data-assign-player="${p.id}" data-assign-team="-1" ${teamIndex===-1?'checked':''}>
                Not in bet
              </label>
            </div>`).join('')}
        </div>
      </div>`;
  }

  // Blank paper scorecards for a date's teams — one printable table per team,
  // holes 1-18 across the top (Front 9 / Back 9, like an actual scorecard)
  // with a Par row and a tinted cell marking exactly which holes each player
  // gets a stroke on (using their own tee's stroke index — Red plays a
  // different one). Meant to be printed and taken to the course; it's a
  // read-only reference, not part of Live Scoring — nothing here is saved.
  function scorecardsHtml(dateKey){
    const teamsInfo = data.teams[dateKey];
    if(!teamsInfo) return '';
    const d = new Date(dateKey + 'T00:00:00');
    const dateLabel = `${DOW_NAMES[d.getDay()]}, ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;
    const holes = Array.from({ length: 18 }, (_, i) => i + 1);
    const parsKnown = holes.every(h => typeof data.holePars[String(h)] === 'number');
    const parTotal = parsKnown ? holes.reduce((sum, h) => sum + data.holePars[String(h)], 0) : null;

    let anyHybrid = false;
    const teamTables = teamsInfo.teams.map((team, ti) => {
      if(!team.length) return '';
      const rows = team.map(p => {
        const table = holeHandicapTableFor(p.tee);
        const tableComplete = holeHandicapsComplete(table);
        const cells = holes.map(h => {
          const strokes = tableComplete ? strokesReceivedOnHole(p.strokesOff, h, p.tee) : 0;
          return `<td class="ts-scorecard-blank${strokes > 0 ? ' ts-score-stroke' : ''}"${strokes > 0 ? ` title="${p.name.split(' ')[0]} gets ${strokes} stroke${strokes===1?'':'s'} here"` : ''}></td>`;
        }).join('');
        const teeNote = p.tee ? ` <span class="ts-team-so">${esc(p.tee)}</span>` : '';
        const soNote = p.strokesOff ? ` <span class="ts-team-so">(S.O. ${p.strokesOff})</span>` : '';
        const mainRow = `<tr><td class="ts-score-name">${esc(p.name)}${teeNote}${soNote}</td>${cells}<td class="ts-scorecard-blank"></td></tr>`;
        // Hybrid tees (Red/Gold, Gold/White, White/Blue, Blue/Black) play a
        // different single tee hole by hole — a thin reference row right under
        // that player's row, so the boxes above stay clear to write scores in.
        let hybridRow = '';
        if(hybridTeeKey(p.tee)){
          anyHybrid = true;
          hybridRow = `
            <tr class="ts-scorecard-hybrid-row">
              <td>Tee</td>${holes.map(h => `<td>${esc(HYBRID_TEE_ABBR[hybridTeeForHole(p.tee, h)] || '')}</td>`).join('')}<td></td>
            </tr>`;
        }
        return mainRow + hybridRow;
      }).join('');
      return `
        <div class="ts-scorecard-block">
          <div class="ts-team-num">Team ${ti + 1} — ${esc(dateLabel)}</div>
          <div style="overflow-x:auto;">
            <table class="ts-scorecard-table">
              <thead>
                <tr><th></th><th colspan="9">Front 9</th><th colspan="9">Back 9</th><th></th></tr>
                <tr><th>Hole</th>${holes.map(h => `<th>${h}</th>`).join('')}<th>Total</th></tr>
                <tr class="ts-par-row"><th>Par</th>${holes.map(h => `<th>${typeof data.holePars[String(h)] === 'number' ? data.holePars[String(h)] : ''}</th>`).join('')}<th>${parTotal !== null ? parTotal : ''}</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }).join('');

    if(!teamTables) return '';
    const hybridLegendHtml = anyHybrid
      ? ` A "Tee" row under a hybrid-tee player (${Object.entries(HYBRID_TEE_ABBR).map(([full, abbr]) => `${abbr}=${full}`).join(', ')}) shows which tee they play that hole.`
      : '';
    return `
      <div class="ts-scorecard-print-wrap">
        <div class="ts-section-title-row" style="margin:0 0 8px;">
          <span class="ts-import-row-label" style="margin:0;">Scorecards — ${esc(dateLabel)}</span>
          <button type="button" class="ts-print-btn" id="ts-print-scorecards">🖨️ Print scorecards</button>
        </div>
        <p style="margin:0 0 10px; font-size:12.5px; color:#6b6a5e;">One card per team, ready to print and take out — the tinted box marks which holes each player gets a stroke on.${hybridLegendHtml} Doesn't feed Live Scoring; scores still only count once entered there.</p>
        ${teamTables}
      </div>`;
  }

  function confirmedTeeTimesCountFor(dateKey){
    const n = data.confirmedTeeTimes[dateKey];
    return (typeof n === 'number' && n > 0) ? n : null;
  }

  // confirmOverwrite, if given, is called (with the date key) when teams already
  // exist for the target date — e.g. from a manual swap made in Scoring & Bets —
  // so the caller can warn before that gets discarded. Returns the date key on
  // success, null if there was nothing to generate, or the string 'cancelled' if
  // confirmOverwrite was asked and said no.
  async function generateTeamsForNextPlayDay(confirmOverwrite){
    const key = nextPlayDateKey();
    if(!key) return null;
    if(data.teams[key] && confirmOverwrite){
      const proceed = await confirmOverwrite(key);
      if(!proceed) return 'cancelled';
    }
    const result = computeTeamsForDate(key);
    if(!result) return null;
    data.teams[key] = result;
    // A fresh (re)generation replaces whatever the admin may have already reviewed
    // and accepted — require a new Accept Teams before Live Scoring shows this
    // lineup.
    ensureRoundDefaults(key).teamsAccepted = false;
    await saveData();
    return key;
  }

  // ---------------------------------------------------------------------------
  // SCORING & BETTING — hole-by-hole scores for the teams above, settled as
  // NUM_SERIES series of HOLES_PER_SERIES holes each, $stakePerSeries a series.
  // Strokes are allocated hole-by-hole using the course's hole handicap (stroke
  // index) — a player with N strokes off gets a stroke on the N hardest holes
  // (rank 1..N); if N > 18, every hole gets a base stroke plus one more on the
  // (N-18) hardest. That needs all 18 holes' ranks entered on the Handicaps tab
  // (holeHandicapsComplete()) — until then, strokes fall back to being split as
  // evenly as possible across the 3 series instead of by hole.
  // A team's net for a series is the sum of its players' net scores for that
  // series' 6 holes; every team is guaranteed the same size by the team
  // generator above, so that sum is a fair comparison. Every pair of teams is
  // its own $stakePerSeries bet each series (round-robin), low net wins, ties push.
  // ---------------------------------------------------------------------------

  function seriesHoleGroups(startHole){
    const start = (typeof startHole === 'number' && startHole >= 1 && startHole <= 18) ? startHole : 1;
    const order = Array.from({ length: 18 }, (_, i) => ((start - 1 + i) % 18) + 1);
    const groups = [];
    for(let s = 0; s < NUM_SERIES; s++) groups.push(order.slice(s * HOLES_PER_SERIES, s * HOLES_PER_SERIES + HOLES_PER_SERIES));
    return groups;
  }

  // Red tees play a different course setup and have their own stroke-index
  // order from the scorecard — everything else shares one table. Matched by
  // name rather than a fixed list, so it keeps working whatever the admin
  // has actually named that tee (Red, Reds, Red Tees, Ladies Red, ...).
  function isRedTee(tee){
    return typeof tee === 'string' && /red/i.test(tee);
  }

  function holeHandicapTableFor(tee){
    return isRedTee(tee) ? (data.holeHandicapsRed || {}) : (data.holeHandicaps || {});
  }

  // Hybrid tees play a different single tee on different holes — e.g. a
  // "White/Blue" player tees off from Blue on some holes and White on
  // others, per the club's own hybrid-tee chart (informational only; doesn't
  // affect handicap or stroke-index math, which still goes by the player's
  // one listed tee). Keyed by the tee name with spaces stripped and case
  // ignored, so "White/Blue", "white / blue" etc. all match the same entry.
  const HYBRID_TEE_HOLES = {
    'red/gold':    ['Gold','Gold','Gold','Red','Gold','Red','Red','Gold','Red','Red','Gold','Gold','Red','Gold','Red','Gold','Gold','Red'],
    'gold/white':  ['White','Gold','White','Gold','White','White','Gold','White','Gold','Gold','White','White','Gold','Gold','Gold','White','White','White'],
    'white/blue':  ['Blue','White','Blue','White','Blue','Blue','White','Blue','White','White','Blue','Blue','White','White','White','Blue','Blue','White'],
    'blue/black':  ['Black','Blue','Black','Blue','Black','Black','Blue','Black','Blue','Blue','Black','Black','Blue','Black','Blue','Black','Black','Blue'],
  };
  const HYBRID_TEE_ABBR = { Red: 'Rd', Gold: 'Gd', White: 'Wh', Blue: 'Bl', Black: 'Bk' };

  function hybridTeeKey(tee){
    if(typeof tee !== 'string') return null;
    const norm = tee.trim().toLowerCase().replace(/\s+/g, '');
    return HYBRID_TEE_HOLES[norm] ? norm : null;
  }

  // The actual tee a hybrid-tee player tees off from on one specific hole, or
  // null if tee isn't a recognized hybrid tee.
  function hybridTeeForHole(tee, holeNum){
    const key = hybridTeeKey(tee);
    if(!key) return null;
    return HYBRID_TEE_HOLES[key][holeNum - 1] || null;
  }

  // True once all 18 holes have a rank entered and those ranks are exactly a
  // permutation of 1..18 (each hole a distinct difficulty rank, 1 = hardest).
  // table defaults to the standard (non-Red) stroke index.
  function holeHandicapsComplete(table){
    const hh = table || data.holeHandicaps || {};
    const ranks = [];
    for(let h = 1; h <= 18; h++){
      const r = hh[String(h)];
      if(typeof r !== 'number') return false;
      ranks.push(r);
    }
    const sorted = [...ranks].sort((a, b) => a - b);
    for(let i = 0; i < 18; i++){ if(sorted[i] !== i + 1) return false; }
    return true;
  }

  function holeHandicapsCompleteRed(){
    return holeHandicapsComplete(data.holeHandicapsRed);
  }

  // Whether exact hole-by-hole strokes can be used for this date's teams: the
  // standard stroke index always has to be complete, and — only if someone on
  // a team (or sitting out) is actually playing a Red tee — the Red stroke
  // index has to be complete too. Lets rounds with no Red players keep using
  // exact strokes even before the Red table's been filled in.
  function holeHandicapsCompleteForTeams(teamsInfo){
    if(!holeHandicapsComplete()) return false;
    const everyone = teamsInfo ? teamsInfo.teams.flat().concat(teamsInfo.notInBet || []) : [];
    const usesRed = everyone.some(p => isRedTee(p.tee));
    return !usesRed || holeHandicapsCompleteRed();
  }

  // How many strokes a player with this many strokes-off gets on one specific
  // hole, using the standard allocation: a stroke on every hole ranked 1..N
  // (rank 1 = hardest); if N > 18, every hole gets one stroke plus a second on
  // the (N-18) hardest. tee picks which stroke-index table to use (Red tees
  // have their own). Only meaningful once that table is complete.
  function strokesReceivedOnHole(strokesOff, holeNum, tee){
    const rank = holeHandicapTableFor(tee)[String(holeNum)];
    if(typeof rank !== 'number') return 0;
    const so = typeof strokesOff === 'number' && strokesOff > 0 ? strokesOff : 0;
    const full = Math.floor(so / 18);
    const remainder = so - full * 18;
    return full + (rank <= remainder ? 1 : 0);
  }

  // Fallback used only when holeHandicapsComplete() is false: splits a
  // player's round-long strokes off as evenly as possible across the 3
  // series, front-loading any remainder onto the earlier ones.
  function strokesForSeries(strokesOff){
    const so = typeof strokesOff === 'number' && strokesOff > 0 ? strokesOff : 0;
    const base = Math.floor(so / NUM_SERIES);
    const remainder = so - base * NUM_SERIES;
    return Array.from({ length: NUM_SERIES }, (_, i) => base + (i < remainder ? 1 : 0));
  }

  function ensureRoundDefaults(dateKey){
    if(!data.rounds[dateKey]) data.rounds[dateKey] = { startHole: 1, stakePerSeries: 1, scores: {} };
    if(!data.rounds[dateKey].scores) data.rounds[dateKey].scores = {};
    // Tracks, per player/hole, whether a stored score is a real entry (true) vs. the
    // silent par default filled in just so a hole isn't blank while it's on screen
    // (false, or simply absent if the hole's never been touched at all). Lets the
    // scoreboard show at a glance which holes still need someone to actually look.
    if(!data.rounds[dateKey].confirmed) data.rounds[dateKey].confirmed = {};
    if(typeof data.rounds[dateKey].startHole !== 'number') data.rounds[dateKey].startHole = 1;
    if(typeof data.rounds[dateKey].stakePerSeries !== 'number') data.rounds[dateKey].stakePerSeries = 1;
    if(data.rounds[dateKey].game !== '1ball' && data.rounds[dateKey].game !== '2ball') data.rounds[dateKey].game = '2ball';
    // Gates Live Scoring: names only show up there once the admin has reviewed the
    // generated (or manually reassigned) teams on Set up & Bets and clicked Accept
    // Teams. Regenerating teams or reassigning a player resets this back to false —
    // see generateTeamsForNextPlayDay and the team-assignment checkbox handler —
    // so a roster change always needs a fresh, deliberate re-accept.
    if(typeof data.rounds[dateKey].teamsAccepted !== 'boolean') data.rounds[dateKey].teamsAccepted = false;
    return data.rounds[dateKey];
  }

  // How many of a team's net scores on a hole count toward its low-ball total —
  // a fixed choice per round ('1ball' = the single lowest net counts, '2ball' =
  // the two lowest count), independent of team size. Picked in Round setup.
  function lowBallCountFor(game){
    return game === '1ball' ? 1 : 2;
  }

  // A team's used (counted) net score on one hole: the sum of its K lowest
  // players' net scores that hole, or null if any player on the team is
  // missing a score for it (we don't know who the lowest K would be until
  // everyone's in). Shared by the $ standings, the live progress line, and the
  // scorecard's running-total row below, so all three always agree.
  function teamLowBallHoleNet(team, holeNum, scores, K){
    const nets = [];
    for(const p of team){
      const v = (scores[p.id] || {})[String(holeNum)];
      if(typeof v !== 'number') return null;
      nets.push(v - strokesReceivedOnHole(p.strokesOff, holeNum, p.tee));
    }
    nets.sort((a, b) => a - b);
    return nets.slice(0, Math.min(K, nets.length)).reduce((s, x) => s + x, 0);
  }

  // For each team and series: whether every player needed has all 6 holes
  // entered, and if so, the team's low-ball net total for that series (sum,
  // hole by hole, of its K lowest net scores — see lowBallCountFor). Then
  // every team-pair's result per series, and each team's running $ total.
  // Needs exact hole handicaps, since strokes have to land on one specific
  // hole to know a player's net for it, rather than split evenly across a
  // series.
  function computeSeriesStandings(dateKey){
    const teamsInfo = data.teams[dateKey];
    const round = data.rounds[dateKey];
    if(!teamsInfo || !round) return null;
    const groups = seriesHoleGroups(round.startHole);
    const scores = round.scores || {};
    const stake = round.stakePerSeries;
    const exact = holeHandicapsCompleteForTeams(teamsInfo);
    const game = round.game === '1ball' ? '1ball' : '2ball';
    const K = lowBallCountFor(game);

    const teamSeriesNet = teamsInfo.teams.map(team => {
      return groups.map(holes => {
        if(!exact) return { complete: false, net: 0 };
        let complete = true;
        let net = 0;
        holes.forEach(h => {
          const used = teamLowBallHoleNet(team, h, scores, K);
          if(used === null){ complete = false; return; }
          net += used;
        });
        return { complete, net };
      });
    });

    const numTeams = teamsInfo.teams.length;
    const matchups = [];
    for(let si = 0; si < NUM_SERIES; si++){
      for(let a = 0; a < numTeams; a++){
        for(let b = a + 1; b < numTeams; b++){
          const A = teamSeriesNet[a][si], B = teamSeriesNet[b][si];
          let result = null;
          if(A.complete && B.complete){
            if(A.net < B.net) result = 'A';
            else if(B.net < A.net) result = 'B';
            else result = 'push';
          }
          matchups.push({ seriesIndex: si, teamA: a, teamB: b, aNet: A.complete ? A.net : null, bNet: B.complete ? B.net : null, result });
        }
      }
    }

    const teamTotals = Array.from({ length: numTeams }, () => 0);
    matchups.forEach(m => {
      if(m.result === 'A'){ teamTotals[m.teamA] += stake; teamTotals[m.teamB] -= stake; }
      else if(m.result === 'B'){ teamTotals[m.teamB] += stake; teamTotals[m.teamA] -= stake; }
    });

    return { groups, teamSeriesNet, matchups, teamTotals, stake, exact, game };
  }

  // Live "vs. par, thru N" summary per series — separate from the $ standings
  // above because it's meaningful mid-series (as soon as any hole is fully in,
  // not just once a whole series is complete), and because holes can come in
  // out of order on a shotgun start. Only counts holes that have both a par
  // entered and every team member's score in; "thru" reflects how many of the
  // series' holes are usable that way, not necessarily how far the group has
  // physically played. Returns null if hole handicaps aren't fully set.
  function computeLowBallProgress(dateKey){
    const teamsInfo = data.teams[dateKey];
    const round = data.rounds[dateKey];
    if(!teamsInfo || !round || !holeHandicapsCompleteForTeams(teamsInfo)) return null;
    const groups = seriesHoleGroups(round.startHole);
    const scores = round.scores || {};
    const K = lowBallCountFor(round.game);
    return teamsInfo.teams.map(team => {
      return groups.map(holes => {
        let holesCounted = 0;
        let relToPar = 0;
        holes.forEach(h => {
          const par = typeof data.holePars[String(h)] === 'number' ? data.holePars[String(h)] : null;
          if(par === null) return;
          const used = teamLowBallHoleNet(team, h, scores, K);
          if(used === null) return;
          relToPar += used - K * par;
          holesCounted++;
        });
        return { holesCounted, holesInSeries: holes.length, relToPar };
      });
    });
  }

  // Per-hole running "vs. par" total for the scorecard's own footer row — the
  // cumulative total through each hole, resetting at the start of each series
  // (matching how the $ bet is settled series by series). A hole's value is
  // only shown once that hole itself is complete; holes still missing a score
  // are left blank rather than carrying the previous number forward, so a gap
  // from a shotgun start reads as "not in yet" rather than "no change here."
  // Returns null if hole handicaps aren't fully set.
  function computeLowBallHoleRunning(dateKey){
    const teamsInfo = data.teams[dateKey];
    const round = data.rounds[dateKey];
    if(!teamsInfo || !round || !holeHandicapsCompleteForTeams(teamsInfo)) return null;
    const groups = seriesHoleGroups(round.startHole);
    const scores = round.scores || {};
    const K = lowBallCountFor(round.game);
    return teamsInfo.teams.map(team => {
      const byHole = {};
      groups.forEach(holes => {
        let running = 0;
        holes.forEach(h => {
          const par = typeof data.holePars[String(h)] === 'number' ? data.holePars[String(h)] : null;
          if(par === null) return;
          const used = teamLowBallHoleNet(team, h, scores, K);
          if(used === null) return;
          running += used - K * par;
          byHole[h] = running;
        });
      });
      return byHole;
    });
  }

  function fmtRelToPar(n){
    if(n === 0) return 'E';
    return n > 0 ? `+${n}` : `${n}`;
  }

  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return `${sign}$${Math.abs(n)}`;
  }

  // Season-long $ leaderboard — rolls every dated round's team totals up to each
  // individual player, since teams themselves are redrawn fresh for every round
  // and aren't a stable unit across dates the way players are. A team's result for
  // a date is shared by everyone on that team, same as the actual bet works.
  // Rounds still in progress count too (using whatever's decided so far), same as
  // the per-date view already does, so this stays live rather than only updating
  // once a round is fully wrapped up. Returns [] if no round has any teams yet.
  function computeSeasonStandings(){
    const totals = {}; // playerId -> { id, name, total, roundsPlayed }
    Object.keys(data.teams).forEach(dateKey => {
      const standings = computeSeriesStandings(dateKey);
      const teamsInfo = data.teams[dateKey];
      if(!standings || !teamsInfo) return;
      teamsInfo.teams.forEach((team, ti) => {
        const teamTotal = standings.teamTotals[ti] || 0;
        team.forEach(p => {
          if(!totals[p.id]) totals[p.id] = { id: p.id, name: p.name, total: 0, roundsPlayed: 0 };
          totals[p.id].name = p.name; // keep the most recent spelling on file
          totals[p.id].total += teamTotal;
          totals[p.id].roundsPlayed += 1;
        });
      });
    });
    return Object.values(totals).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  }

  // Compares this app's current data against a pasted snapshot from the other app,
  // and reports differences without changing anything. Comparisons go by player NAME
  // (not id) since the same real person can end up with different ids in each app —
  // e.g. one added manually here, imported with a different id there.
  function nameById(roster, id){
    const p = roster.find(r => r.id === id);
    return p ? p.name : null;
  }

  function diffDataSnapshots(cur, inc){
    const diffs = [];
    const incRoster = inc.roster || [];
    const incSignups = inc.signups || {};
    const incDuty = inc.duty || {};
    const incClosures = inc.closures || {};
    const incConfirmed = inc.confirmedTeeTimes || {};
    const incTeeTimes = inc.teeTimeSchedule || {};

    function findHereByName(name){
      return cur.roster.find(r => r.name.trim().toLowerCase() === name.trim().toLowerCase());
    }

    // Roster: in pasted but not here — option to add
    incRoster.forEach(p => {
      const name = typeof p === 'object' ? p.name : p;
      const email = typeof p === 'object' ? p.email : undefined;
      if(!name || findHereByName(name)) return;
      diffs.push({
        id: 'roster-add-' + name,
        category: 'League roster',
        label: `${name} is in the pasted data but not here`,
        hereLabel: 'Leave out',
        pastedLabel: `Add "${name}"${email ? ' (' + email + ')' : ''}`,
        apply: (d) => {
          const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
          const entry = { id, name };
          if(email) entry.email = email;
          d.roster.push(entry);
        }
      });
    });

    // Roster: here but not in pasted — option to remove
    cur.roster.forEach(p => {
      const existsThere = incRoster.some(q => (typeof q === 'object' ? q.name : q).trim().toLowerCase() === p.name.trim().toLowerCase());
      if(existsThere) return;
      diffs.push({
        id: 'roster-remove-' + p.id,
        category: 'League roster',
        label: `${p.name} is here but not in the pasted data`,
        hereLabel: `Keep "${p.name}"`,
        pastedLabel: `Remove "${p.name}"`,
        apply: (d) => { d.roster = d.roster.filter(x => x.id !== p.id); }
      });
    });

    // Roster: email differences
    cur.roster.forEach(p => {
      const match = incRoster.find(q => typeof q === 'object' && q.name.trim().toLowerCase() === p.name.trim().toLowerCase());
      if(!match) return;
      const a = p.email || '', b = match.email || '';
      if(a === b) return;
      diffs.push({
        id: 'roster-email-' + p.id,
        category: 'League roster',
        label: `${p.name}'s email differs`,
        hereLabel: `Keep "${a || '(none)'}"`,
        pastedLabel: `Use "${b || '(none)'}"`,
        apply: (d) => {
          const player = d.roster.find(x => x.id === p.id);
          if(player){ if(b) player.email = b; else delete player.email; }
        }
      });
    });

    // Signups: per date, per player
    const allDates = new Set([...Object.keys(cur.signups || {}), ...Object.keys(incSignups)]);
    [...allDates].sort().forEach(date => {
      const curEntries = cur.signups[date] || [];
      const incEntries = incSignups[date] || [];
      const curByName = {}; curEntries.forEach(e => { const n = nameById(cur.roster, e.id); if(n) curByName[n] = e; });
      const incByName = {}; incEntries.forEach(e => { const n = nameById(incRoster, e.id); if(n) incByName[n] = e; });

      Object.keys(incByName).forEach(name => {
        if(curByName[name]) return;
        diffs.push({
          id: `signup-add-${date}-${name}`,
          category: 'Signups',
          label: `${name} — ${date} (signed up in pasted data)`,
          hereLabel: 'Not signed up',
          pastedLabel: `Add to ${date}`,
          apply: (d) => {
            const player = findHereByName(name) || d.roster.find(r => r.name.trim().toLowerCase() === name.trim().toLowerCase());
            if(!player) return;
            if(!d.signups[date]) d.signups[date] = [];
            if(!d.signups[date].some(e => e.id === player.id)){
              d.signups[date].push({ id: player.id, holes: incByName[name].holes || '18' });
            }
          }
        });
      });

      Object.keys(curByName).forEach(name => {
        if(incByName[name]) return;
        diffs.push({
          id: `signup-remove-${date}-${name}`,
          category: 'Signups',
          label: `${name} — ${date} (signed up here only)`,
          hereLabel: `Keep signed up`,
          pastedLabel: `Remove from ${date}`,
          apply: (d) => {
            if(d.signups[date]) d.signups[date] = d.signups[date].filter(e => e.id !== curByName[name].id);
          }
        });
      });
    });

    // Booking duty per date
    const allDutyDates = new Set([...Object.keys(cur.duty || {}), ...Object.keys(incDuty)]);
    [...allDutyDates].sort().forEach(date => {
      const curName = nameById(cur.roster, cur.duty[date]);
      const incName = nameById(incRoster, incDuty[date]);
      if((curName || null) === (incName || null)) return;
      diffs.push({
        id: `duty-${date}`,
        category: 'Booking duty',
        label: `Duty for ${date}`,
        hereLabel: curName || 'Unassigned',
        pastedLabel: incName || 'Unassigned',
        apply: (d) => {
          if(incName){
            const player = findHereByName(incName);
            if(player) d.duty[date] = player.id; else delete d.duty[date];
          } else {
            delete d.duty[date];
          }
        }
      });
    });

    // Course closures per date
    const allClosureDates = new Set([...Object.keys(cur.closures || {}), ...Object.keys(incClosures)]);
    [...allClosureDates].sort().forEach(date => {
      const a = cur.closures[date], b = incClosures[date];
      if((a || null) === (b || null)) return;
      diffs.push({
        id: `closure-${date}`,
        category: 'Course closures',
        label: `Closure status for ${date}`,
        hereLabel: a ? 'Closed' + (a.trim() ? ' — ' + a : '') : 'Open',
        pastedLabel: b ? 'Closed' + (b.trim() ? ' — ' + b : '') : 'Open',
        apply: (d) => { if(b){ d.closures[date] = b; } else { delete d.closures[date]; } }
      });
    });

    // Confirmed tee times per date
    const allConfirmDates = new Set([...Object.keys(cur.confirmedTeeTimes || {}), ...Object.keys(incConfirmed)]);
    [...allConfirmDates].sort().forEach(date => {
      const a = cur.confirmedTeeTimes[date], b = incConfirmed[date];
      if((a || null) === (b || null)) return;
      diffs.push({
        id: `confirmed-${date}`,
        category: 'Confirmed tee times',
        label: `Confirmed tee times for ${date}`,
        hereLabel: a ? String(a) : 'Not set',
        pastedLabel: b ? String(b) : 'Not set',
        apply: (d) => { if(b){ d.confirmedTeeTimes[date] = b; } else { delete d.confirmedTeeTimes[date]; } }
      });
    });

    // First tee times schedule
    const allTeeTimeDates = new Set([...Object.keys(cur.teeTimeSchedule || {}), ...Object.keys(incTeeTimes)]);
    [...allTeeTimeDates].sort().forEach(date => {
      const a = cur.teeTimeSchedule[date], b = incTeeTimes[date];
      if((a || null) === (b || null)) return;
      diffs.push({
        id: `teetime-${date}`,
        category: 'First tee times',
        label: `Effective ${date}`,
        hereLabel: a || 'Not set',
        pastedLabel: b || 'Not set',
        apply: (d) => { if(b){ d.teeTimeSchedule[date] = b; } else { delete d.teeTimeSchedule[date]; } }
      });
    });

    return diffs;
  }

  function fmtWhen(ts){
    return new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }

  function showReconcileModal(diffs, meta){
    return new Promise(resolve => {
      const modalRoot = document.getElementById('ts-modal-root');
      // A rough "which one's newer" hint — both sides carry a single whole-data save
      // time, not a per-field one, so this can only say which snapshot as a whole was
      // saved more recently, not which specific answer below is the fresher one.
      const hereTs = meta && meta.hereModified;
      const pastedTs = meta && meta.pastedModified;
      const recencyHtml = (hereTs || pastedTs) ? `
        <div class="ts-note" style="margin:0 0 10px;">
          ${hereTs ? `This app last saved: ${fmtWhen(hereTs)}${(hereTs && pastedTs && hereTs > pastedTs) ? ' — more recent' : ''}` : 'This app: no save time on record'}<br>
          ${pastedTs ? `Pasted data last saved: ${fmtWhen(pastedTs)}${(hereTs && pastedTs && pastedTs > hereTs) ? ' — more recent' : ''}` : 'Pasted data: no save time on record (exported before this was added)'}
        </div>` : '';
      const selections = {};
      diffs.forEach(d => { selections[d.id] = 'here'; });

      const categories = [...new Set(diffs.map(d => d.category))];

      function rowsHtml(){
        return categories.map(cat => {
          const rows = diffs.filter(d => d.category === cat).map(d => `
            <div class="ts-reconcile-row">
              <div class="ts-reconcile-label">${esc(d.label)}</div>
              <div class="ts-reconcile-choices">
                <button class="ts-reconcile-choice ${selections[d.id]==='here'?'selected':''}" data-diff-id="${d.id}" data-choice="here">${esc(d.hereLabel)}</button>
                <button class="ts-reconcile-choice ${selections[d.id]==='pasted'?'selected':''}" data-diff-id="${d.id}" data-choice="pasted">${esc(d.pastedLabel)}</button>
              </div>
            </div>`).join('');
          return `<div class="ts-preview-email"><div class="ts-preview-meta"><b>${esc(cat)}</b></div>${rows}</div>`;
        }).join('');
      }

      function wireRows(){
        document.querySelectorAll('.ts-reconcile-choice').forEach(btn => {
          btn.onclick = () => {
            selections[btn.getAttribute('data-diff-id')] = btn.getAttribute('data-choice');
            document.getElementById('ts-preview-scroll-inner').innerHTML = rowsHtml();
            wireRows();
          };
        });
      }

      modalRoot.innerHTML = `
        <div class="ts-modal-overlay" id="ts-modal-overlay">
          <div class="ts-modal-box ts-modal-box-wide ts-modal-box-tall">
            <h4>Reconcile differences</h4>
            <p>For each item, pick which version to keep. Nothing changes until you click Apply.</p>
            ${recencyHtml}
            <div class="ts-preview-scroll" id="ts-preview-scroll-inner">${rowsHtml()}</div>
            <div class="ts-modal-actions">
              <button class="ts-modal-cancel" id="ts-modal-cancel">Cancel</button>
              <button class="ts-modal-ok" id="ts-modal-apply">Apply Selected Changes</button>
            </div>
          </div>
        </div>`;
      wireRows();

      const cleanup = (val) => { modalRoot.innerHTML = ''; resolve(val); };
      document.getElementById('ts-modal-cancel').onclick = () => cleanup(false);
      document.getElementById('ts-modal-apply').onclick = () => {
        let applied = 0;
        diffs.forEach(d => { if(selections[d.id] === 'pasted'){ d.apply(data); applied++; } });
        cleanup(applied);
      };
      document.getElementById('ts-modal-overlay').addEventListener('click', (e) => {
        if(e.target.id === 'ts-modal-overlay') cleanup(false);
      });
    });
  }

  async function compareWithPasted(){
    const pasted = await askLongText('Compare with other app', 'Paste a snapshot exported from the other app (test or live) — you\'ll get to choose which version to keep for each difference before anything changes.');
    if(pasted === null) return;
    const trimmed = pasted.trim();
    if(!trimmed) return;
    let incoming;
    try{ incoming = JSON.parse(trimmed); }
    catch(e){ await showMessage('Compare failed', "That doesn't look like a valid snapshot — make sure you copied the whole thing."); return; }
    const diffs = diffDataSnapshots(data, incoming);
    if(diffs.length === 0){
      await showMessage('No differences', 'This app and the pasted data match exactly.');
      return;
    }
    const result = await showReconcileModal(diffs, { hereModified: data._lastModified, pastedModified: incoming._lastModified });
    if(result === false) return;
    await saveData();
    render();
    await showMessage('Reconciled', `Applied ${result} change${result===1?'':'s'} from the pasted data.`);
  }

  // Builds the Sunday weekly summary email: this week's booking duty, the next three
  // weeks of signups, and open-slot counts for this week — matching the admin's own
  // template. Arrival time is computed automatically from the First tee times schedule.
  async function buildWeeklySummaryEmail(){
    const schedule = buildSchedule();
    if(schedule.length < 9) return null;

    const thisWeek = schedule.slice(0, 3);
    const arrivalTime = arrivalTimeFor(fmtDateKey(thisWeek[0])) || 'time TBD — check with the pro shop';

    const nextThreeWeeks = schedule.slice(0, 9);
    const FULL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dowFull = (d) => ({0:'Sunday',1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday'})[d.getDay()];

    const td = 'style="border:none;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;"';
    const th = 'style="border:none;border-bottom:2px solid #333;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;font-weight:bold;"';
    const tdY = 'style="border:none;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;background-color:#FFFF00;"';
    const thY = 'style="border:none;border-bottom:2px solid #333;padding:5px 9px;font-family:Calibri,Arial,sans-serif;font-size:11pt;font-weight:bold;background-color:#FFFF00;"';
    const tableOpen = '<table style="border-collapse:collapse;margin:8px 0;">';

    // Tee time duties table
    let dutyRows = '';
    thisWeek.forEach(d => {
      const dateLabel = `${d.getDate()}-${MON_NAMES[d.getMonth()]}`;
      // Booking duty is about the date two weeks out, not this row's own date — so it
      // still applies even when this row's date is closed to play. It's the TARGET
      // date's closure that matters, since that's what decides whether there's
      // anything to book at all.
      const target = new Date(d); target.setDate(target.getDate() + BOOKING_WINDOW_DAYS);
      const targetKey = fmtDateKey(target);
      let dutyText;
      if(data.closures[targetKey]){
        dutyText = `Course closed ${FULL_MONTHS[target.getMonth()]} ${target.getDate()} — no tee times needed`;
      } else {
        const targetDuty = dutyForKey(targetKey);
        const targetCount = (data.signups[targetKey] || []).length;
        const targetTT = targetCount > 0 ? Math.min(MAX_TEE_TIMES, Math.ceil(targetCount/PLAYERS_PER_TEE_TIME)) : 0;
        dutyText = targetDuty ? `${esc(firstNameOf(targetDuty.name))} - Get ${targetTT} tee time${targetTT===1?'':'s'} for ${FULL_MONTHS[target.getMonth()]} ${target.getDate()}` : 'Unassigned';
      }
      dutyRows += `<tr><td ${td}>${dateLabel}</td><td ${td}>${dowFull(d)}</td><td ${td}>${dutyText}</td></tr>`;
    });
    const dutyTable = `${tableOpen}<tr><th ${th}>Date</th><th ${th}>Weekday</th><th ${th}>Tee Time Duties (arrive at club at ${esc(arrivalTime)})</th></tr>${dutyRows}</table>`;

    // Signup tables — one per week, third week highlighted yellow
    let weekTables = '';
    for(let w = 0; w < 3; w++){
      const isThird = w === 2;
      const cellStyle = isThird ? tdY : td;
      const headStyle = isThird ? thY : th;
      const weekDates = nextThreeWeeks.slice(w*3, w*3+3);
      const weekStart = weekDates[0];
      let rows = '';
      weekDates.forEach(d => {
        const key = fmtDateKey(d);
        const dateLabel = `${d.getDate()}-${MON_NAMES[d.getMonth()]}`;
        if(data.closures[key]){
          rows += `<tr><td ${cellStyle}>${dateLabel}</td><td ${cellStyle}>${dowFull(d)}</td><td ${cellStyle}>-</td><td ${cellStyle}>Club Closed</td></tr>`;
          return;
        }
        const entries = data.signups[key] || [];
        const capacity = capacityFor(key);
        const { confirmed } = splitConfirmedStandby(entries, capacity);
        const list = capacity != null ? confirmed : entries;
        const names = list
          .map(e => data.roster.find(p => p.id === e.id))
          .filter(Boolean)
          .sort((a,b) => lastNameOf(a.name).localeCompare(lastNameOf(b.name)))
          .map(p => esc(lastNameOf(p.name)));
        rows += `<tr><td ${cellStyle}>${dateLabel}</td><td ${cellStyle}>${dowFull(d)}</td><td ${cellStyle}>${list.length}</td><td ${cellStyle}>${names.join(', ')}</td></tr>`;
      });
      weekTables += `${tableOpen}<tr><th ${headStyle}>Date</th><th ${headStyle}>Weekday</th><th ${headStyle}>#</th><th ${headStyle}>Players signed up for the week of ${FULL_MONTHS[weekStart.getMonth()]} ${weekStart.getDate()}</th></tr>${rows}</table>`;
    }

    // Open slots for this week
    let openSlotItems = '';
    thisWeek.forEach(d => {
      const key = fmtDateKey(d);
      let line;
      if(data.closures[key]) line = `Club is closed on ${dowFull(d)}`;
      else {
        const capacity = capacityFor(key);
        if(capacity == null) line = `Tee times not yet confirmed for ${dowFull(d)}`;
        else {
          const entries = data.signups[key] || [];
          const { confirmed } = splitConfirmedStandby(entries, capacity);
          const open = capacity - confirmed.length;
          line = open <= 0 ? `No slots open on ${dowFull(d)}` : (open === 1 ? `One slot open on ${dowFull(d)}` : `${open} slots open on ${dowFull(d)}`);
        }
      }
      openSlotItems += `<li>${line}</li>`;
    });

    const thirdWeekStart = nextThreeWeeks[6];
    const pStyle = 'style="font-family:Calibri,Arial,sans-serif;font-size:11pt;"';

    const body = [
      `<p ${pStyle}>Gentlemen:</p>`,
      `<p ${pStyle}>Here are the tee time duties for next week:</p>`,
      dutyTable,
      `<p ${pStyle}>Here's who has signed up to play over the next three weeks:</p>`,
      weekTables,
      `<p ${pStyle}>Let John, Geoff and me know as soon as possible if your schedule is incorrect, especially for the third week out (${FULL_MONTHS[thirdWeekStart.getMonth()]} ${thirdWeekStart.getDate()}<sup>th</sup> highlighted in yellow above), so those heading to the club early do not book tee times that go unused.</p>`,
      `<p ${pStyle}>Regarding open slots this coming week:</p>`,
      `<ul ${pStyle}>${openSlotItems}</ul>`,
      `<p ${pStyle}>If your plans change on very short notice, please text or email John, Geoff, Red and me (all four of us please) if you can. That includes deciding to play nine holes or to not play because of cart-paths-only. It helps whoever is trying to set up the match.</p>`,
      `<p ${pStyle}>Thanks.</p>`
    ].join('');

    const recipients = data.roster.filter(p => p.email).map(p => p.email);
    const weekLabel = `${MON_NAMES[thisWeek[0].getMonth()]} ${thisWeek[0].getDate()}`;

    return {
      cc: recipients.join(','),
      subject: `Weekly Tee Time Summary — week of ${weekLabel}`,
      body,
      isHtml: 'true'
    };
  }

  async function prepareWeeklySummary(){
    const row = await buildWeeklySummaryEmail();
    if(!row) return;
    if(!row.cc){
      await showMessage('No recipients', 'No players have an email on file yet.');
      return;
    }
    const approved = await showPreviewModal('Review weekly summary', [row]);
    if(!approved) return;
    const csv = toCSV([row]);
    const stamp = new Date().toISOString().slice(0,10);
    await showExportModal(
      'Weekly summary ready',
      'Download this CSV and point your Sunday scheduled script at it.',
      csv,
      `weekly-summary-${stamp}.csv`,
      'text/csv'
    );
  }

  function toCSV(rows){
    const escCsv = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    const header = 'cc,subject,body,isHtml';
    const lines = rows.map(r => [r.cc, r.subject, r.body, r.isHtml || 'false'].map(escCsv).join(','));
    return [header, ...lines].join('\r\n');
  }

  async function prepareEmailReminders(){
    const rows = buildEmailReminders();
    if(rows.length === 0){
      await showMessage('Nothing to send today', "No one needs a reminder right now — either no one's playing tomorrow, no one's on pro-shop duty today, or the relevant players don't have an email on file.");
      return;
    }
    const approved = await showPreviewModal('Review email reminders', rows);
    if(!approved) return;
    const csv = toCSV(rows);
    const stamp = new Date().toISOString().slice(0,10);
    await showExportModal(
      'Email reminders ready',
      `${rows.length} reminder${rows.length===1?'':'s'} prepared. Download this CSV and point your scheduled script at it.`,
      csv,
      `email-reminders-${stamp}.csv`,
      'text/csv'
    );
  }

  async function importPastedSnapshot(){
    const pasted = await askLongText('Import data snapshot', 'Paste a snapshot copied from an "Export data snapshot" button — or a partial update, like a duty-only file.');
    if(pasted === null) return;
    const trimmed = pasted.trim();
    if(!trimmed) return;
    let incoming;
    try{ incoming = JSON.parse(trimmed); }
    catch(e){ await showMessage('Import failed', "That doesn't look like a valid snapshot — make sure you copied the whole thing."); return; }

    const nameToId = {};
    data.roster.forEach(p => { nameToId[p.name.trim().toLowerCase()] = p.id; });

    // Merge in any new roster names (never removes existing players). Reuse the id
    // from the incoming file when it has one — that's what makes it match the duty and
    // signup entries in the same file. Only generate a fresh id if none was provided.
    let addedPlayers = 0;
    let updatedEmails = 0;
    let updatedHandicaps = 0;
    if(Array.isArray(incoming.roster)){
      incoming.roster.forEach(entry => {
        const name = (entry && typeof entry === 'object') ? entry.name : entry;
        if(!name) return;
        const key = String(name).trim().toLowerCase();
        const email = (entry && typeof entry === 'object' && entry.email) ? entry.email : null;
        const handicapIndex = (entry && typeof entry === 'object' && typeof entry.handicapIndex === 'number') ? entry.handicapIndex : null;
        const courseHandicaps = (entry && typeof entry === 'object' && entry.courseHandicaps && typeof entry.courseHandicaps === 'object') ? entry.courseHandicaps : null;
        const defaultTee = (entry && typeof entry === 'object' && entry.defaultTee) ? entry.defaultTee : null;
        if(!nameToId[key]){
          const id = (entry && typeof entry === 'object' && entry.id) ? entry.id : ('p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
          const newEntry = { id, name: String(name) };
          if(email) newEntry.email = email;
          if(handicapIndex !== null) newEntry.handicapIndex = handicapIndex;
          if(courseHandicaps) newEntry.courseHandicaps = courseHandicaps;
          if(defaultTee) newEntry.defaultTee = defaultTee;
          data.roster.push(newEntry);
          nameToId[key] = id;
          addedPlayers++;
        } else {
          const existing = data.roster.find(p => p.id === nameToId[key]);
          if(existing && email && existing.email !== email){
            existing.email = email;
            updatedEmails++;
          }
          if(existing && (handicapIndex !== null || courseHandicaps || defaultTee)){
            if(handicapIndex !== null) existing.handicapIndex = handicapIndex;
            if(courseHandicaps) existing.courseHandicaps = courseHandicaps;
            if(defaultTee) existing.defaultTee = defaultTee;
            updatedHandicaps++;
          }
        }
      });
    }

    // Merge in signups (id-based, from a full snapshot) — adds only, never clobbers an existing choice
    let addedSignups = 0;
    if(incoming.signups && typeof incoming.signups === 'object'){
      Object.keys(incoming.signups).forEach(dateKey => {
        const entries = incoming.signups[dateKey];
        if(!Array.isArray(entries)) return;
        const list = data.signups[dateKey] || (data.signups[dateKey] = []);
        entries.forEach(e => {
          if(!e || !e.id) return;
          if(list.some(x => x.id === e.id)) return;
          list.push({ id: e.id, holes: HOLES_CYCLE.includes(e.holes) ? e.holes : '18' });
          addedSignups++;
        });
      });
    }

    // Merge in duty assignments — id-based (from a full snapshot) or name-based (from a
    // duty-only spreadsheet export). Each date present in the update overwrites just that
    // date; every other date's assignment is left untouched.
    let updatedDuty = 0;
    const unmatchedNames = [];
    if(incoming.duty && typeof incoming.duty === 'object'){
      Object.keys(incoming.duty).forEach(dateKey => {
        data.duty[dateKey] = incoming.duty[dateKey];
        updatedDuty++;
      });
    }
    if(incoming.dutyByName && typeof incoming.dutyByName === 'object'){
      Object.keys(incoming.dutyByName).forEach(dateKey => {
        const name = incoming.dutyByName[dateKey];
        const id = nameToId[String(name).trim().toLowerCase()];
        if(id){
          data.duty[dateKey] = id;
          updatedDuty++;
        } else {
          unmatchedNames.push(name);
        }
      });
    }

    if(incoming.closures && typeof incoming.closures === 'object'){
      Object.keys(incoming.closures).forEach(dateKey => {
        data.closures[dateKey] = incoming.closures[dateKey];
      });
    }

    if(incoming.confirmedTeeTimes && typeof incoming.confirmedTeeTimes === 'object'){
      Object.keys(incoming.confirmedTeeTimes).forEach(dateKey => {
        data.confirmedTeeTimes[dateKey] = incoming.confirmedTeeTimes[dateKey];
      });
    }

    if(incoming.teeTimeSchedule && typeof incoming.teeTimeSchedule === 'object'){
      Object.keys(incoming.teeTimeSchedule).forEach(dateKey => {
        data.teeTimeSchedule[dateKey] = incoming.teeTimeSchedule[dateKey];
      });
    }

    if(incoming.teeRatings && typeof incoming.teeRatings === 'object'){
      Object.keys(incoming.teeRatings).forEach(teeName => {
        data.teeRatings[teeName] = incoming.teeRatings[teeName];
      });
    }
    if(Array.isArray(incoming.teeOptions) && incoming.teeOptions.length){
      data.teeOptions = incoming.teeOptions;
    }
    if(typeof incoming.handicapEffectiveDate === 'string' && incoming.handicapEffectiveDate){
      data.handicapEffectiveDate = incoming.handicapEffectiveDate;
    }
    if(typeof incoming.handicapUpdatedAt === 'number'){
      data.handicapUpdatedAt = incoming.handicapUpdatedAt;
    }

    // Hole handicaps (stroke index): course-wide, keyed by hole number — a
    // one-time setup import, so any hole present in the pasted file overwrites
    // that hole's rank; holes not mentioned are left as they were.
    let updatedHoleHandicaps = 0;
    if(incoming.holeHandicaps && typeof incoming.holeHandicaps === 'object'){
      Object.keys(incoming.holeHandicaps).forEach(h => {
        const n = parseInt(h, 10);
        const rank = incoming.holeHandicaps[h];
        if(n >= 1 && n <= 18 && typeof rank === 'number' && rank >= 1 && rank <= 18){
          data.holeHandicaps[String(n)] = rank;
          updatedHoleHandicaps++;
        }
      });
    }

    // Red tees have their own stroke index — same shape/import rules as above.
    let updatedHoleHandicapsRed = 0;
    if(incoming.holeHandicapsRed && typeof incoming.holeHandicapsRed === 'object'){
      Object.keys(incoming.holeHandicapsRed).forEach(h => {
        const n = parseInt(h, 10);
        const rank = incoming.holeHandicapsRed[h];
        if(n >= 1 && n <= 18 && typeof rank === 'number' && rank >= 1 && rank <= 18){
          data.holeHandicapsRed[String(n)] = rank;
          updatedHoleHandicapsRed++;
        }
      });
    }

    // Par per hole: display only, same course-wide/one-time-setup shape as hole
    // handicaps above.
    let updatedHolePars = 0;
    if(incoming.holePars && typeof incoming.holePars === 'object'){
      Object.keys(incoming.holePars).forEach(h => {
        const n = parseInt(h, 10);
        const par = incoming.holePars[h];
        if(n >= 1 && n <= 18 && typeof par === 'number' && par >= 3 && par <= 6){
          data.holePars[String(n)] = par;
          updatedHolePars++;
        }
      });
    }

    const removedGhosts = normalizeSignups();
    if(updatedHandicaps > 0) data.handicapUpdatedAt = Date.now();
    await saveData();
    let msg = `Added ${addedPlayers} new player${addedPlayers===1?'':'s'}, updated ${updatedEmails} email${updatedEmails===1?'':'s'}, updated ${updatedHandicaps} handicap${updatedHandicaps===1?'':'s'}, ${addedSignups} new signup${addedSignups===1?'':'s'}, updated ${updatedDuty} booking-duty assignment${updatedDuty===1?'':'s'}, updated ${updatedHoleHandicaps} hole handicap${updatedHoleHandicaps===1?'':'s'}, updated ${updatedHoleHandicapsRed} Red tee hole handicap${updatedHoleHandicapsRed===1?'':'s'}, and updated ${updatedHolePars} hole par${updatedHolePars===1?'':'s'}.`;
    if(removedGhosts > 0) msg += ` Also cleaned up ${removedGhosts} stale signup${removedGhosts===1?'':'s'} left over from removed players.`;
    if(unmatchedNames.length){
      msg += ` Couldn't match: ${[...new Set(unmatchedNames)].join(', ')} — check they're spelled the same as in the roster.`;
    }
    await showMessage('Imported', msg);
  }

  function render(){

    const tomorrowKey = (() => { const t = new Date(today); t.setDate(t.getDate()+1); return fmtDateKey(t); })();

    // Reminders
    const reminders = [];
    if(meId){
      const meName = (data.roster.find(p=>p.id===meId)||{}).name;
      if(meName){
        const tmrDate = schedule.find(d => fmtDateKey(d) === tomorrowKey);
        if(tmrDate){
          const mySignup = findSignup(tomorrowKey, meId);
          if(mySignup){
            const suffix = mySignup.holes === '18' ? '' : ` (${HOLES_LABEL[mySignup.holes]})`;
            reminders.push(`<div class="ts-reminder"><span class="flag">⛳</span><div><b>You're playing tomorrow</b> — ${DOW_NAMES[tmrDate.getDay()]}, ${MON_NAMES[tmrDate.getMonth()]} ${tmrDate.getDate()}${suffix}.</div></div>`);
          }
        }
      }
      schedule.forEach((d) => {
        const duty = dutyForKey(fmtDateKey(d));
        if(duty && duty.id === meId && !data.closures[fmtDateKey(d)]){
          const bookOpenDate = new Date(d); bookOpenDate.setDate(bookOpenDate.getDate() - BOOKING_WINDOW_DAYS);
          if(daysBetween(today, bookOpenDate) === 0){
            const count = (data.signups[fmtDateKey(d)]||[]).length;
            const tt = count > 0 ? Math.min(MAX_TEE_TIMES, Math.ceil(count/PLAYERS_PER_TEE_TIME)) : 0;

    const meHasPin = me && data.playerPins[me.id];

    let html = `

        ${activeSection === 'schedule' ? `

    function renderDateCardHtml(d){
      const key = fmtDateKey(d);
      const signedEntries = data.signups[key] || [];
      const count = signedEntries.length;
      const tt = count > 0 ? Math.min(MAX_TEE_TIMES, Math.ceil(count/PLAYERS_PER_TEE_TIME)) : 0;
      const confirmedCount = data.confirmedTeeTimes[key];
      const capacity = capacityFor(key);

      const mySignup = meId ? findSignup(key, meId) : null;
      const iAmStandby = mySignup && capacity != null && !confirmed.some(e => e.id === meId);
      const isOpen = expanded[key];

      function sortByLastName(entries){
        return [...entries].sort((a,b) => {
          const pa = data.roster.find(r=>r.id===a.id);
          const pb = data.roster.find(r=>r.id===b.id);
          const na = pa ? lastNameOf(pa.name) : '';

        : '';

      const targetDate = new Date(d); targetDate.setDate(targetDate.getDate() + BOOKING_WINDOW_DAYS);

        ? `<span class="ts-duty-static">Course closed ${MON_NAMES[targetDate.getMonth()]} ${targetDate.getDate()} — no tee times needed</span>`

      const teamsHtml = generatedTeams ? `

          ${generatedTeams.teams.map((team, i) => `

              ${team.map(p => {   const teeLabel = p.tee ? `${esc(p.tee)} tee ` : '';   const hcNote = typeof p.courseHandicap === 'number' ? ` <span class="ts-team-so">(${teeLabel}HC ${p.courseHandicap}${typeof p.strokesOff === 'number' ? `, Strokes off ${p.strokesOff}` : ''})</span>` : '';   return `<span class="name-chip">${esc(p.name)}${hcNote}</span>`; }).join('')}

            <div class="ts-team-row">
              <span class="ts-team-num" style="color:var(--rust);">Not in the bet</span>
              ${generatedTeams.notInBet.map(p => {
                const teeLabel = p.tee ? `${esc(p.tee)} tee ` : ''; const hcNote = typeof p.courseHandicap === 'number' ? ` — ${teeLabel}HC ${p.courseHandicap}${typeof p.strokesOff === 'number' ? `, Strokes off ${p.strokesOff}` : ''}` : '';
                return `<span class="name-chip">${esc(p.name)} <span class="ts-team-so">(${esc(p.reason)}${hcNote})</span></span>`;
              }).join('')}
            </div>` : ''}
        </div>` : '';

      const closure = data.closures[key];

      // The "Confirmed: [–]" input used to also be reachable from this card, as a
      // fallback for when a booking day slipped into the past before someone got to
      // the Booking Duty tab. Removed from here per request — entering confirmed
      // tee times now happens only on the Booking Duty tab; this card's top-line
      // badge still shows the confirmed count once it's entered there.

      const countBadge = capacity != null
        ? `${confirmed.length} confirmed${standby.length ? ` <span class="ts-standby-count">+${standby.length} standby</span>` : ''}`
        : `${count} signed up`;
      const teeTimesBadge = confirmedCount
        ? `${confirmedCount} confirmed`
        : `${tt} tee time${tt===1?'':'s'}`;

      const midSection = `
           ${closure
             ? `<div class="ts-closed-line"><span class="closed-flag">🚫</span><span class="closed-text">Course Closed${closure.trim() ? ' — ' + esc(closure) : ''}</span></div>`
             : `<div class="ts-card-mid-top">
             <span class="ts-count">${countBadge}</span>
             <span class="ts-teetimes ${(!confirmedCount && tt===0)?'zero':''}">${teeTimesBadge}</span>
           </div>`}
           <div class="ts-duty">
             <span class="golf-flag">⛳</span>
             ${dutyControl}
           </div>`;

      // "in" option label reflects current or would-be status; "out" option makes

      const inOptionLabel = mySignup

        : (capacity != null && confirmed.length >= capacity ? "Join standby list" : "I'm in");

      return `
        <div class="ts-card ${closure?'closed':''}" data-key="${key}">

            <div class="ts-date-block">
              <div class="ts-date-dow">${DOW_NAMES[d.getDay()]}</div>

              <div class="ts-date-mon">${MON_NAMES[d.getMonth()]}</div>
            </div>
            <div class="ts-card-mid">
              ${midSection}
            </div>
            ${toggleSection}
          </div>
          <div class="ts-players ${isOpen?'open':''}">
            ${namesHtml}
            ${teamsHtml}
            ${isOpen ? adminAddControl : ''}
          </div>
        </div>`;
    }

    if(activeSection === 'schedule' && scheduleSort === 'date'){
    const schedEl = document.getElementById('ts-schedule');
    const effectiveScheduleFilterId = scheduleFilterId === '__me__' ? meId : scheduleFilterId;
    const filteredSchedule = effectiveScheduleFilterId
      ? schedule.filter(d => (data.signups[fmtDateKey(d)] || []).some(e => e.id === effectiveScheduleFilterId))
      : schedule;
    schedEl.innerHTML = (filteredSchedule.length ? filteredSchedule.map((d) => renderDateCardHtml(d)).join('') : `<p class="ts-empty">No dates match this filter.</p>`);
    }

    if(activeSection === 'schedule' && scheduleSort === 'calendar'){
      const calEl = document.getElementById('ts-schedule-calendar');
      const headerHtml = `
        <div class="ts-cal-header">Monday</div>
        <div class="ts-cal-header">Wednesday</div>
        <div class="ts-cal-header">Friday</div>`;
      // Schedule starts from today forward, so if today falls after Monday, the first
      // entry can be a Wednesday or Friday — pad the front with blanks so every card
      // still lines up under its correct weekday column instead of shifting left.
      const firstDow = schedule.length ? schedule[0].getDay() : 1;
      const padCount = firstDow === 3 ? 1 : firstDow === 5 ? 2 : 0;
      const padHtml = `<div class="ts-cal-cell ts-cal-blank"></div>`.repeat(padCount);
      const cardsHtml = schedule.map(d => `<div class="ts-cal-cell">${renderDateCardHtml(d)}</div>`).join('');
      calEl.innerHTML = `<div class="ts-cal-grid">${headerHtml}${padHtml}${cardsHtml}</div>`;
    }

    if(activeSection === 'schedule' && scheduleSort === 'grid'){
      const gridEl = document.getElementById('ts-schedule-grid');
      const roster = sortedRoster();
      const headerCells = roster.map(p => `<th>${esc(lastNameOf(p.name))}</th>`).join('');
      const bodyRows = schedule.map(d => {
        const key = fmtDateKey(d);
        const dateLabel = `${DOW_NAMES[d.getDay()]} ${MON_NAMES[d.getMonth()]} ${d.getDate()}`;
        if(data.closures[key]){
          return `<tr><td class="ts-grid-date">${dateLabel}</td><td class="ts-grid-closed" colspan="${roster.length}">Club Closed</td></tr>`;
        }
        const signedIds = new Set((data.signups[key] || []).map(e => e.id));
        const cells = roster.map(p => `<td>${signedIds.has(p.id) ? esc(p.name) : ''}</td>`).join('');
        return `<tr><td class="ts-grid-date">${dateLabel}</td>${cells}</tr>`;
      }).join('');
      gridEl.innerHTML = `
        <p class="ts-grid-disclaimer">For informational purposes only. Changes to the calendar cannot be made here.</p>
        <div class="ts-grid-wrap">
          <table class="ts-grid-table">
            <thead><tr><th class="ts-grid-date-head">Date</th>${headerCells}</tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>`;
    }

    if(activeSection === 'schedule' && scheduleSort === 'person'){
      const byPersonEl = document.getElementById('ts-schedule-by-person');
      const effectiveScheduleFilterId = scheduleFilterId === '__me__' ? meId : scheduleFilterId;
      const roster = effectiveScheduleFilterId
        ? sortedRoster().filter(p => p.id === effectiveScheduleFilterId)
        : sortedRoster();

      const groupsHtml = roster.map(p => {
        const dates = schedule.filter(d => (data.signups[fmtDateKey(d)] || []).some(e => e.id === p.id));
        const bodyHtml = dates.length ? `
          <table class="ts-person-table">

                const comment = (entry.holes === 'F9' || entry.holes === 'B9') ? HOLES_LABEL[entry.holes] : '';

        return `
          <div class="ts-person-group">
            <h5>${esc(p.name)}</h5>
            ${bodyHtml}
          </div>`;
      }).join('');

      byPersonEl.innerHTML = `<div class="ts-roster-panel">${groupsHtml}</div>`;
    }

    wireEvents();
